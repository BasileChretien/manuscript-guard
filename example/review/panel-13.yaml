rationale: 'A revision round for the positive control. Round 12 found that its interval held
  the null, so it would have passed an analysis that finds nothing. The controls now take
  the third comparator and hepatic injury, ask the interval of each control that expects an
  effect to leave the null out, and stand in a section of the supplement of their own, The
  controls of the analysis, rather than in the main text. The same remit reads the change.'
reviewers:
- id: pharmacoepidemiologist
  role: Pharmacoepidemiologist
  remit: Whether the design can answer the question asked. Case and exposure definitions,
    denominators, the difference between disproportionate reporting and risk, and
    the biases specific to spontaneous reporting.
  why: Its round-12 comment on the positive control is what the change answers.
