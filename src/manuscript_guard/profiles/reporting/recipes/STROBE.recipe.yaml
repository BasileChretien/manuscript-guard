# How to read the STROBE items out of the official checklist document.
#
# The recipe rather than the transcribed text is what this repository ships. Running
# `manuscript-guard transcribe` against your own copy of the official document produces
# the profile locally, identical to everyone else's, and every item is verified to appear
# in the document before the profile is written.

