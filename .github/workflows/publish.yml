name: Publish to PyPI

# A release on PyPI is permanent: a version can be withdrawn, and never replaced or used
# again. So nothing is uploaded on a push or a merge. Publishing a GitHub Release is the one
# act that does it, and CONTRIBUTING.md says how a release is made. `released` and not
# `published`: a release marked as a pre-release fires `published` too, and would put its
# number on PyPI as a final version.
on:
  release:
    types: [released]

permissions: {}

jobs:
  build:
    name: Build the distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          # The whole history, so that the tagged commit can be placed on main below.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: The tag names the version the package carries
        # The tag reaches the script through the environment, never as part of the command.
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: python .github/scripts/check_release_tag.py "$TAG" .
      - name: The commit being built is on main
        # Only main has been through review and the whole of CI. A tag on a branch would
        # publish what neither has seen. HEAD is what the steps below build.
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$(git rev-parse HEAD) is not on main: tag a commit of main"
            exit 1
          fi
      - name: Build a source distribution, and a wheel from it
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
      - name: The wheel holds every file git tracks in the package, and no others
        # CI's wheel job makes this comparison on a wheel built from the checkout. The one
        # uploaded is built from the source distribution, so it is compared too.
        run: python .github/scripts/check_wheel_files.py dist/*.whl .
      - name: Each distribution has a description, of a kind PyPI accepts
        # twine reads the metadata. It does not render Markdown, so this says that a
        # description and its content type are there, not that the page will look right.
        run: twine check --strict dist/*
      - uses: actions/upload-artifact@v5
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # PyPI trusts this workflow file, in this repository, in this environment, and nothing
    # else, so the upload carries no password and no token. The pairing is set on PyPI: as a
    # pending publisher of the account before the first release, and in the project's
    # publishing settings after it. It names this file, so renaming it breaks the upload.
    environment:
      name: pypi
      url: https://pypi.org/project/manuscript-guard/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
