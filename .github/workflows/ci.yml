name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # The build, the import round trip and the checks on what pandoc prints all need pandoc,
  # and each skips without it: before this was set, no test job had pandoc, and none failed
  # for want of it. Every job that runs pytest installs this version, and with the variable
  # set, tests/conftest.py refuses to start unless it is the pandoc on PATH. Set here rather
  # than per step, so a pytest step added later cannot forget it. Pinned, because those
  # tests assert on pandoc's output and a release may print it differently: this is the
  # version they were written against.
  MANUSCRIPT_GUARD_REQUIRE_PANDOC: "3.9.0.2"

jobs:
  test:
    # The gates must hold on the platforms other scientists actually use, and only Windows
    # is available to the author, so the other two are covered here rather than assumed.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: r-lib/actions/setup-pandoc@v2
        with:
          pandoc-version: ${{ env.MANUSCRIPT_GUARD_REQUIRE_PANDOC }}
      - run: pandoc --version
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      # -rs names each test that still skips, and why.
      - run: pytest -q -rs

  plugin-manifests:
    # Validation reads JSON only: no model and no credentials are involved. Two versions,
    # because they disagree: 2.1.119 refuses root keys ($schema, description) that the
    # latest release accepts, so a manifest checked only against the latest can still fail
    # for anyone who has not updated. 2.1.119 is the oldest version the plugin was verified
    # with, and has no --strict; on the latest, --strict turns unknown keys into failures.
    strategy:
      fail-fast: false
      matrix:
        claude: ["2.1.119", "latest"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code@${{ matrix.claude }}
      - run: claude plugin validate ${{ matrix.claude == 'latest' && '--strict' || '' }} .
      - run: claude plugin validate ${{ matrix.claude == 'latest' && '--strict' || '' }} plugin

  r-interop:
    # The results contract is only a contract if a second language can honour it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: jsonlite, digest
      # test_r_emitter.py calls no pandoc, but every pytest run here runs under the same
      # requirement, and setup-r-dependencies leaves apt's older pandoc on PATH, which the
      # requirement refuses. One rule for every job, rather than an exception to remember.
      - uses: r-lib/actions/setup-pandoc@v2
        with:
          pandoc-version: ${{ env.MANUSCRIPT_GUARD_REQUIRE_PANDOC }}
      - run: pip install -e ".[dev]"
      - run: pytest -q tests/test_r_emitter.py

  wheel:
    # Every other job installs editable, which reads src/ where it stands. A data file, a schema
    # or a recipe that git ignores or the build leaves out is present there and missing from
    # `pip install git+https://...`, which is what a user runs. So build the wheel, install it
    # into a fresh venv, run from a directory that is not the checkout, and use the new project
    # the way the README does.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: r-lib/actions/setup-pandoc@v2
        with:
          pandoc-version: ${{ env.MANUSCRIPT_GUARD_REQUIRE_PANDOC }}
      - run: pandoc --version
      - name: Build the wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip wheel . --no-deps --wheel-dir "$RUNNER_TEMP/wheelhouse"
      - name: The wheel holds every file git tracks in the package, and no others
        # A fresh project reads only some of the package's data, so using the wheel (next step)
        # notices some missing files and not others. The lists are compared instead.
        shell: bash
        run: |
          wheel=$(python -c "import glob, os; print(glob.glob(os.path.join(os.environ['RUNNER_TEMP'], 'wheelhouse', '*.whl'))[0])")
          python .github/scripts/check_wheel_files.py "$wheel" .
      - name: Install it into a fresh venv and use it
        shell: bash
        run: |
          wheel=$(python -c "import glob, os; print(glob.glob(os.path.join(os.environ['RUNNER_TEMP'], 'wheelhouse', '*.whl'))[0])")
          expected=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])" | tr -d '\r')
          python -m venv "$RUNNER_TEMP/wheel-venv"
          if [ -d "$RUNNER_TEMP/wheel-venv/Scripts" ]; then
            BIN="$RUNNER_TEMP/wheel-venv/Scripts"
          else
            BIN="$RUNNER_TEMP/wheel-venv/bin"
          fi
          "$BIN/python" -m pip install "$wheel"

          # Away from the checkout, so nothing can be imported from src/.
          cd "$RUNNER_TEMP"
          "$BIN/python" -c "import manuscript_guard as m; assert 'site-packages' in m.__file__, m.__file__"
          installed=$("$BIN/manuscript-guard" --version | tr -d '\r')
          [ "$installed" = "$expected" ] || { echo "installed $installed, pyproject says $expected"; exit 1; }
          "$BIN/manuscript-guard" --help > /dev/null

          "$BIN/manuscript-guard" init smoke --title "Smoke test"
          cd smoke
          "$BIN/manuscript-guard" check
          "$BIN/manuscript-guard" build --offline
          test -s build/manuscript.docx

          # Package data an editable install never misses: the journal template and the checklist
          # recipes, asked for directly (`journal --template` refuses a project whose authors
          # are still the placeholder), and a recipe found by the command that uses it
          # (transcribe then fails on the missing document, which is after it found the
          # recipe). The schemas were read by `check` above.
          "$BIN/python" -c "from manuscript_guard.paths import SHIPPED_JOURNALS as J, SHIPPED_RECIPES as R; assert (J / 'TEMPLATE.yaml').is_file(); assert len(list(R.glob('*.recipe.yaml'))) >= 13"
          out=$("$BIN/manuscript-guard" transcribe STROBE 2>&1 || true)
          [[ "$out" == *STROBE.recipe.yaml* ]] || { echo "$out"; exit 1; }
          hook=$(echo '{}' | "$BIN/manuscript-guard-hook" session-start)
          [[ "$hook" == *SessionStart* ]] || { echo "hook said: $hook"; exit 1; }
