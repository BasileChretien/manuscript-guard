  - reading: hidden
    why: >-
      G14 read the mask with each line feed put back and each carriage return NUL; the
      mask keeps both now in the front matter and a listing, so a file with CRLF line ends
      keeps its carriage returns there too, which every reading of it takes for a space
  - reading: own words
    why: >-
      read from the `hidden` text, which keeps a carriage return in the front matter and a
      listing of a file with CRLF line ends where it was NUL
  - reading: latex mask
    why: >-
      a `\par` TeX reads ends a quotation left open as a blank line does, so a straight `"`
      after it closes nothing and stays as typed; one in a comment, and the letters after
      `\\`, end none; the inputs now hold such quotations (Known gaps, 2026-10-27)
  - reading: latex documents
    why: >-
      a `subfiles` part the paper places by `\subfile` and a `standalone` picture it places
      by `\includestandalone` are read where the command stands, past their preambles, and
      are no longer loose, and the preamble's `\input name` without braces is followed; the
      inputs now hold placed parts and pictures, inside a figure and under headings
      (Known gaps, 2026-10-27)
  - reading: abbreviations
    why: >-
      a short form closing a bracket after a semicolon or a comma is defined by the long
      form before the separator, "(i.e. time to task failure; TTF)", and one after a spaced
      dash, "--" and "---" among them, by the long form before the dash, "Basic Payment
      Scheme - BPS", unless a number, an equals sign or a comma and a number follows it; a
      plain line in capitals that is only a section's name, "2. DISCUSSION", is a heading and
      not an abbreviation; a reference list under the headings "Literature cited" and
      "Reference list", read whole, and under a title in a block quote, a link or after a
      hard line break is passed over; the inputs now hold each shape, those titles among
      them, and a "Reference list screening" heading, which is read (the real-paper corpus
      and round 1 of #623, 2026-11-11). The entry it replaces, for #612, is spent
  - reading: spelling
    why: >-
      a reference list under the headings "Literature cited" and "Reference list", or under
      a title in a block quote, `> **11. REFERENCES**:`, a link,
      `[**References**](#_Ref89712232)`, or a bold title a hard line break opens, is passed
      over, so the spelling of its entries is not read; the inputs now hold these titles
      (the real-paper corpus, 2026-11-11)
  - reading: recycled passages
    why: >-
      a reference list under a title in a block quote, `> **11. REFERENCES**:`, a link,
      `[**References**](#_Ref89712232)`, a bold title a hard line break opens, or the
      heading "Reference list", is set apart, so a passage of the earlier paper repeated in
      its entries is not reported; the inputs now hold these titles (the real-paper corpus
      and round 1 of #623, 2026-11-11). The entry it replaces, for the author-year
      citations of an earlier paper, is spent
  - reading: communicate language
    why: >-
      new with this pull request: `checking.in_english` decides whether a communication
      text is held to the claim ladder and G6 by its front matter's `language`, and the
      base has no such function, so it cannot be asked
  - reading: search words
    why: >-
      after an accent, `\i` is the dotless letter and the letters after it are the word's,
      since an accent's argument is one letter: `pol\^\itica` is searched for as "politica",
      where the longest command, the `\it` of italics, made it "polica"; the lines drawn
      now hold an accent on a dotless i before a t, braced and not
  - reading: plan variables
    why: >-
      the plan's Software section names packages and functions, and G12's data dictionary
      check no longer reads them as variables (#592), as it does not read the Deviations;
      the plans drawn now hold such a section, and headings that only mention software or
      open with one of its words and head something else, which are read as before
  - reading: pdf shown
    why: >-
      a new reading of how a fetched PDF's first page shows it is the cited work: a
      journal's label "Supplement Article" over the title, as Clin Infect Dis and J Infect
      Dis set it, is the work's, where the base refused it as a supplement's head; a head's
      words are read however far apart pdftotext sets them, and "Author's reply" with a
      typeset apostrophe is a reply's head; the inputs draw every label and every head
      (Known gaps F01)
  - reading: plan declarations
    why: >-
      a control held to its expected value, by `holds-expected` or `within`, names the null
      its interval is to leave out where it expects an effect, `null: 0` or `null: 1`, and is
      refused without one or with another value; a `holds-null` control that gives one is
      refused; the reading reports each control's null, and the inputs draw each of these
      (Basile, 2026-11-09, round 1 of wave 3's PR 3)