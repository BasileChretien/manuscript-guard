  - reading: mask
    why: >-
      the Markdown mask keeps the line breaks of the front matter, of a listing and of what
      its patterns match, where it made them NUL, so that a reader of the masked text's
      lines finds each where the file has it (a pipe table under a listing was read a line
      out); a comment's line breaks are NUL still, since pandoc reads a comment, a blank
      line in it too, inside the paragraph it stands in (corpus round, 2026-10-23)
  - reading: hidden
    why: >-
      G14 read the mask with each line feed put back and each carriage return NUL; the
      mask keeps both now in the front matter and a listing, so a file with CRLF line ends
      keeps its carriage returns there too, which every reading of it takes for a space
  - reading: own words
    why: >-
      read from the `hidden` text, which keeps a carriage return in the front matter and a
      listing of a file with CRLF line ends where it was NUL
  - reading: latex mask
    why: >-
      a `\par` TeX reads ends a quotation left open as a blank line does, so a straight `"`
      after it closes nothing and stays as typed; one in a comment, and the letters after
      `\\`, end none; the inputs now hold such quotations (Known gaps, 2026-10-27)
  - reading: latex documents
    why: >-
      a `subfiles` part the paper places by `\subfile` and a `standalone` picture it places
      by `\includestandalone` are read where the command stands, past their preambles, and
      are no longer loose, and the preamble's `\input name` without braces is followed; the
      inputs now hold placed parts and pictures, inside a figure and under headings
      (Known gaps, 2026-10-27)
  - reading: abbreviations
    why: >-
      the brackets this pull request plants: one whose short form is followed by an equals
      sign or a number defines nothing, as before, and one followed by a colon is read
      exactly as before; what differs is the shapes of its earlier commits: a long
      form takes no letter from inside a bracket it opens, and looks for it before that
      bracket; a time of day, "8:30AM", "10:00 PM", is not read as an abbreviation, and
      nothing is reported as undefined in a paragraph set in bold with no small letter or a
      cell of a table's header row with none, a heading typed in capitals; the inputs now
      hold such brackets, times, headings and tables. Then: a glossary under its heading
      defines its entries and its lines are no uses, a caption or a legend restates a
      definition without giving it twice, and a manuscript with no heading is read as one
      text, with no `abbreviation-redefined` (the reading gives no stage, so no
      `no-headings` note); the inputs hold a glossary and captions, and many have no heading
  - reading: recycled passages
    why: >-
      a citation by author and year in parentheses in the earlier paper, "(Smith et al.,
      2019)", is blanked before its words are compared, so it no longer cuts a passage the
      manuscript repeats where the manuscript cites by key; the earlier papers drawn now
      set such citations between words, as they set a reference's number
  - reading: communicate language
    why: >-
      new with this pull request: `checking.in_english` decides whether a communication
      text is held to the claim ladder and G6 by its front matter's `language`, and the
      base has no such function, so it cannot be asked
