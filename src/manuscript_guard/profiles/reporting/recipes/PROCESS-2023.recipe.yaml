# PROCESS 2023, for case series in surgery, read from Table 3 of its statement paper as Europe
# PMC serves the full text. The table gives the forty-two items one to a row, each with its
# number and, on the first row of a topic, the topic's name. Table 1 of the same paper sets the
# 2020 items beside those proposed for 2023, and Table 2 the Delphi scores; neither is the
# checklist. The guideline was written for surgical case series: the descriptive case-series
# design accepts it or Kempen 2011, which has no recipe.
#
# The licence is the paper's in its Europe PMC full text and in Crossref, which both give
# Creative Commons' address for it. Non-commercial and no derivatives: download it and use it,
# and do not share the profile made from it.

