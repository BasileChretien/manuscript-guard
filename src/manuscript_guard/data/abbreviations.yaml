schema: manuscript-guard/abbreviations/1

# Short forms G14 does not ask a manuscript to define.
#
# Short on purpose. Which abbreviations may stand undefined is a journal's decision and a
# field's habit: "CI" after a percentage is left alone by some journals and expanded by
# others, and "PCR" is a word to a molecular biologist and not to a health economist. A long
# list here would decide that for every field at once, and be wrong for most of them. So
# this holds only what is read as a word or a name in general English, and a project adds
# its own under `language: known_abbreviations:` in paper.yaml.
#
# Not listed, because they are read from elsewhere: the names G2 already treats as names
# (`data/terms.yaml` and the project's `terms:`), the reporting guidelines the toolkit has
# a recipe for, and the ones the project declares.

known:
  # Countries and unions
  - UK
  - US
  - USA
  - EU
  - UN

  # Time
  - AM
  - PM
  - BC
  - AD
  - BCE
  - CE
  - UTC
  - GMT

  # Molecules every reader of science takes for words
  - DNA
  - RNA
  - mRNA

  # Things a data-availability statement names
  - DOI
  - URL
  - PDF
  - ID

  # Ordinary English
  - OK
