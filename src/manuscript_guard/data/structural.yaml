schema: manuscript-guard/structural/1

# Numbers that point at something rather than measure something: cross-references,
# categorical labels and list markers.
#
# Each pattern is matched against the whole line, and an atom counts as structural only
# when the match covers it. That is what distinguishes "grade 3" from the "12" in
# "grade 3 events occurred in 12 patients" — the first is a label, the second is a result
# and must be bound.

structural:
  - id: cross-reference
    why: A pointer to a table, figure or section.
    pattern: '(?i)\b(?:table|tables|figure|figures|fig\.?|figs\.?|appendix|annex|box|panel|equation|eq\.?|section|chapter|step|item|supplementary\s+(?:table|figure|file|material|method)s?|supplement|additional\s+file)\s*[-–]?\s*S?\d+[A-Za-z]?\b'

  - id: supplement-tag
    why: Supplement identifiers of the form S1, S2.
    pattern: '\bS\d+[A-Za-z]?\b'

  # Both of these rules read `<keyword> <digits>`, and a rule that spans an atom accepts it,
  # so an unbounded `\d+` handed the gate any number that happened to follow one of these
  # words. "In the exposed arm 47 hepatic events", "over the study years 1204 reports" and
  # "the pooled cohort 3841 reports" all filed the count as a category label — ordinary
  # English word order, needing only a missing comma. The magnitudes are now bounded to what
  # a label can actually be, which is the same correction `age-band` and `rate-denominator`
  # needed: name the values, do not match a shape.
  - id: categorical-label
    why: An ordinal category naming a class of thing, not a measurement of it.
    # 0-20. There is no grade 47 and no arm 3841; past twenty it is a count, not a class.
    pattern: '(?i)\b(?:phase|grade|stage|type|class|line|round|wave|tier|level|version|arm|group|cohort|model|scenario|quartile|quintile|tertile|decile)\s*[≥≤<>]?\s*(?:\d|1\d|20)[A-Za-z]?\b'

  - id: time-label
    why: A named timepoint or window, e.g. day 30, 30-day, week 12.
    # Up to three digits: day 365 is a real window, year 1204 is not. Four digits would also
    # re-admit the bare year that this toolkit insists on treating as data.
    pattern: '(?i)\b(?:day|week|month|year|hour|minute|visit|cycle)s?\s*[-–]?\s*\d{1,3}\b|\b\d{1,3}\s*[-–]\s*(?:day|week|month|year|hour|minute)\b'

  - id: ordered-list-marker
    why: Markdown list numbering.
    pattern: '^\s{0,3}\d+[.)]\s'

  - id: numbered-heading
    why: Markdown heading numbering.
    pattern: '^#{1,6}\s+\d+(?:\.\d+)*[.)]?\s'

  - id: author-year-citation
    # Audit only. The pattern spans a whole parenthetical, and a rule that spans an atom
    # accepts it, so in manuscript source this would file every number sharing a bracket
    # with a year — "(Smith 2019, n = 412)" — as structural. Source citations are [@key]
    # and already masked, so the rule is pure cost there.
    audit_only: true
    why: >-
      A rendered author-year citation. In manuscript source a citation is [@key] and gets
      masked, but a built document has already been through citeproc, so auditing an
      existing paper meets "(Smith and Jones 2019)" as ordinary text. Without this every
      citation in the paper is reported as an unexplained number.
    pattern: '\((?:[^()]{0,80}?[A-Za-z][^()]{0,80}?)?\b(?:19|20)\d{2}[a-z]?(?:[;,]\s*[^()]{0,60})?\)|\b[A-Z][A-Za-z''-]+\s+(?:et al\.?|and\s+[A-Z][A-Za-z''-]+)\s*,?\s*\(?(?:19|20)\d{2}[a-z]?\)?'

  - id: age-band
    why: An age or duration band is a category label, not a measured value.
    # The last branch used to end `(?:years?)?` — optional, so a bare `<digits>+` anywhere
    # matched it and `The trial enrolled 500+ patients` was filed as an age band. The unit
    # is now required, which is what the `why` above always claimed.
    pattern: '(?i)\b(?:age[ds]?|aged|years?|months?|weeks?)\s*(?:group|band|range)?\s*[:,]?\s*\d+\s*(?:[-–—]\s*\d+|\+)|\b\d+\s*[-–—]\s*\d+\s*(?:years?|months?|weeks?|days?)\b|\b\d+\+\s*(?:years?|months?|weeks?|days?)\b'

  - id: citation-locator
    why: >-
      A page, chapter or figure locator inside a citation bracket. Citation *keys* are
      masked; the rest of the bracket is read, because pandoc renders it - which is how a
      fabricated interval once travelled into the document inside a citation suffix. A
      locator is the one thing legitimately written there, so it is named rather than
      masked with everything else.
    pattern: '(?i)\b(?:pp?|chap|ch|sec|s|fig|figs|vol|no|para|paras|art|tab)\.\s*\d+(?:\s*[-\u2013\u2014]\s*\d+)?'

  - id: table-alignment-row
    why: Markdown table separator rows.
    pattern: '^\s*\|?[\s:|-]+\|[\s:|-]*$'
