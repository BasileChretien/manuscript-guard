schema: manuscript-guard/terms/1

# Tokens that contain digits but are names: genes, receptors, pathogens, coding systems,
# scales, drugs. A term matches when it accounts for every digit in the atom, so
# "COVID-19-related" is covered by covid-19 while "CYP3A4/7" is not covered by cyp3a4 and
# will be reported until 3a7 is added too. Erring towards reporting is deliberate.
#
# Projects extend this through `terms:` in paper.yaml.

