name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # The build, the import round trip and the checks on what pandoc prints all need pandoc,
  # and each skips without it: before this was set, no test job had pandoc, and each passed
  # having run none of them. Every job installs this version, and with the variable set,
  # tests/conftest.py refuses to start unless it is the pandoc on PATH. Set here rather
  # than per step, so a pytest step added later cannot forget it. Pinned, because those
  # tests assert on pandoc's output and a release may print it differently: this is the
  # version they were written against.
  MANUSCRIPT_GUARD_REQUIRE_PANDOC: "3.9.0.2"

jobs:
  test:
    # The gates must hold on the platforms other scientists actually use, and only Windows
    # is available to the author, so the other two are covered here rather than assumed.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: r-lib/actions/setup-pandoc@v2
        with:
          pandoc-version: ${{ env.MANUSCRIPT_GUARD_REQUIRE_PANDOC }}
      - run: pandoc --version
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      # -rs names each test that still skips, and why.
      - run: pytest -q -rs

  plugin-manifests:
    # Validation reads JSON only: no model and no credentials are involved. Two versions,
    # because they disagree: 2.1.119 refuses root keys ($schema, description) that the
    # latest release accepts, so a manifest checked only against the latest can still fail
    # for anyone who has not updated. 2.1.119 is the oldest version the plugin was verified
    # with, and has no --strict; on the latest, --strict turns unknown keys into failures.
    strategy:
      fail-fast: false
      matrix:
        claude: ["2.1.119", "latest"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code@${{ matrix.claude }}
      - run: claude plugin validate ${{ matrix.claude == 'latest' && '--strict' || '' }} .
      - run: claude plugin validate ${{ matrix.claude == 'latest' && '--strict' || '' }} plugin

  r-interop:
    # The results contract is only a contract if a second language can honour it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: jsonlite, digest
      # test_r_emitter.py calls no pandoc, but every pytest run here runs under the same
      # requirement, and setup-r-dependencies leaves apt's older pandoc on PATH, which the
      # requirement refuses. One rule for every job, rather than an exception to remember.
      - uses: r-lib/actions/setup-pandoc@v2
        with:
          pandoc-version: ${{ env.MANUSCRIPT_GUARD_REQUIRE_PANDOC }}
      - run: pip install -e ".[dev]"
      - run: pytest -q tests/test_r_emitter.py
