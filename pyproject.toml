[build-system]
# hatch-fancy-pypi-readme writes the description PyPI shows from README.md: see the hook
# below for why the README cannot be handed over as it is.
requires = ["hatchling", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

[project]
name = "manuscript-guard"
# The same number as the plugin (plugin/.claude-plugin/plugin.json and the marketplace entry)
# and as `manuscript_guard.__version__`; tests/test_version.py holds the four equal. The
# plugin's skills call this tool, and `pip install --upgrade` decides on this number, so a
# plugin bump that leaves it behind ships skills to a tool that cannot be upgraded to match.
version = "0.2.436"
description = "Make every number in a scientific manuscript traceable to its source."
dynamic = ["readme"]
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Basile Chrétien" }]
keywords = ["reproducibility", "manuscript", "provenance", "zotero", "pandoc", "science"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
  "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = ["PyYAML>=6.0", "jsonschema>=4.0"]

[project.optional-dependencies]
# ruff is pinned exactly. An unpinned linter means CI can start failing on a commit that
# changed nothing, which teaches everyone to ignore CI.
# matplotlib is not a dependency of the toolkit. It is here because the test suite builds
# the worked example, and the example's figure script draws with it.
# hatchling is the build backend, and hatch-fancy-pypi-readme its plugin for the description.
# They are here so that the tests which build a wheel, to see that it carries the skills and
# a description PyPI can show, can do so without the network; where either is absent those
# tests are skipped.
# hypothesis draws the generated inputs of tests/test_properties.py and
# tests/test_differential.py, and is pinned exactly for the reason ruff is. The inputs a
# test draws are fixed by its own source and by the release of Hypothesis, so an unpinned
# one would draw other inputs under a commit that changed nothing, and a failure nobody
# caused would turn up in somebody's pull request. tests/generated.py also replaces one
# internal of it, and says why; raise the pin on purpose, with that file open.
# statsmodels, like matplotlib, is the example's and not the toolkit's: the example fits the
# model G15 reads, and `em.model` imports nothing until it is handed a fit.
dev = [
  "pytest>=7.0",
  "ruff==0.16.1",
  "matplotlib>=3.7",
  "statsmodels>=0.14",
  "hatchling",
  "hatch-fancy-pypi-readme>=24.1",
  "hypothesis==6.168.5",
]

[project.scripts]
manuscript-guard = "manuscript_guard.cli:main"
mguard = "manuscript_guard.cli:main"
# Separate from the CLI on purpose: the submission guard fires on every shell command, and the
# hook module imports nothing heavy until it knows it has work to do.
manuscript-guard-hook = "manuscript_guard.hooks:main"

[project.urls]
Homepage = "https://github.com/BasileChretien/manuscript-guard"
Source = "https://github.com/BasileChretien/manuscript-guard"
Issues = "https://github.com/BasileChretien/manuscript-guard/issues"

# The README links to pages and pictures beside it, by relative path, which is what GitHub
# shows and what tests/test_docs.py can hold to the files. PyPI shows the same text on a page
# with nothing beside it, where every one of those links and pictures is dead. So the
# description is built from the README with each relative target pointed at the repository,
# at the tag of the version being built: .github/workflows/publish.yml tags a release `v`
# and its number before it uploads.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

#
# Both patterns read the text, not Markdown. One would rewrite a link or a picture written
# inside a code block, and neither sees a link that carries a title (`[x](y "title")`),
# which stays relative. The README has neither, and tests/test_docs.py fails if a relative
# target reaches the description.

# A picture: the file itself, which the page loads. One that already names a scheme
# (`https:`, `data:`) is left alone.
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(src|srcset)="(?![A-Za-z][A-Za-z0-9+.-]*:)([^"]+)"'
replacement = '\1="https://raw.githubusercontent.com/BasileChretien/manuscript-guard/v$HFPR_VERSION/\2"'

# A link to a file or a folder: its page on GitHub. A link that names a scheme (`https:`,
# `mailto:`) and one to a place on the page itself (`#status`) are left alone.
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?![A-Za-z][A-Za-z0-9+.-]*:|#)([^)\s]+)\)'
replacement = '](https://github.com/BasileChretien/manuscript-guard/blob/v$HFPR_VERSION/\1)'

[tool.hatch.build.targets.wheel]
packages = ["src/manuscript_guard"]
# The checklist recipes live inside the package rather than at the repository root, so the
# wheel carries them. They did not, and `manuscript-guard fetch STROBE` — the second command
# in the README's own walkthrough — answered "no recipe for 'STROBE'" on every installed
# copy. Only a source checkout worked. Belt and braces: hatchling ignores VCS-ignored files,
# and .gitignore excludes generated profiles by path from the repository root.
artifacts = ["src/manuscript_guard/profiles/**/*.yaml"]

# The skills have one home, plugin/skills, which is where Claude Code and Codex install them
# from. The wheel takes the same files, so that `manuscript-guard install-skills` can copy
# them for an agent tool that reads a folder of skills and has no plugin. Nothing under src/
# holds a second copy: the package finds them here in a checkout (skillcopy.shipped).
[tool.hatch.build.targets.wheel.force-include]
"plugin/skills" = "manuscript_guard/skills"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
# Stated rather than inferred. Whether a src-layout package counts as first-party depends
# on how ruff resolves the project root, and it resolved differently on CI than locally:
# the same files passed here and failed there, with the import block sorted two ways.
known-first-party = ["manuscript_guard"]
