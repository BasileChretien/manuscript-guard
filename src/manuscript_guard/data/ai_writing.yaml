schema: manuscript-guard/ai-writing/1

# Signs that prose was written by a language model, adapted for scientific manuscripts.
#
# Derived from the English Wikipedia essay "Signs of AI writing", read 2026-08-03, and read
# again 2026-10-15 for the placeholders and the communication with the user of a chat:
# https://en.wikipedia.org/wiki/Wikipedia:Signs_of_AI_writing
#
# Three things had to change on the way from Wikipedia to a journal article.
#
# Much of the source is Wikipedia-specific — wikitext, categories, edit summaries — and is
# dropped. What remains is vocabulary, sentence shape, formatting and tone.
#
# Most of the flagged words are ordinary scientific English. "Robust" describes a standard
# error, "significant" has a technical meaning, "key" and "highlight" are unremarkable once.
# Flagging each occurrence would produce a gate that has to be switched off to finish a
# paper, so those are measured as a RATE and reported only above a threshold. Six
# "crucial"s in four hundred words is a tell; one is a word.
#
# And a manuscript can be checked for something an encyclopedia cannot: vague attribution
# is only vague when no citation follows it. "Studies have shown" beside [@smith2020] is
# just prose.

# Unambiguous. These are model output artefacts and have no innocent reading.
artefacts:
  - id: chatgpt-markers
    pattern: 'contentReference|oaicite|oai_citation|turn\d+(?:search|view)\d+|attributableIndex'
    why: ChatGPT citation markup left in the text
  - id: gemini-markers
    pattern: '\[cite:\s*\d+\]|\[span_\d+\]\(start_span\)'
    why: Gemini citation markup left in the text
  - id: grok-markers
    pattern: 'grok_card|grok_render_citation_card_json'
    why: Grok markup left in the text
  - id: perplexity-markers
    pattern: 'ppl-ai-file-upload|attached_file'
    why: Perplexity markup left in the text
  - id: writing-fence
    pattern: ':::writing'
    why: A model's internal fence left in the text
  # The placeholders. Each is a kind of slot, not a list of spellings, and each is also read
  # in the text of the figures, the tables' captions and the cited references (`elsewhere`),
  # since a slot left there reaches the document as surely as one in the manuscript.
  #
  # A slot in brackets: an instruction to the writer, "[insert the date]", "[describe the
  # cohort]", which a hard wrap may cut across one line end; a thing to be supplied,
  # "[Repository]", "[DOI/accession]", "[citation needed]"; or capitals that say something is
  # still to come, "[TO BE COMPLETED]", "[CLAIM NEEDS EVIDENCE]". Not capitals that say
  # nothing of the kind: an abbreviation nested in parentheses, "[SJS/TEN]", or a title in
  # capitals. A thing named is not a slot where it is a link's text, "[repository](https://...)",
  # its definition, "[repository]: https://...", or a bracketed span, "[NB]{.smallcaps}"; an
  # instruction is, wherever it stands, "[insert the date]{.mark}" as on main. The verb is
  # followed by a space or the bracket, so a title translated into English in brackets,
  # "[Add-on therapy in epilepsy]", is no slot. "[Your ...]" is one in the manuscript only:
  # PubMed's translated titles open so, "[Your diagnosis?]".
  - id: placeholder
    pattern: '(?i)\[(?:insert|add|describe|replace|fill|enter|specify)(?:\s(?:[^\]\n]|\n(?![ \t]*\n)){0,60})?\]'
    why: Unfilled placeholder text
    elsewhere: true
  - id: placeholder-your
    pattern: '(?i)\[your(?:\s(?:[^\]\n]|\n(?![ \t]*\n)){0,60})?\]'
    why: Unfilled placeholder text
  - id: placeholder-slot
    pattern: '(?i)\[(?:placeholder|accession(?:\s+(?:number|code|id))?|repository|doi(?:\s*/\s*accession)?|citation(?:\s+needed)?|reference|url|link)\](?![(\[{]|:[ \t]*<?[a-z][a-z0-9+.-]*://)'
    why: Unfilled placeholder text
    elsewhere: true
  - id: placeholder-capitals
    pattern: '\[(?=[A-Z \t/–-]*\b(?:TO[ \t]+(?:BE[ \t]+)?(?:COMPLETED?|ADDED|CONFIRMED|DETERMINED|DECIDED|FILLED|UPDATED|WRITTEN|CHECKED|VERIFIED|SUPPLIED|PROVIDED)|NEEDED|NEEDS|PLACEHOLDER|INSERT|TBD|TBC|TODO|VERIFY|PENDING|MISSING|FILL)\b)[A-Z][A-Z \t/–-]*\](?![(\[{]|:[ \t]*<?[a-z][a-z0-9+.-]*://)'
    why: Unfilled placeholder text
    elsewhere: true
  # Text left to stand in for text, and instructions left for the writer. "Replace later" only
  # where the phrase ends: at a stop, or at a line end before a blank line, a list item, a
  # table row or the end of the file. So "drugs that replace later lines of therapy" is prose,
  # hard-wrapped after "later" or not. "Discussion prompt" only as
  # a label, since a paper on teaching ends its cases with discussion prompts.
  - id: placeholder-filler
    pattern: '(?i)\blorem\s+ipsum\b|\b(?:fill|replace)\s+(?:this\s+|it\s+)?(?:in\s+)?later(?=[ \t]*(?:[.)\]:;,]|\r?\n[ \t]*(?:\r?\n|\Z|[-*+][ \t]|\d+[.)][ \t]|\|)|\Z))|\bthis\s+section\s+is\s+a\s+template\b|\bdiscussion\s+prompts?[ \t]*:|\bdelete\s+this\s+(?:section|paragraph)\b|\badd\s+your\s+[^.\n]{1,40}?\s+here\b'
    why: Unfilled placeholder text, or an instruction left for the writer
    elsewhere: true
  # A journal template's instructions to its authors, which papers are printed with: "In this
  # section you can acknowledge any support given ...", "This section may be divided by
  # subheadings", "Please add: "This research received no external funding" ...", and Word's
  # "Click or tap here to enter text." No kind of sentence tells such an instruction from
  # prose, since "authors should report the interval" is both, so each is found by its
  # template's own words, the opening of each instruction, read 2026-10-21 in the templates
  # of MDPI, Frontiers, PLOS, BMC, Springer Nature, Elsevier and Wiley; and only words that
  # none of the 399 papers by people of `tools/g6_baseline.py` writes, but for the two
  # printed with MDPI's, nor any of the 18,335 works they cite. MDPI's back matter is found
  # by what follows "in this section" and the statement it offers for copying, and not by
  # "In this section, please" or 'please state "' alone, which a questionnaire a paper
  # reproduces writes too: "In this section, please indicate how often ...", 'If none,
  # please state "not applicable"'. Nor PLOS's "Click here for additional data file".
  - id: placeholder-template
    pattern: |-
      (?ix)\b(?:
      # MDPI's back matter: "In this section you can acknowledge any support given ...", and
      # 'Please add: "This research received no external funding"', 'Declare conflicts of
      # interest or state "The authors declare no conflicts of interest."'.
      in\s+this\s+section,?\s+(?:you\s+can\s+acknowledge\s+any\s+support
        |(?:you\s+should|please)\s+add\s+the\s+institutional\s+review\s+board
        |please\s+provide\s+details\s+regarding\s+where\s+data)\b
      |(?:please\s+(?:add|state)|or\s+state)[ \t]*:?\s*["“'‘`]{1,2}[ \t]*
        (?:this\s+research|the\s+(?:study|animal\s+study|authors)|informed\s+consent
        |written\s+informed|ethical\s+review|patient\s+consent)\b
      # Word's prompt in a field left empty: "Click or tap here to enter text."
      |(?-i:C)lick\s+(?:or\s+tap\s+)?(?:here\s+)?to\s+enter\s+(?:text|a\s+date)\.
      # MDPI.
      |this\s+section\s+(?:may\s+be\s+divided\s+by\s+subheadings|is\s+not\s+mandatory)\b
      |the\s+appendix\s+is\s+an\s+optional\s+section\b
      |a\s+single\s+paragraph\s+of\s+about\s+\d+\s+words\s+maximum\b
      |we\s+strongly\s+encourage\s+authors\s+to\s+use\s+the\s+following\s+style\b
      |list\s+three\s+to\s+ten\s+pertinent\s+keywords\b
      |keyword\s*1\s*[;,]\s*keyword\s*2\b
      |the\s+introduction\s+should\s+briefly\s+place\s+the\s+study\b
      |materials\s+and\s+methods\s+should\s+be\s+described\s+with\s+sufficient\s+details?\s+
        to\s+allow\s+others\s+to\s+replicate\b
      |publication\s+of\s+your\s+manuscript\s+implicates\b
      |please\s+state\s+that\s+they\s+will\s+be\s+provided\s+during\s+review\b
      |authors\s+should\s+discuss\s+the\s+results\s+and\s+how\s+they\s+can\s+be\s+interpreted\b
      |for\s+research\s+articles\s+with\s+several\s+authors\b
      |please\s+turn\s+to\s+the\s+CRediT\s+taxonomy\b
      |use\s+the\s+standard\s+spelling\s+of\s+funding\s+agency\s+names\b
      |you\s+might\s+(?:also\s+)?choose\s+to\s+exclude\s+this\s+statement\b
      |involving\s+humans\s+should\s+contain\s+this\s+statement\b
      |we\s+encourage\s+all\s+authors\s+of\s+articles\s+published\s+in\b
      |authors\s+must\s+identify\s+and\s+declare\b
      |where\s+GenAI\s+has\s+been\s+used\s+for\s+purposes\s+such\s+as\b
      |the\s+template\s+details\s+the\s+sections\b
      |schemes\s+follow\s+the\s+same\s+formatting\b
      |tables\s+should\s+be\s+placed\s+in\s+the\s+main\s+text\s+near\b
      |tables\s+may\s+have\s+a\s+footer\b
      # Frontiers.
      |for\s+full\s+guidelines\s+regarding\s+your\s+manuscript\b
      |the\s+abstract\s+should\s+render\s+the\s+general\s+significance\b
      |keyword,\s*keyword,\s*keyword\b
      |the\s+introduction\s+should\s+be\s+succinct,?\s+with\s+no\s+subheadings\b
      |please\s+refer\s+to\s+the\s+article\s+types\b
      |equations\s+should\s+be\s+inserted\s+in\s+editable\s+format\b
      |requires\s+figures\s+to\s+be\s+submitted\s+individually\b
      |please\s+build\s+your\s+table\b
      |in\s+your\s+current\s+manuscript\b
      |section\s+is\s+mandatory\s+for\s+all\s+articles\b
      |details\s+of\s+all\s+funding\s+sources\s+should\s+be\s+provided\b
      |please\s+ensure\s+to\s+add\b
      |this\s+is\s+a\s+short\s+text\s+to\s+acknowledge\b
      |should\s+be\s+uploaded\s+separately\s+on\s+submission\b
      |enter\s+the\s+caption\s+for\s+your\s+figure\b
      # PLOS.
      |bold\s+the\s+(?:figure\s+|table\s+)?title(?:\s+sentence)?[ \t]*\.
      |add\s+descriptive\s+text\s+after\s+the\s+title\b
      # BMC, where "Text for this section" opens a sentence, with its capital, and ends one:
      # a hard wrap puts "text" at a line's start in prose.
      |(?-i:T)ext\s+(?:and\s+results\s+)?for\s+this\s+section
        (?:[ \t]*(?:\.|…|\\ldots)|,\s+as\s+per\b)
      |sample\s+(?:article|figure|table|additional\s+file)\s+title\b
      |additional\s+file\s+descriptions?\s+text\b
      # Springer Nature.
      |sample\s+body\s+text\b
      |example\s+(?:for\s+)?(?:theorem|proposition|definition|proof)\s+text\b
      |authors\s+are\s+advised\s+to\s+check\s+the\s+author\s+instructions\b
      |some\s+overlap\s+with\s+the\s+abstract\s+is\s+acceptable\b
      |topical\s+subheadings\s+are\s+allowed\b
      |discussions\s+should\s+be\s+brief\s+and\s+focused\b
      |please\s+refer\s+to\s+journal-level\s+guidance\b
      |conclusions\s+may\s+be\s+used\s+to\s+restate\s+your\b
      |please\s+state\s+so\s+here\b
      |acknowledge?ments\s+are\s+not\s+compulsory\b
      |the\s+journal\s+to\s+which\s+you\s+are\s+submitting\b
      |not\s+relevant\s+to\s+your\s+manuscript\b
      |for\s+sample\s+purpose\b
      # Elsevier, where "Section text." is a line's first words, with its capital.
      |research\s+highlight\s+[1-9]\b
      |(?<![^\n])(?-i:Abstract|Section|Subsection|Subsubsection)\s+text\.(?!\S)
      # Wiley.
      |this\s+is\s+sample\s+(?:for|abstract)\b
      |this\s+is\s+the\s+sample\s+(?:article\s+title|figure\s+caption|table\s+caption)\b
      |example\s+for\s+quote\s+text\b
      )
    why: A journal template's instruction to its authors, left in the text
    elsewhere: true
  # The words that mark a gap: TODO, TBD, FIXME, a doubled TKTK (a single "TK" is a kinase in
  # medicine), a run of X, "n = XXXX", a date of Xs, "2025-XX-XX", and a name in capitals
  # joined by underscores, "INSERT_SOURCE_URL". A karyotype, 45 to 49 chromosomes and then the
  # Xs, "47,XXX", and "XXX syndrome" are no gap; "1,XXX reports", a count of thousands, is. In the manuscript in any case, as they always were. Elsewhere in capitals only:
  # "Todo" opens many a Spanish title.
  - id: placeholder-word
    pattern: '\b(?:TODO|TBD|FIXME|TKTK)\b|(?<!\b4[5-9],)(?<!\b4[5-9], )\bX{3,}\b(?!\s+syndrome)|\b\d{4}-XX\b|\b(?:INSERT|PASTE)_[A-Z0-9_]+\b'
    why: Unfilled placeholder text
    elsewhere: true
    any_case_in_manuscript: true
  - id: knowledge-cutoff
    # A word processor curls the apostrophe, here and in the next (round 2 of #339).
    pattern: "(?i)\\b(?:as of my (?:last )?(?:knowledge|training)|my training data|I don['’]t have access to)\\b"
    why: A model disclaiming its own limits, left in the manuscript
  - id: assistant-voice
    pattern: '(?i)^\s*(?:certainly|sure|of course|here(?:[''’]s| is) (?:the|a|an)\b)'
    why: Chat-assistant register, left in the manuscript

# Words written to the reviewers, or to a model, that end up in the paper: "As requested by
# Reviewer 2, we added ...", "In the previous version of this manuscript ...", "We have now
# clarified ...", "I have shortened the abstract". They belong in the response to the
# reviewers, which `respond` writes and G6 never reads: the paper's reader never saw the
# review. Each is reported wherever it stands, as an artefact is, and not counted by rate,
# since one is enough. Taken, and narrowed, from the `process_residue` rules of Writing Guard
# (ATTRIBUTION.md).
#
# Two kinds (Basile, 2026-10-20). A rule marked `self_reference` matches only words that
# answer one reviewer or the editor, that point at this manuscript, its earlier version or
# its lines, or that a model wrote to its user: they warn while the paper is written and
# fail at submission. The others match what a paper about peer review also writes of the
# papers it studied, "the revised manuscript", "in response to the reviewers' comments":
# they warn at every stage. A rule reads one paragraph at a time, in the prose as the phrase
# rules read it, so that nothing in a comment, a listing or a citation is reported.
#
# What they must not take, each kept as a passing case and most from published papers
# (tests/test_writing.py): a name, "the Revised Cardiac Risk Index", "the 1987 ACR revised
# criteria", "the 10th revision"; the authors' contributions, "drafted the initial
# manuscript", "revised the original manuscript"; the acknowledgements, "comments on an
# earlier version of this manuscript", "two anonymous reviewers for their helpful comments";
# a journal's notices, "the editors and the reviewers"; and prose, "To address this concern,
# we", "previous studies", "we now report", "Reviewer 1 and Reviewer 2 independently
# extracted the data". Not "to address the concern" nor "to avoid confusion", which Writing
# Guard takes: 38 of 399 papers by people say "to address this issue" or its like.
#
# A `{{name}}` in a pattern stands for the words of that name below, in a group of its own,
# and may stand in those words once more. Every pattern that uses them is verbose, `(?x)`,
# so their spaces and line ends are not read.
residue_words:
  # One reviewer, or the editor: "the reviewer", "the second referee", "Reviewer #2",
  # "Referee B". A reviewer is singular here only with "the" or a number, since "a third
  # reviewer resolved disagreements" is how a systematic review's Methods are written.
  one: |-
    the\s+(?:(?:first|second|third|fourth|fifth|other|statistical|clinical|methodological|
      academic|associate|handling|guest|deputy|senior|section)\s+)?
      (?:reviewer|referee|editor(?:-in-chief)?)\b(?!['’]s\s+(?:invitation|call|note|choice))
    |{{numbered}}
  # A reviewer by number, which a printed acknowledgement never gives.
  numbered: |-
    (?:reviewer|referee)\s*(?:\#\s*|no\.?\s*)?(?:\d{1,2}|(?-i:[IVX]{1,4}|[A-D]))\b
    |(?:reviewer|referee)\s+(?:one|two|three|four|five)\b
  # More than one, or one not named: "the reviewers", "one of the reviewers", "an anonymous
  # referee", "reviewer comments".
  many: |-
    (?:the|our)\s+(?:\w+\s+)?(?:reviewers|referees|editors)\b
    |(?:one|each|both|all|two|three|four|several|some|many|either|neither|other)\s+
      (?:of\s+(?:the|our)\s+)?(?:\w+\s+)?(?:reviewers?|referees?)\b
    |an?\s+(?:\w+\s+)?(?:reviewer|referee)\b
    |(?:reviewers?|referees?)\b
  # What a reviewer says.
  speech: |-
    comments?|suggestions?|requests?|concerns?|points?|quer(?:y|ies)|questions?|remarks?
    |recommendations?|criticisms?|critiques?|feedback|observations?|advice|input
  # An answer, which needs no word for what was said: "in response to the reviewer".
  answer: |-
    in\s+(?:response|reply|answer)\s+to|(?:our\s+)?(?:response|reply|answer)\s+to
    |respond(?:ing)?\s+to|repl(?:y|ying|ied)\s+to|to\s+address
    |at\s+the\s+(?:request|suggestion|behest)\s+of
    |on\s+the\s+(?:advice|suggestion|recommendation|request)\s+of
  # A word that says nothing of an answer without what was said: "following the reviewer's
  # suggestion", where "following the reviewers' training" is a review's Methods.
  after: |-
    following|per|as\s+per|according\s+to|addressing|to\s+answer|answering|in\s+line\s+with
    |based\s+on|prompted\s+by|after
  # What was done at someone's word: "as suggested by", "pointed out by". Not "noted by"
  # alone, which a review writes of its second reader.
  by: |-
    (?:as\s+(?:requested|suggested|recommended|proposed|advised|asked|pointed\s+out|noted|raised
      |indicated|mentioned|highlighted)
    |(?:requested|suggested|recommended|proposed|advised|pointed\s+out|raised))\s+by
  # What the authors did to the text.
  edited: |-
    added|amended|changed|clarified|corrected|deleted|edited|expanded|modified|moved|rephrased
    |reworded|rewritten|removed|revised|shortened|softened|toned\s+down|updated|nuanced|tempered
  # A part of a text, this one's or another's: a guideline's update revises "the section on
  # renal dosing" too. Not "statements", which a consensus paper adds and includes.
  part: |-
    text|sentences?|wording|paragraphs?|section|subsection|passages?|phrases?|discussion
    |introduction|abstract|title|limitations?|methods\s+section|results\s+section|conclusions?
    |manuscript|clarifications?|explanations?|footnotes?|terminology|keywords
    |figure\s+legends?|table\s+legends?|captions?
  # A part only this manuscript has: a section by its name, with its capital ("the
  # Discussion", and not "the discussion of renal dosing"), the manuscript, its main text.
  # Not "Summary", which opens the Summary of Product Characteristics.
  section: |-
    (?-i:Discussion|Introduction|Abstract|Methods|Results|Limitations|Conclusions?)(?:\s+section)?
    |(?:limitations?|methods|results|discussion|introduction|conclusions?)\s+section
    |manuscript|main\s+text|revised\s+text(?!\s+of\s+(?!(?:the|this|our)\s+(?:revised\s+)?manuscript\b))
  # What may stand between "we have" and its verb, and between the verb and the part.
  adverb: |-
    also|further|therefore|accordingly|thus|hence|now
  det: |-
    the|this|that|these|those|our|a|an|one|two|three|several|some|new|further|additional|more
    |brief|short|relevant|corresponding|following|entire|whole

residue:
  - id: reviewer-answered
    self_reference: true
    # "In response to the reviewer's comment", "as suggested by Reviewer 2", "following the
    # editor's request", "as the reviewer pointed out", "the reviewer rightly asked whether",
    # "we thank the reviewer for this point". Not the thanks of the acknowledgements, which
    # names what it thanks for: "for the helpful comments", "for pointing out an error in
    # the variance estimator", "for the suggestion to use the bootstrap" (round 1 of #377).
    pattern: |-
      (?ix)\b(?:
        {{answer}}\s+{{one}}
        |{{after}}\s+{{one}}['’]s\s+(?:\w+\s+)?{{speech}}\b
        |{{by}}\s+{{one}}
        |as\s+{{one}}\s+(?:\w+\s+)?(?:suggested|requested|recommended|pointed\s+out|noted|asked
          |proposed|advised|mentioned|indicated|wondered|commented)\b
        |{{one}}\s+(?:(?:rightly|correctly|kindly|also|further|helpfully)\s+)?
          (?:asked\s+(?:us|whether|why|for|that|to|if|how)|requested|suggested|recommended
          |pointed\s+out|raised\s+(?:a|an|the|this|that)|wondered|questioned\s+(?:whether|why|the|our))\b
        |(?:thank(?:s|ing)?|grateful|indebted)\s+(?:to\s+)?{{one}}\s+for\s+(?:(?:this|that)\s+(?:\w+\s+)?
          (?:comment|suggestion|point|question|remark|observation|query|concern)\b
          |(?:raising|pointing\s+out|bringing\s+up|highlighting|noting)\s+(?:this|that|it)\b
          |bringing\s+(?:this|that|it)\s+(?:to\s+(?:our|my)\s+attention|up)\b
          |pointing\s+(?:this|that|it)\s+out\b)
        |(?:thank(?:s|ing)?|grateful|indebted)\s+(?:to\s+)?{{numbered}}\s+for\b
      )
    why: An answer to one reviewer or to the editor, which the paper's reader never saw
  - id: reviewers-answered
    # The same of the reviewers together, of one not named, or of one reviewer's words with
    # nothing done about them: "in response to the reviewers' comments", "as suggested by
    # one of the reviewers", "the reviewer's comment". A paper about peer review writes these
    # of the reviews it studied, so they warn.
    pattern: |-
      (?ix)\b(?:
        {{answer}}\s+{{many}}
        |{{after}}\s+{{many}}(?:['’]s?)?\s+(?:\w+\s+)?{{speech}}\b
        |{{by}}\s+{{many}}
        |as\s+{{many}}\s+(?:\w+\s+)?(?:suggested|requested|recommended|pointed\s+out|noted|asked
          |proposed|advised|mentioned|indicated|wondered|commented)\b
        |{{one}}['’]s\s+(?:\w+\s+)?{{speech}}\b
        |thank(?:s|ing)?\s+(?:to\s+)?{{many}}\s+for\s+(?:(?:this|that)\s+(?:\w+\s+)?
          (?:comment|suggestion|point|question|remark|observation|query|concern)\b
          |(?:raising|pointing\s+out|bringing\s+up|highlighting|noting)\s+(?:this|that|it)\b
          |bringing\s+(?:this|that|it)\s+(?:to\s+(?:our|my)\s+attention|up)\b
          |pointing\s+(?:this|that|it)\s+out\b)
      )
    why: An answer to the reviewers, unless the paper is about peer review
  - id: as-requested
    # A sentence that opens on a request and names nobody: "As requested, we ...".
    pattern: '(?m)(?:^|(?<=[.!?;:]\s))[ \t]*As\s+(?:requested|suggested|recommended|advised|agreed)\s*,'
    why: An answer to a request, which the paper's reader never made
  - id: earlier-version
    self_reference: true
    # This manuscript before it was revised: "our original submission", "this revised
    # manuscript", "in the previous version of this manuscript". Not "comments on an earlier
    # version of this manuscript", which is the acknowledgements, not "an earlier version of
    # this paper", which a preprint was, and not "our initial draft comprised 45 items",
    # which a Delphi panel's was (round 1 of #377).
    pattern: |-
      (?ix)\b(?:
        (?:our|this)\s+(?:original|initial|first|previous|earlier|prior|former|revised|resubmitted
          |amended)\s+(?:submission|resubmission)(?!\s+(?:to|of|for)\b)
        |(?:our|this)\s+(?:original|initial|revised|resubmitted|amended)\s+manuscript
        |(?:in|from|than|unlike|compared\s+(?:with|to)|relative\s+to)\s+(?:the|an?|our)\s+
          (?:original|initial|first|previous|earlier|prior|former|last|revised)\s+(?:version|draft)s?
          \s+of\s+(?:this|our)\s+(?:manuscript|submission)
        |this\s+version\s+of\s+(?:the|this|our)\s+manuscript
      )\b
    exempt: &written
      # The authors' contributions: "drafted the initial manuscript", "provided final approval
      # of this version of the manuscript". A verb of writing, then only the words a
      # contribution puts before the noun, so that "We revised the Methods because our
      # original submission" is read (round 1 of #377).
      - '(?i)\b(?:wrote|write|written|writing|draft(?:ed|ing)?|prepar(?:ed|ing)|revis(?:ed|ing)|edit(?:ed|ing)|review(?:ed|ing)|read|approv(?:e|es|ed|ing|al)|agree(?:s|d)?\s+(?:to|with|on)|commented\s+on|contributed\s+to|made\s+(?:\w+\s+)?revisions\s+(?:to|of)|(?:gave|provided|granted)\s+(?:\w+\s+)?approval\s+(?:of|to|for))(?:\s+(?:and|the|a|an|this|that|our|its|their|final|first|initial|original|revised|submitted|resubmitted|earlier|previous|prior|last|current|present|whole|entire|complete|draft|drafts|version|versions|of|to|be|published|critically|substantially|approved|read|edited|writing|drafting|editing|revision|revisions|review|content|preparation))*\s+(?:manuscripts?|drafts?|versions?|submissions?|papers?)\b'
      # The acknowledgements, to the end of their sentence, where the stop of a title or an
      # initial ends none: "grateful to Dr. Sampaio for their critical review in the
      # original manuscript". Not "acknowledge", which opens a limitation as often.
      - '(?i)\b(?:thank(?:s|ed|ful)?|grateful|gratitude|indebted)\b(?:[^.\n]|\n(?![ \t]*\n)|(?<=\b(?:Dr|Mr|Ms|Mx|St|Jr|Sr|al))\.|(?<=\b(?:Mrs|Drs))\.|(?<=\bProf)\.|(?<=\b[A-Z])\.){0,300}'
    why: This manuscript's earlier version, which the paper's reader never saw
  - id: earlier-version-unnamed
    # A manuscript's earlier version not said to be this one's: "the revised manuscript",
    # "the original submission", "in the previous draft". What a paper about peer review
    # writes of the manuscripts it studied, so they warn. Not "the original version", nor
    # "the revised version", which a scale or a questionnaire has, nor "the original
    # submission of the dossier to the agency", which a paper on regulation writes.
    pattern: |-
      (?ix)\b(?:
        the\s+(?:revised|resubmitted|amended)\s+(?:manuscript|submission|draft)(?!\s+(?:to|of|for)\b)
        |the\s+(?:original|initial|first|previous|earlier|prior|former)\s+(?:submission|resubmission)
          (?!\s+(?:to|of|for)\b)
        |(?:in|from|than|unlike|compared\s+(?:with|to)|relative\s+to)\s+(?:the|an?)\s+
          (?:original|initial|first|previous|earlier|prior|former|last)\s+(?:manuscript|draft)s?
        |(?:in|from|than|unlike|compared\s+(?:with|to)|relative\s+to)\s+(?:the|an?)\s+
          (?:original|initial|first|previous|earlier|prior|former|last|revised)\s+(?:version|draft)s?
          \s+of\s+the\s+(?:manuscript|submission)
        |the\s+revised\s+version\s+of\s+the\s+manuscript
      )\b
    exempt: *written
    why: A manuscript's earlier version, unless the paper is about peer review
  - id: we-have-now
    self_reference: true
    # "We have now clarified", "we now have added", "we've now rephrased": the cadence of a
    # reply. Not what a paper finds, "we have now shown", nor "we now report".
    pattern: |-
      (?ix)\bwe(?:\s+have\s+now|\s+now\s+have|['’]ve\s+now)\s+(?:also\s+|further\s+|additionally\s+|briefly\s+)?
        (?:added|amended|changed|clarified|corrected|deleted|edited|elaborated|emphasi[sz]ed|mentioned
        |modified|moved|rephrased|replaced|reworded|rewritten|removed|revised|shortened|softened
        |specified|toned\s+down|acknowledged|discussed|stated|reorgani[sz]ed|restructured|condensed
        |cited|tempered|nuanced)\b
    why: A change to the text described to whoever asked for it
  - id: text-edited
    self_reference: true
    # A change to a part of this manuscript: "we have expanded the Discussion", "we have
    # rephrased the sentence", "we have modified the text accordingly", "this has been
    # clarified in the text", "a paragraph has been added to the Limitations". A change
    # named with no part that is this manuscript's is the next rule's, since a guideline's
    # update "revised the section on renal dosing" (round 1 of #377). Not "These have been
    # discussed in the Introduction", a pointer, nor "we have adapted the wording of the
    # items", a translation.
    pattern: |-
      (?ix)\b(?:
        we\s+have\s+(?:(?:{{adverb}})\s+)?(?:{{edited}}|extended|restructured|reorgani[sz]ed|condensed
          |streamlined|simplified|inserted)\s+(?:(?:{{det}})\s+){0,2}(?:{{section}})\b
        |we\s+have\s+(?:(?:{{adverb}})\s+)?(?:rephrased|reworded|rewritten|toned\s+down|softened|nuanced
          |tempered)\s+(?:(?:{{det}})\s+){0,2}(?:{{part}})\b
        |we\s+have\s+(?:(?:{{adverb}})\s+)?(?:{{edited}}|extended|restructured|reorgani[sz]ed|condensed
          |streamlined|simplified|inserted)\s+(?:(?:{{det}})\s+){0,2}(?:{{part}})\s+accordingly\b
        |(?:this|these|the\s+(?:{{part}}))\s+(?:has|have)\s+(?:now\s+|also\s+)?been\s+(?:{{edited}})\s+
          (?:accordingly|throughout|in\s+(?:the|this|our)\s+(?:revised\s+)?(?:{{section}}|text(?!\s+of\s+(?!(?:the|this|our)\s+(?:revised\s+)?manuscript\b))))\b
        |(?:this|these)\s+(?:(?:points?|issues?|aspects?|limitations?|statements?|concerns?)\s+)?(?:has|have)
          \s+now\s+been\s+(?:{{edited}}|included|incorporated|specified|mentioned|discussed|acknowledged
          |addressed|stated|explained|emphasi[sz]ed)\s+(?:in|into|to)\s+(?:the|this|our)\s+(?:revised\s+)?
          (?:{{section}}|text(?!\s+of\s+(?!(?:the|this|our)\s+(?:revised\s+)?manuscript\b)))\b
        |(?:a|an|one|two|the|new|further|additional|brief|short)\s+(?:\w+\s+)?(?:sentences?|paragraphs?
          |statements?|clarifications?|explanations?|notes?|sections?|subsections?|passages?|caveats?)
          \s+(?:has|have)\s+(?:now\s+|also\s+)?been\s+(?:added|inserted|included)\s+(?:to|in|into)\s+
          (?:the|this|our)\s+(?:revised\s+)?(?:{{section}}|text(?!\s+of\s+(?!(?:the|this|our)\s+(?:revised\s+)?manuscript\b)))\b
      )
    why: A change to this manuscript's text described to whoever asked for it
  - id: text-edited-unnamed
    # A change named with no part that is this manuscript's: "we have revised the section",
    # "this has now been clarified." at the end of its clause. A guideline's update and a
    # label's history write these of themselves, so they warn; and only where the clause
    # ends, so "This has now been included in the SmPC" is no change to a text.
    pattern: |-
      (?ix)\b(?:
        we\s+have\s+(?:(?:{{adverb}})\s+)?(?:{{edited}}|extended|restructured|reorgani[sz]ed|condensed
          |streamlined|simplified|inserted)\s+(?:(?:{{det}})\s+){0,2}(?:{{part}})\b
        |(?:this|these)\s+(?:(?:points?|issues?|aspects?|limitations?|statements?)\s+)?(?:has|have)\s+now
          \s+been\s+(?:{{edited}}|included|incorporated|specified|mentioned|discussed|acknowledged|addressed
          |stated|explained|emphasi[sz]ed)(?=\s*(?:[.;:!?)]|$))
      )
    why: A change to a text described to whoever asked for it, unless the text is another's
  - id: lines-cited
    self_reference: true
    # A place in the manuscript's numbered lines: "page 12, lines 245-250", "lines 245-250
    # of the revised manuscript". Not "(p. 240)", a quotation's page.
    pattern: |-
      (?ix)\b(?:page|pg\.?|p\.?)\s*\d+\s*[,;]?\s*(?-i:[Ll]ines?|ll?\.)\s*\d+
      |\b(?-i:[Ll]ines?)\s+\d+(?:\s*(?:[-–—]|to|and)\s*\d+)?\s+(?:of|in)\s+(?:the|this|our)\s+
        (?:revised\s+|tracked\s+|clean\s+|marked[-\s]up\s+)?(?:manuscript|text|version|document|submission|file)\b
    why: A place in the reviewers' copy, which the paper's reader does not have
  - id: lines-cited-alone
    # Lines in brackets with nothing to say whose: "(lines 245-250)". A program's listing
    # may be pointed at so. Not in capitals: "(LINE 1)" is a retrotransposon. Not tried in a
    # LaTeX document that sets out an algorithm or a listing, whose lines its text points at
    # so, "the stride is set (line 8)" (corpus round, 2026-10-23).
    pattern: '\((?:[Ss]ee\s+)?(?:[Ll]ines?|ll\.)\s+\d+(?:\s*(?:[-–—]|to|and)\s*\d+)?\)'
    unless_listed: true
    why: A place in the reviewers' copy, unless it is a listing's
  - id: changes-marked
    self_reference: true
    # "The revised text is highlighted in yellow", "new sentences are shown in red", "shown
    # in track changes". Marked, and not only shown: "the revised wording is shown in Table
    # 3" and "new sentences were written by two authors" are an instrument and a study's
    # stimuli (round 1 of #377). Not "the RBD was highlighted in yellow", nor "amino acid
    # changes are shown in red".
    pattern: |-
      (?ix)\b(?:the\s+)?(?:revised|new|added|amended|changed|edited|inserted)\s+(?:text|passages?
        |sentences?|wording|paragraphs?|parts?\s+of\s+the\s+(?:text|manuscript))\s+(?:is|are|has\s+been
        |have\s+been|was|were)\s+(?:now\s+)?(?:(?:highlighted|underlined|colou?red|tracked)\b
        |(?:marked|shown|indicated|written|printed)\s+(?:in|with|using|as|by)\s+(?:\w+\s+){0,2}
        (?:yellow|red|blue|green|grey|gray|bold|italics?|colou?r|underlined|highlighted|track(?:ed)?[-\s]changes?)\b)
      |\b(?:in|with|using|as|via)\s+track(?:ed)?[-\s]changes?\b
    why: Changes marked for the reviewers, which the printed paper does not show
  - id: tracked-changes
    pattern: '(?i)\btrack(?:ed)?[-\s]changes?\b'
    why: Changes marked for the reviewers, unless the paper is about editing
  - id: response-letter
    self_reference: true
    # "our response to Reviewer 2", "our point-by-point reply to the comments", "see the
    # response letter". Not "a cover letter", which a survey posts to its participants.
    pattern: |-
      (?ix)\b(?:
        our\s+(?:point[-\s]by[-\s]point\s+)?(?:response|reply|rebuttal|answer)s?\s+(?:letter\s+|document\s+)?
          (?:to|for)\s+(?:the\s+)?(?:\w+\s+)?(?:reviewers?|referees?|editors?)
        |our\s+(?:response|rebuttal|reply)\s+(?:letter|document)
        |our\s+rebuttal
        |(?:see|in)\s+(?:the|our)\s+(?:accompanying\s+|attached\s+)?(?:response|rebuttal|reply)\s+(?:letter|document)
      )\b
    why: The letter to the reviewers, which the paper's reader does not have
  - id: response-letter-unnamed
    pattern: '(?i)\b(?:(?:response|rebuttal|reply)\s+(?:letter|document)s?|point[-\s]by[-\s]point\s+(?:response|reply|rebuttal)s?|(?:response|reply|rebuttal)s?\s+to\s+(?:the\s+)?(?:reviewers|referees|reviewer\s+comments))\b'
    why: A letter to the reviewers, unless the paper is about peer review
  - id: model-addressed
    self_reference: true
    # What a model says to whoever asked it: "as you requested", "per your instructions",
    # "I have shortened the abstract", "Below is the revised Discussion". Not "I have
    # forgotten", a participant's words.
    pattern: |-
      (?ix)\b(?:
        as\s+you\s+(?:requested|asked|suggested|instructed|specified)
        |(?:per|at|following|as\s+per)\s+your\s+(?:request|instructions?|suggestions?|feedback|comments?)
        |(?:incorporated|integrated|addressed|implemented|applied|included)\s+(?:all\s+)?your\s+
          (?:suggestions?|comments?|feedback|edits|changes|requests?)
        |(?:changes|edits|revisions|corrections)\s+you\s+(?:requested|asked\s+for|suggested|wanted)
        |(?-i:I)(?:['’]ve|\s+have)\s+(?:now\s+|also\s+|just\s+)?(?:revised|rewritten|rephrased|reworded|edited
          |shortened|tightened|polished|restructured|reorgani[sz]ed|condensed|streamlined|simplified|updated
          |corrected|adjusted|expanded|trimmed|refined|improved|removed|added)\s+
          (?:the|your|this|that|each|a\s+few|some|all|these|those|several)\s+(?:\w+\s+)?
          (?:text|paragraphs?|sections?|sentences?|drafts?|abstract|introduction|discussion|manuscript
          |wording|versions?|passages?|conclusions?|title|methods|results)
        |(?:below|here)\s+is\s+(?:the|a|an|your)\s+(?:\w+\s+)?(?:revised|rewritten|updated|edited|shortened
          |polished|improved|corrected|condensed|expanded|tightened|refined|reworded|rephrased)
        |here['’]s\s+(?:the|a|an|your)\s+(?:\w+\s+)?(?:revised|rewritten|updated|edited|shortened|polished
          |improved|corrected|condensed|expanded|tightened|refined|reworded|rephrased)
      )\b
    why: Words a model wrote to its user, left in the paper

# Constructions worth a second look wherever they appear. Warnings, not failures: each has
# a defensible use, and an author who disagrees should be able to say so and move on.
phrases:
  - id: delve
    pattern: '(?i)\bdelv(?:e|es|ed|ing)\s+into\b'
    why: Near-absent from human scientific writing and near-ubiquitous in generated text
  - id: tapestry-landscape
    pattern: '(?i)\b(?:rich|complex|intricate|vibrant|evolving)\s+(?:tapestry|landscape|mosaic)\b'
    why: Metaphor with no content
  - id: testament
    pattern: '(?i)\b(?:is|stands as|serves as)\s+a\s+(?:testament|reminder|hallmark)\s+to\b'
    why: Editorialising; states significance rather than a finding
  - id: it-is-not-it-is
    pattern: "(?i)\\bit(?:'s| is)\\s+not\\s+[^.;:]{2,50}?,\\s*it(?:'s| is)\\b"
    why: Rhetorical inversion; rare in scientific prose
  - id: importance-tail
    pattern: '(?i),\s+(?:highlighting|underscoring|emphasi[sz]ing|showcasing|reflecting|symboli[sz]ing|demonstrating)\s+(?:the|its|their|a)\b'
    why: An "-ing" tail asserting significance instead of reporting a result
  - id: important-to-note
    pattern: '(?i)\bit\s+is\s+(?:important|worth|crucial|essential)\s+to\s+(?:note|mention|highlight|emphasi[sz]e)\b'
    why: Says nothing; delete the phrase and the sentence keeps its meaning
  - id: despite-challenges
    pattern: '(?i)\bdespite\s+(?:these|its|the)\s+(?:challenges|limitations|shortcomings)\b'
    why: Part of the formulaic conclusion the source essay describes
  - id: paves-the-way
    pattern: '(?i)\b(?:pav(?:e|es|ing)\s+the\s+way|set(?:s|ting)?\s+the\s+stage|open(?:s|ing)?\s+(?:up\s+)?new\s+avenues)\b'
    why: Puffery about consequences
  - id: in-the-realm
    pattern: '(?i)\bin\s+the\s+(?:realm|world|landscape|arena)\s+of\b'
    why: Filler opening
  - id: ever-evolving
    pattern: '(?i)\b(?:ever[- ]evolving|rapidly evolving|fast[- ]paced)\b'
    why: Puffery
  # Communication meant for the user of a chat, left in the text: the closers and offers of
  # more the essay lists.
  - id: chat-closer
    pattern: '(?i)\bI\s+hope\s+(?:this|that|it)\s+helps\b|\blet\s+me\s+know\s+(?:if|whether)\b|\bwould\s+you\s+like\s+(?:me\s+)?to\b|\bis\s+there\s+anything\s+else\b|\byou(?:''re|\s+are)\s+absolutely\s+right\b'
    why: Words addressed to the user of a chat, not to the reader of a paper
  # A disclaimer about the sources a model was given, from the essay's list. Not "not widely
  # available" or "not widely reported", which a paper says of a drug or an adverse event.
  - id: source-disclaimer
    pattern: '(?i)\bspecific\s+(?:details|information)\b[^.;:]{0,60}?\b(?:are|is)\s+(?:limited|scarce)\b|\bnot\s+extensively\s+documented\b|\b(?:in|from)\s+the\s+(?:provided|available)\s+(?:sources|search\s+results)\b|\bbased\s+on\s+(?:the\s+)?available\s+information\b'
    why: A disclaimer about the sources a model was given; a paper cites what it rests on
  # A hedge on a hedge, "could potentially": one of them says it.
  - id: stacked-hedge
    pattern: '(?i)\b(?:could|may|might)\s+(?:potentially|possibly|conceivably)\b'
    why: Two hedges where one says it
  # The upbeat close about the future and the lasting importance of the subject.
  - id: upbeat-close
    pattern: '(?i)\bthe\s+future\s+of\s+[^.;:]{1,60}?\s+lies\s+in\b|\bcontinues?\s+to\s+thrive\b|\benduring\s+(?:relevance|legacy|significance)\b'
    why: A conclusion about the future that no result supports
  # Text about the text: a section announcing what it will discuss.
  - id: text-about-text
    pattern: '(?i)\bthis\s+(?:section|article|chapter)\s*,?\s+(?:we\s+)?(?:will|would|shall)\s+(?:discuss|explore|examine|delve|speculate|outline)\b'
    why: Says what the text will do instead of doing it
  # An instruction to the user of the text, a draft's "the user should add ...". A warning:
  # a paper about a tool can say what its user should do.
  - id: user-should
    pattern: '(?i)\b(?:the\s+)?user\s+should\s+(?:add|insert|replace|fill|describe|update|edit|tailor|adapt)\b'
    why: An instruction to whoever fills in the text, left in it

# Attribution with nothing behind it. Reported only when no citation appears nearby, which
# is the difference between a manuscript and an encyclopedia: here the fix is a reference.
vague_attribution:
  - id: studies-have-shown
    pattern: '(?i)\b(?:studies|research|evidence|data)\s+(?:has|have)\s+(?:shown|demonstrated|suggested|indicated)\b'
  - id: experts-argue
    pattern: '(?i)\b(?:experts|researchers|scholars|observers|critics|some\s+authors)\s+(?:argue|suggest|believe|contend|note|have\s+cited)\b'
  - id: widely-regarded
    pattern: '(?i)\b(?:is|are)\s+(?:widely|generally|commonly)\s+(?:regarded|considered|accepted|believed|recognised|recognized)\b'
  - id: growing-body
    pattern: '(?i)\ba\s+growing\s+body\s+of\s+(?:evidence|literature|research)\b'
  - id: it-is-known
    pattern: '(?i)\bit\s+is\s+(?:well[- ])?(?:known|established|documented)\s+that\b'

# Words that are ordinary once and a tell in quantity. Rates are per 1000 words of prose.
density:
  - id: ai-vocabulary
    # The 99th percentile of 291 papers by people
    # (tools/g6_baseline.py, corpus d986324d02aa94ae, drawn 2026-10-19).
    per_1000: 2.7
    why: >-
      Individually unremarkable, collectively the strongest lexical signal in the source
      essay. A high rate suggests prose that was generated rather than written.
    terms:
      - additionally
      - crucial
      - crucially
      - pivotal
      - vital
      - robust
      - comprehensive
      - intricate
      - intricacies
      - meticulous
      - meticulously
      - underscore
      - underscores
      - underscoring
      - highlight
      - highlights
      - highlighting
      - showcase
      - showcases
      - showcasing
      - foster
      - fosters
      - fostering
      - enhance
      - enhances
      - enhancing
      - garner
      - garnered
      - bolster
      - bolstered
      - leverage
      - leveraging
      - interplay
      - nuanced
      - multifaceted
      - holistic
      - seamless
      - seamlessly
      - noteworthy
      - profound
      - compelling
      - invaluable
      - paramount
    # Technical senses that should not count towards the rate, singular or plural: the
    # plural, "robust standard errors", is how papers by people write it.
    exempt:
      - '(?i)\brobust(?:ness)?\s+(?:standard\s+errors?|variances?|estimators?|regressions?|checks?|analysis|analyses)\b'
      - '(?i)\bsandwich\s+robust\b'
      - '(?i)\bcomprehensive\s+(?:cohort|search\s+strategy)\b'

  - id: em-dash
    # The 99th percentile of 291 papers by people
    # (tools/g6_baseline.py, corpus d986324d02aa94ae, drawn 2026-10-19).
    per_1000: 4.7
    # Typed or as pandoc prints three hyphens, `word---word`: the papers measured were read
    # with the dash written out, so the threshold holds for both. Not two hyphens, an en dash,
    # nor four; and not a line of dashes, pipes and colons, which is a rule or a table's.
    # Nor inline code, printed as typed, nor a pipe table's row: the papers were measured
    # with their tables left out, and a table's "---" is "not applicable" (round 1 of #352).
    # Nor a simple, multiline or grid table's (`text.tables.table_lines`), as the bold rate
    # leaves them out: a dash in a cell of a table pandoc wrote from Word counted.
    in_tables: false
    pattern: '—|(?<!-)---(?!-)'
    exempt:
      - '(?m)^[ \t]*[-|:+][-|:+ \t]*$'
      - '`[^`\n]*`'
      - '(?m)^[ \t]*\|.*$'
    why: >-
      Em dashes are legitimate punctuation and heavily overused by models. A high rate is
      worth a look; a few are fine.

  - id: boldface
    # The 99th percentile of 291 papers by people
    # (tools/g6_baseline.py, corpus d986324d02aa94ae, drawn 2026-10-19).
    per_1000: 9.4
    pattern: '\*\*[^*\n]+\*\*'
    why: Emphasis scattered through prose rather than reserved for structure
    # Not in a table, pipe, grid, simple or multiline (`text.tables.table_lines`): the papers
    # were measured with their tables left out, and a table's header row is bold by its
    # style. Read as prose, each bold cell counted, and where a cell's bold ran on to the
    # cell's next line, `**` paired across the cells: "**   | **", "1**   2**".
    in_tables: false
    exempt:
      # A structured abstract's labels are bold by requirement, not by habit. Journals
      # specify them, so counting them would flag the journal's own house style.
      - '(?m)^\s*\*\*[A-Z][\w /-]{2,28}[.:]\*\*'

  - id: rule-of-three
    # The 99th percentile of 291 papers by people
    # (tools/g6_baseline.py, corpus d986324d02aa94ae, drawn 2026-10-19).
    per_1000: 6.2
    pattern: '(?i)\b\w+,\s+\w+,\s+and\s+\w+\b'
    why: >-
      Three-item lists are normal; a high rate is the cadence the source essay describes.

  # Two constructions papers by people use as well: reported wherever they stood, each
  # warned on about a quarter of 384 such papers (tools/g6_baseline.py, 2026-10-19), so
  # they are counted by rate, as the vocabulary is.
  - id: negative-parallelism
    # The 99th percentile of 291 papers by people
    # (tools/g6_baseline.py, corpus d986324d02aa94ae, drawn 2026-10-19).
    per_1000: 0.8
    pattern: '(?i)\bnot\s+(?:just|only|merely|simply)\b[^.;:]{2,80}?\bbut\s+(?:also\s+)?'
    why: >-
      "Not just X but Y" is a cadence tell, and usually says less than X and Y alone. Once
      is a sentence; a high rate is the cadence.

  - id: plays-a-role
    # The 99th percentile of 291 papers by people
    # (tools/g6_baseline.py, corpus d986324d02aa94ae, drawn 2026-10-19).
    per_1000: 1.0
    pattern: '(?i)\bplays?\s+an?\s+(?:crucial|pivotal|vital|key|significant|important)\s+role\b'
    why: >-
      Asserts importance without stating a mechanism or an estimate. Once is a sentence; a
      high rate is the cadence.

# Sentence-shape checks that need a whole sentence rather than a pattern.
structure:
  - id: copula-avoidance
