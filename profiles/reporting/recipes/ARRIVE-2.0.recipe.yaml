schema: manuscript-guard/recipe/1

# ARRIVE 2.0 offers no Word checklist. Both sets — the Essential 10 and the Recommended Set
# — are printed side by side on page 2 of the guidelines PDF, so this recipe uses the
# column reader rather than the table reader: the page is cut at the boundary between the
# two sets, and each half is parsed on its own visual grid.
#
# This path is more fragile than reading a .docx table, and its verification is weaker: the
# items are checked against the same de-columnised text they were built from, which catches
# a mis-assembled item but not a mis-cut column. Prefer a Word checklist wherever one
# exists.

meta:
  name: ARRIVE-2.0
  long_name: "Animal Research: Reporting of In Vivo Experiments"
  version: "2.0"
  applies_to: "Studies reporting in vivo animal experiments"
  source_url: "https://arriveguidelines.org/"
  retrieved_on: 2026-08-03
  retrieved_by: "downloaded by the author"
  licence: >-
    CC BY — the ARRIVE 2.0 explanation and elaboration was published in PLOS Biology under CC-BY. The checklist's own terms are not separately stated.
  licence_url: https://arriveguidelines.org/arrive-guidelines
