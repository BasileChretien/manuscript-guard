  <text x="465.0" y="87" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">Manuscript</text>
  <text x="465.0" y="106" text-anchor="middle" font-size="12" fill="#59636e">Markdown, {{bindings}}</text>
  <rect x="575" y="60" width="130" height="62" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="640.0" y="87" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">check</text>
  <text x="640.0" y="106" text-anchor="middle" font-size="12" fill="#59636e">fourteen gates</text>
  <rect x="740" y="60" width="120" height="62" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="800.0" y="87" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">build</text>
  <text x="800.0" y="106" text-anchor="middle" font-size="12" fill="#59636e">the .docx</text>
  <rect x="390" y="190" width="150" height="62" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="465.0" y="217" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">Literature ledger</text>
  <text x="465.0" y="236" text-anchor="middle" font-size="12" fill="#59636e">value, quote, source</text>
  <rect x="575" y="190" width="130" height="62" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="640.0" y="217" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">Journal, checklist</text>
  <text x="640.0" y="236" text-anchor="middle" font-size="12" fill="#59636e">retrieved, not built in</text>
  <line x1="174" y1="91.0" x2="197" y2="91.0" stroke="#59636e" stroke-width="1.5" marker-end="url(#tip)"/>
  <line x1="359" y1="91.0" x2="382" y2="91.0" stroke="#59636e" stroke-width="1.5" marker-end="url(#tip)"/>
  <line x1="544" y1="91.0" x2="567" y2="91.0" stroke="#59636e" stroke-width="1.5" marker-end="url(#tip)"/>
  <line x1="709" y1="91.0" x2="732" y2="91.0" stroke="#59636e" stroke-width="1.5" marker-end="url(#tip)"/>
  <line x1="465.0" y1="186" x2="465.0" y2="130" stroke="#59636e" stroke-width="1.5" marker-end="url(#tip)"/>
  <line x1="640.0" y1="186" x2="640.0" y2="130" stroke="#59636e" stroke-width="1.5" marker-end="url(#tip)"/>
  <path d="M 800.0 56 V 28 H 465.0 V 50" fill="none" stroke="#59636e" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#tip)"/>
  <text x="632.5" y="20" text-anchor="middle" font-size="12" fill="#59636e">import: a co-author&#8217;s Word edits come back</text>
  <text x="440.0" y="286" text-anchor="middle" font-size="13" fill="#59636e">Change the analysis and rebuild: every number follows. A number that no longer has a source fails the check.</text>
