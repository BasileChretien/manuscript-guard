# The readings a pull request means to change.
#
# tests/test_differential.py puts generated inputs through the base branch's source and
# through the working tree's, reading by reading (tests/readings.py), and fails on any
# difference. A pull request that changes what a gate reports is meant to differ, and says
# so here:
#
#   expected:
#     - reading: vocabulary
#       why: >-
#         a `>` line under the rule of a simple table is a row of it again, so the terms
#         in it are counted
#
# An entry excuses one reading, in the pull request that adds the entry and in no other:
# once it is merged the base holds it too, and it is spent. The reading then passes and
# lists what differs, for whoever reviews the change to read against the `why`. Every other
# reading still fails on a difference, which is how "nothing else changed" is held.
#
# An entry is also how a pull request says it changed what a reading goes through, a
# helper that takes another argument now, so that the base's source cannot be asked for
# that reading at all. Without the entry that fails: nothing was compared.
#
# An entry for a reading that does not differ fails, and so does one that names no reading.
# Spent entries may stay as a record or go; the list is not read for them.

expected:
  - reading: placeholders
    why: >-
      a journal template's instruction to its authors, "In this section you can acknowledge
      any support given ...", "This section may be divided by subheadings", Word's "Click or
      tap here to enter text.", is found as a placeholder, `placeholder-template`; the inputs
      now hold such instructions, and a section the authors describe, a form a paper
      reproduces and PLOS's "Click here for additional data file", which it is not
  - reading: reworded
    why: >-
      each sentence an edit changed is compared with what it was for the words of its
      claim, and a hedge, a limit or a negation that came or went, or a word moved along
      the ladder from consistency to causation, is a warning, `claim-stronger`,
      `claim-weaker`, `claim-moved` or `claim-negation`; the inputs now hold such edits
  - reading: notation
    why: >-
      a level typed after the letters hard against a negative bound, "CI 95%-0.3 to 0.4",
      is a level again: only a bound in percent after the hyphen makes the number before
      it a first bound
  - reading: interval order
    why: >-
      the sentences an interval's bounds are compared in are read with each HTML comment
      blanked, as the bindings are: a stop inside a comment ends no sentence, so a reversal
      with such a comment between its bounds is reported, and a stop with a comment typed
      against it ends one, so the bounds on either side of it are no longer compared
  - reading: check
    why: >-
      G14 reports no `abbreviation-redefined` in a Markdown manuscript whose main text has
      no heading, and notes it, `no-headings`, at the drafting stage only; reads a
      glossary's entries as definitions, lets a caption restate one, and leaves SD, ANOVA, RMSE and RMSD undefined unless the
      journal's profile asks for them
  - reading: numbers
    why: >-
      an e-mail address is structural, `email-address`, and an interleukin, "IL-4",
      "interleukin-31", "IL-4/IL-13", is a shipped term, so neither is a number nothing
      classifies; a term counts only where it opens a word, after a capital, at a capital
      after a lower-case letter or directly after another term, and one holding a
      superscript's digits only where it opens a word, so "April-12" and "PharmD^2^" are
      numbers and "sIL-2R", "CCR2" and "PaO2FiO2" terms; the inputs now hold such
      addresses and names
  - reading: reported tests
    why: >-
      a P above 1, "P = 4.1 x 10^5", is not judged; a number with a middle dot or a comma
      for its point is not read, nor a P cut off before one; and Dunnett's and
      Games-Howell's procedures stand a test down as the other named adjustments do
  - reading: pointers
    why: >-
      G2 holds a caption beside a table or a figure to that display, so a typed caption or a
      ref opening one that names another display is caption-names-another; the inputs now
      place captions, and two tables one after the other with a caption between them
  - reading: latex printed
    why: >-
      a `\def` with delimited parameters, `\def\x\begin{verbatim}` among the inputs, was
      refused and the rest of the file read as typed; it is read now, as TeX reads it,
      its parameter text blanked and its body read, and a use refused only where it
      prints; a `\let` of a command to one the reader reads the same way and a doubled
      parameter in a nested body are no longer refused either (real templates, part 1)
  - reading: prose quotations
    why: >-
      a sentence that opens with a typographic quotation mark is a sentence of its own, as
      one that opens with a straight one is, so its quotation is held to its own citation
      and not to the one of the sentence before (step 8, G7)
  - reading: latex bindings
    why: >-
      a `\def` with delimited parameters, `\def\x\begin{verbatim}` among the inputs, was
      refused and the rest of the file read as typed; it is read now, as TeX reads it,
      its parameter text blanked and its body read, and a use refused only where it
      prints; a `\let` of a command to one the reader reads the same way and a doubled
      parameter in a nested body are no longer refused either (real templates, part 1)
  - reading: latex places
    why: >-
