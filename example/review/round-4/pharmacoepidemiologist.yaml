verdict: minor-revision
summary: Adjusting a case/non-case ratio for age and sex is the usual first adjustment, and
  the paper keeps the adjusted estimate a measure of reporting, not of risk. The explanation
  for why adjustment changed nothing is specific to the synthetic data and says so. One covariate
  the data do hold, the reporting year, is not used and not discussed.
findings:
- id: r4-pe-01
  severity: minor
  where: Methods, adjusted model
  finding: Every report carries its year, and calendar time is a common adjustment in
    disproportionality analyses, since reporting of a drug changes with time on the market
    and with publicity. The paper adjusts for patient characteristics only and does not say
    why year was left out; one sentence would do, and here the generator draws the year
    independently of the drug as well.
