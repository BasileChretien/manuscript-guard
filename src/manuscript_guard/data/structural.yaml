schema: manuscript-guard/structural/1

# Numbers that point at something rather than measure something: cross-references,
# categorical labels and list markers.
#
# Each pattern is matched against the whole line, and an atom counts as structural only
# when the match covers it. That is what distinguishes "grade 3" from the "12" in
# "grade 3 events occurred in 12 patients" — the first is a label, the second is a result
# and must be bound.

structural:
  - id: cross-reference
    why: A pointer to a table, figure or section.
    pattern: '(?i)\b(?:table|tables|figure|figures|fig\.?|figs\.?|appendix|annex|box|panel|equation|eq\.?|section|chapter|step|item|supplementary\s+(?:table|figure|file|material|method)s?|supplement|additional\s+file)\s*[-–]?\s*S?\d+[A-Za-z]?\b'

  - id: supplement-tag
    why: Supplement identifiers of the form S1, S2.
    pattern: '\bS\d+[A-Za-z]?\b'

  # Both of these rules read `<keyword> <digits>`, and a rule that spans an atom accepts it,
  # so an unbounded `\d+` handed the gate any number that happened to follow one of these
  # words. "In the exposed arm 47 hepatic events", "over the study years 1204 reports" and
  # "the pooled cohort 3841 reports" all filed the count as a category label — ordinary
  # English word order, needing only a missing comma. The magnitudes are now bounded to what
  # a label can actually be, which is the same correction `age-band` and `rate-denominator`
  # needed: name the values, do not match a shape.
  - id: categorical-label
    why: An ordinal category naming a class of thing, not a measurement of it.
    # 0-20. There is no grade 47 and no arm 3841; past twenty it is a count, not a class.
    pattern: '(?i)\b(?:phase|grade|stage|type|class|line|round|wave|tier|level|version|arm|group|cohort|model|scenario|quartile|quintile|tertile|decile)\s*[≥≤<>]?\s*(?:\d|1\d|20)[A-Za-z]?\b'

  - id: time-label
    why: A named timepoint or window, e.g. day 30, 30-day, week 12.
    # Up to three digits: day 365 is a real window, year 1204 is not. Four digits would also
    # re-admit the bare year that this toolkit insists on treating as data.
    # A label, not a count that happens to follow a time word. "In the first 6 months
    # 214 cases were reported" classified 214 as a timepoint: the round-one fix bounded
    # this to three digits, and one digit fewer walks straight back in. The lookahead is
    # what separates "day 30" from "months 214 cases" — a label is not followed by the
    # thing it would otherwise be counting.
    pattern: '(?i)\b(?:day|week|month|year|hour|minute|visit|cycle)s?\s*[-–]?\s*\d{1,3}\b(?!\s+(?:[a-z]+\s+){0,2}(?:case|patient|report|event|subject|participant|record|death|admission|prescription|episode|observation|woman|women|child|children|infant)s?\b)|\b\d{1,3}\s*[-–]\s*(?:day|week|month|year|hour|minute)\b'

  - id: ordered-list-marker
    why: Markdown list numbering.
    pattern: '^\s{0,3}\d+[.)]\s'

  - id: numbered-heading
    why: Markdown heading numbering.
    pattern: '^#{1,6}\s+\d+(?:\.\d+)*[.)]?\s'

  - id: author-year-citation
    # Audit only. The pattern spans a whole parenthetical, and a rule that spans an atom
    # accepts it, so in manuscript source this would file every number sharing a bracket
    # with a year — "(Smith 2019, n = 412)" — as structural. Source citations are [@key]
    # and already masked, so the rule is pure cost there.
    audit_only: true
    why: >-
      A rendered author-year citation. In manuscript source a citation is [@key] and gets
      masked, but a built document has already been through citeproc, so auditing an
      existing paper meets "(Smith and Jones 2019)" as ordinary text. Without this every
      citation in the paper is reported as an unexplained number.
    pattern: '\((?:[^()]{0,80}?[A-Za-z][^()]{0,80}?)?\b(?:19|20)\d{2}[a-z]?(?:[;,]\s*[^()]{0,60})?\)|\b[A-Z][A-Za-z''-]+\s+(?:et al\.?|and\s+[A-Z][A-Za-z''-]+)\s*,?\s*\(?(?:19|20)\d{2}[a-z]?\)?'

  - id: age-band
    why: An age or duration band is a category label, not a measured value.
    # The last branch used to end `(?:years?)?` — optional, so a bare `<digits>+` anywhere
    # matched it and `The trial enrolled 500+ patients` was filed as an age band. The unit
    # is now required, which is what the `why` above always claimed.
    # The bare-range branch is years and months only. With days and weeks in it, "the
    # risk window was 1-28 days" classified as an age band — and a risk window is the
    # design parameter the analysis selects on, not a label. A self-controlled case
    # series is written entirely in such ranges (0-1 days, 2-14 days, 15-42 days), so
    # the rule waved through the numbers that define the study while still demanding a
    # binding for the single-valued form, "28 days". An age cue word still admits the
    # day range where it really is one: "aged 0-28 days".
    pattern: '(?i)\b(?:age[ds]?|aged|years?|months?|weeks?)\s*(?:group|band|range)?\s*[:,]?\s*\d+\s*(?:[-–—]\s*\d+|\+)|\b\d+\s*[-–—]\s*\d+\s*(?:years?|months?)\b|\b\d+\+\s*(?:years?|months?|weeks?|days?)\b'

  - id: software-version
    why: >-
      A software version names a thing, it does not measure one. Methods sections are
      required to state them - STROBE and READUS-PV both ask - and G2 was failing the very
      sentence the methods ledger exists to make an author write.
    # Named or shaped, never a bare `\d+\.\d+`. The first draft of this rule matched any
    # two-part decimal and promptly classified an odds ratio of 3.84 and a z of 1.96 as
    # software versions - the same shape-not-value mistake five other rules had to be
    # corrected for. Three or more components is essentially never a measurement; two
    # components need either an explicit `v` or a named piece of software in front.
    # Three attempts, and the history is the argument for tests/data/rule_cases.yaml.
    # `\d+\.\d+` classified an odds ratio of 3.84. "Three or more components" then classified
    # `2.10-7.02`, because a hyphenated confidence interval has three components under that
    # reading - and a hyphenated CI is how a pharmacovigilance result is normally written.
    #
    # The bare form is therefore dots only: 4.4.1, 3.12.3, 3.9.0.2. Hyphens are allowed only
    # where a `v` or a named piece of software says this is a version - which is also what
    # lets `Stata 18` and `SPSS 29` through, single-component versions the previous attempt
    # refused. Names that are ordinary English words (survival, meta) are deliberately not on
    # the list: "survival 3 years" is prose.
    pattern: '(?i)\b\d+\.\d+\.\d+[A-Za-z0-9.\-]*\b|\bv(?:er(?:sion)?)?\.?\s*\d+\.\d+[A-Za-z0-9.\-]*|\b(?:R|Python|Julia|SAS|Stata|SPSS|MATLAB|Excel|pandoc|Zotero|Word|MedDRA|WHODrug|PostgreSQL|SQLite|pandas|numpy|scipy|statsmodels|scikit-learn|ggplot2|dplyr|tidyverse|epitools|jsonlite|matplotlib|lme4|metafor)\s+v?\d+(?:[.\-][A-Za-z0-9]+)*'

  - id: citation-locator
    why: >-
      A page, chapter or figure locator inside a citation bracket. Citation *keys* are
      masked; the rest of the bracket is read, because pandoc renders it - which is how a
      fabricated interval once travelled into the document inside a citation suffix. A
      locator is the one thing legitimately written there, so it is named rather than
      masked with everything else.
    pattern: '(?i)\b(?:pp?|chap|ch|sec|s|fig|figs|vol|no|para|paras|art|tab)\.\s*\d+(?:\s*[-\u2013\u2014]\s*\d+)?'

  - id: table-alignment-row
    why: Markdown table separator rows.
    pattern: '^\s*\|?[\s:|-]+\|[\s:|-]*$'

  - id: checklist-item
    why: >-
      A reporting-guideline item number points at a published checklist, the same way a
      cross-reference points at a table. "RECORD 6.1", "STROBE item 14", "CONSORT 3a" are
      written wherever a paper says which requirement a passage answers - most often in the
      caption of the table that exists only because the checklist asked for it.
    # The guideline has to be named immediately before the number, so this cannot reach a
    # measurement; a count is not preceded by the word STROBE.
    pattern: '(?i)\b(?:STROBE|RECORD(?:-PE)?|CONSORT|SPIRIT|PRISMA(?:[\s-][A-Za-z]+)?|TRIPOD(?:\+AI)?|ARRIVE|READUS(?:-PV)?|MOOSE|SQUIRE|CARE|STARD|COREQ|SRQR|AGREE|ENTREQ|CHEERS|GRRAS)\b\s*(?:20\d\d)?\s*(?:checklist)?\s*(?:items?|points?|elements?)?\s*(?:no\.?)?\s*\d+[a-z]?(?:\.\d+[a-z]?)?\b'

  - id: alphanumeric-identifier
    why: >-
      An identifier that begins with letters and continues with digits names a thing; a
      measurement cannot be written that way. ICD-10 K71.0, ATC L01XC, MedDRA SOC codes,
      trial registrations NCT01234567 and PROSPERO CRD42020123456, and the named
      disproportionality statistics IC025, EB05 and EB95 are all this one shape.
    # Safe by construction rather than by enumeration, which is the opposite of how the
    # other rules here have to work: they match digits, so they must name the conventional
    # values or they swallow a result. Nothing that starts with a letter is a quantity, so
    # this one can be general. It classifies the identifier only - "IC025 was 1.42" leaves
    # 1.42 unclassified and needing a binding, which is correct.
    #
    # Bounded at three leading letters so it stays an identifier: a longer run is a word,
    # and `Table 1` is two atoms anyway. A trailing decimal group is allowed for ICD-10
    # (K71.0) but capped at three digits so it cannot reach into a following measurement.
    #
    # Two digits minimum, which is what every coding system this is for actually uses. With
    # one it also claimed `Q1` and `S1`, taking them from `percentile-labels` and
    # `supplement-tag` — the same verdict by a rule that explains it worse, and `explain`
    # exists to tell an author which convention they relied on.
    # Up to ten leading letters. Three was justified as "a longer run is a word", which
    # does not follow: the safety argument is that nothing beginning with a letter is a
    # quantity, and that holds at any length. At three it excluded the whole non-US trial
    # registry namespace — EUPAS100234, ISRCTN12345678, ACTRN12345678901, ChiCTR2000012345.
    pattern: '\b[A-Z]{1,10}\d{2,}(?:[A-Z]{1,2}\d*)*(?:\.\d{1,3})?\b'

  - id: coding-system-code
    why: >-
      A numeric code in a named coding system. LOINC 1742-6, SNOMED CT 197315008 and MedDRA
      preferred term 10019663 are digits all the way through, so unlike an ICD-10 code they
      are indistinguishable from a measurement on shape alone and the system has to be
      named beside them.
    # The bridge between the system name and the code is a whitelist, not a wildcard:
    # punctuation, a version number, and a closed set of function words. The set may not
    # contain a word that introduces a quantity — with `for`, `in`, `to`, `from`, `used`
    # and `were` in it, "the ATC codes were used for 1204 prescriptions" classified the
    # count, and "ICD-10 codes from 2011 to 2019" classified the whole study period,
    # which is the one thing DESIGN insists must be bound. Quotes and brackets are in,
    # Quotes and brackets are deliberately NOT in the bridge. Admitting them let the
    # rule walk into a quoted number - `MedDRA terms "9999" and 10028606` classified
    # the 9999 - and they only help with one phrasing, `MedDRA (version 27.0)
    # preferred terms "myocarditis" (10028606)`, which needs to cross an arbitrary
    # term name as well and so fails regardless. That phrasing is a known gap: write
    # `MedDRA preferred term 10028606` and the rule fires.
    #
    # A full stop is not in the bridge either, and the gaps are spaces or a single line
    # break rather than `\s*`. "Events were coded using MedDRA terms. 15320 reports were
    # retrieved" classified the count in the *next sentence*, and once the classifier
    # started scanning whole documents there was no distance cap left to stop it: with a
    # 250-line gap the rule still reached the number. A code sits beside the system that
    # names it, on the same line or the next one.
    # punctuation, a version number, and a closed set of function words. Real prose puts a
    # clause between them — "coded with MedDRA version 26.1; the preferred term 10019663" —
    # so the rule has to reach, but "anything within 120 characters" would classify the
    # count in "ICD-10 codes were found in 412 patients". Nothing a measurement can be
    # written as is allowed in the bridge, which is what keeps the reach safe.
    pattern: '(?i)\b(?:LOINC|SNOMED(?:[\s-]?CT)?|MedDRA|RxNorm|NDC|CPT|HCPCS|OPCS|ICD(?:[\s-]?(?:9|10|11))?(?:[\s-]?(?:CM|PCS))?|ATC)\b(?:[ \t]*\n?[ \t]*(?:v(?:er(?:sion)?)?\.?[ \t]*\d+(?:\.\d+)*|[;,:=]|\b(?:the|a|an|its|their|and|coded|code|codes|coding|term|terms|concept|concepts|class|classes|identifier|identifiers|preferred|lowest|highest|high|level|group|system|organ|query|following|listed|below|LLT|PT|HLT|HLGT|SOC|SMQ)\b)){0,14}[ \t]*\n?[ \t]*\d{4,18}(?:-\d)?(?:\s*(?:,|;|and|or|to|through|[-–])\s*\d{4,18}(?:-\d)?){0,20}'
