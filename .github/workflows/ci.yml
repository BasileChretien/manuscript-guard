name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The gates must hold on the platforms other scientists actually use, and only Windows
    # is available to the author, so the other two are covered here rather than assumed.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -q

  r-interop:
    # The results contract is only a contract if a second language can honour it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: jsonlite, digest
      - run: pip install -e ".[dev]"
      - run: pytest -q tests/test_r_emitter.py
