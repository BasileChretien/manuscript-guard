schema: manuscript-guard/conventions/1

# Numbers that are conventions of scientific writing rather than findings.
#
# This list is deliberately narrow, and every pattern is pinned to the specific
# conventional values rather than to a shape. A rule matching "p < <any number>" would
# wave through every reported p-value in the paper, which is the opposite of the point:
# a p-value you obtained is a result and belongs in results.json. Only the threshold you
# chose in advance is a convention.
#
# Projects extend this through `conventions:` in paper.yaml, where each addition requires
# a written justification.

conventions:
  - id: significance-threshold
    why: A pre-specified alpha level is a design choice stated by convention, not a result.
    # Methods only. The same characters mean two different things: "p < 0.05" where the
    # paper describes its own method is the threshold the author chose in advance, and
    # "p < 0.001" in the Results is a finding. As a convention everywhere, a significance
    # claim the analysis never produced walked past the gate. Bind a reported p-value like
    # any other result; `display="<0.001"` is accepted for one too small to state.
    methods_only: true
    pattern: '(?i)\bp[\s-]*(?:value)?\s*[<≤]\s*0?\.(?:0001|001|01|05)\b'

  - id: alpha-level
    why: Same as the significance threshold, written as alpha.
    methods_only: true
    pattern: '(?i)(?:\balpha\b|α)\s*(?:level)?\s*(?:was|of|[=:])\s*0?\.(?:0001|001|01|05)\b'

  - id: confidence-level
    why: The confidence level of an interval is conventional; its bounds are results and must be bound.
    # 80 belongs here: it is the conventional level for a futility or non-inferiority
    # margin and for the prediction intervals in a meta-analysis. Still an enumeration of
    # the conventional levels, not `\d+%`, which would classify every percentage in the
    # paper that happened to sit before the letters CI.
    # `CI\b` broke on the plural, so "95% CIs" — ordinary Results prose — failed while
    # "intervals of 95%" passed. And `credibility interval` was missing: it is what the
    # UMC literature calls the interval that IC025 is the lower bound of, so the toolkit
    # shipped a rule for `IC025 > 0` and then failed the interval it belongs to. The
    # adjective slot admits the named estimators — mid-P exact, Wald, Wilson score,
    # profile-likelihood, bootstrap — which are written between the level and the noun.
    pattern: '(?i)\b(?:80|9[059]|99\.9)\s*%\s*(?:(?:two|one)[\s-]sided\s+)?(?:[A-Za-z][\w-]*\s+){0,3}(?:CIs?\b|CrIs?\b|(?:confidence|credible|credibility|compatibility|prediction)\s+intervals?)'

  - id: confidence-level-trailing
    why: The same convention with the level written after the interval.
    pattern: '(?i)\b(?:CIs?|CrIs?|(?:confidence|credible|credibility|compatibility|prediction)\s+intervals?)\s*(?:set\s+)?(?:of|at)\s*(?:80|9[059]|99\.9)\s*%'

  - id: target-power
    why: A conventional target power stated in a sample-size paragraph.
    # A sample-size paragraph is Methods. Observed power reported afterwards is a result.
    methods_only: true
    pattern: '(?i)\b(?:statistical\s+)?power\s*(?:of|at|=|:)?\s*(?:0\.(?:8|9|80|90)|80|90)\s*%?'

  - id: percentile-labels
    why: Named distribution points are labels, not measured values.
    pattern: '(?i)\b(?:2\.5|25|50|75|97\.5)th\s+percentile|\bQ[13]\b|\bP(?:25|50|75)\b'

  - id: rate-denominator
    why: A per-N denominator is a conventional unit of expression; the rate itself is the result and must be bound.
    # Pinned to the canonical powers of ten, per this file own rule that a pattern names the
    # conventional values rather than a shape. Written as \d[\d\s,]* it matched any digit run,
    # so "12 per 83,214 patients treated" waved the cohort size - a genuine, unbound result -
    # straight through the gate that carries the core invariant.
    pattern: '(?i)\bper\s+(?:1[,\s  ]?000[,\s  ]?000|100[,\s  ]?000|10[,\s  ]?000|1[,\s  ]?000|100)\s*(?:[a-z]+[\s-]){0,2}(?:person|people|patient|inhabitant|resident|prescription|user|exposure|treatment|admission|birth|population|report|individual|woman|women|man|men|child|children|infant|dose|DDD|case|subject|participant|year|day|month)'

  - id: two-by-two
    why: A 2 x 2 table is the name of a structure.
    pattern: '(?i)\b2\s*[×x]\s*2\b'

  - id: iso-8601
    why: Naming a standard, not stating a value.
    pattern: '(?i)\bISO[\s-]?8601\b'

  - id: balance-criterion
    why: >-
      The published constants a cohort study is judged against. A standardised mean
      difference below 0.1 and a caliper of 0.2 standard deviations of the propensity-score
      logit are Austin's; an I-squared above 50% is Higgins'. A paper states which it used;
      the values are not its own findings.
    # Methods only, and pinned to the published values, exactly like
    # `disproportionality-criterion`. Every one of these was unclassifiable, which sent a
    # RECORD-PE author to `conventions:` in paper.yaml on their first Methods section - the
    # one mechanism DESIGN calls able to make G2 vacuous.
    methods_only: true
    pattern: '(?i)\b(?:standardi[sz]ed\s+mean\s+difference|SMD|absolute\s+standardi[sz]ed\s+difference)\s*(?:of|below|under|less\s+than|[<≤]=?)\s*0?\.1\b|\bcaliper\s*(?:of|[=:])?\s*0?\.2\b|\bI\s*[²2]\s*[>≥]=?\s*(?:25|50|75)\s*%|\bmatched\s+1\s*:\s*[1-9]\b'

  - id: ratio-null-value
    why: >-
      The 1 a ratio is compared against is where the scale has no effect, not a quantity
      anyone measured. "The 95% CI excluded 1" is the standard sentence for reporting an
      interval, and every paper reporting a ratio writes it.
    # Anchored on the comparison word and stopped at the end of the clause, deliberately
    # not spanning back to the ratio it is about. A pattern reaching from "ROR" to
    # "excluded 1" would also cover the interval in between - "the ROR (1.02 to 3.84)
    # excluded 1" - and file the two bounds, which are the actual result, as conventional.
    # That is the mistake that made `author-year-citation` audit-only.
    #
    # `\Z`, not `$`. Under re.MULTILINE — which the classifier needs so that `^` means
    # line — `$` matches at the end of every line, and every manuscript here is
    # hard-wrapped. "...that excluded 1\npatient with missing data..." then read as the
    # null value of a ratio because of where an editor happened to wrap, which is a value
    # passing by coincidence: the one thing this file says cannot happen.
    # The lookahead is what separates "the interval excluded 1" from "the cohort excluded 1
    # patient": a null value ends its clause, a count is followed by what it counts.
    #
    # No branch for the word "unity": it is not a number, so it never becomes an atom and a
    # rule for it would never run. "The null value of 1" does produce one, and is written.
    pattern: '(?i)\b(?:exclud\w+|cross\w+|straddl\w+|contain\w+|spann\w+|includ\w+|above|below|exceed\w+|(?:greater|less)\s+than|either\s+side\s+of)\s*(?:the\s+)?(?:null\s+value\s+of\s+)?1(?:\.0+)?(?=\s*(?:[.,;:)\](\[]|\Z)|\s+(?:[a-z]+ly\s+)?(?:with|and|or|but|which|indicat\w+|suggest\w+|consistent|for|in|across|among|at|throughout|after|before|on|whereas|while|although|though|so|thus|hence|therefore)\b)'

  - id: disproportionality-criterion
    why: >-
      The published thresholds that define a pharmacovigilance signal. IC025 above zero is
      the WHO-UMC criterion, EB05 at or above 2 is DuMouchel's, and PRR at or above 2 with
      a chi-squared of 4 and at least 3 cases is Evans'. A paper states which it used; the
      values are not its own findings.
    # Ω is Norén's shrinkage measure for drug-drug interaction, and `Ω025 > 0` is its
    # signal criterion — the same shape as IC025 and used in VigiBase, EudraVigilance
    # and FAERS interaction screening. It was unwritable: `Ω` is not ASCII, so the
    # identifier rule could not take it either.
    # The bare `N >= 3` branch is gone. Unlike every other branch here it named no
    # statistic, so "subgroups with N >= 3 patients per site" — an unrelated inclusion
    # threshold — was filed under the Evans criterion. A branch that matches a shape
    # rather than naming a value does not belong in this file.
    # Methods only, and pinned to the published values rather than to `<statistic> <op>
    # <number>`. As a shape it would have accepted "IC025 was above 1.42", waving through
    # the very result the criterion is applied to - and as a convention everywhere it would
    # have done the same in the Results.
    methods_only: true
    pattern: '(?i)\b(?:IC0?25|IC|Ω0?25|Ω|omega0?25|omega)\s*[>≥]=?\s*0(?:\.0+)?\b|\b(?:EB0?5|EBGM|PRR|ROR)\s*[>≥]=?\s*2(?:\.0+)?\b|\b(?:chi[\s-]?squared?|χ2|χ²|X2)\s*[>≥]=?\s*4(?:\.0+)?\b|\b(?:at\s+least|a\s+minimum\s+of|no\s+fewer\s+than)\s+3\s+(?:cases?|reports?|events?)\b|[>≥]=?\s*3\s+(?:cases?|reports?|events?)\b'
