schema: manuscript-guard/structural/1

# Numbers that point at something rather than measure something: cross-references,
# categorical labels and list markers.
#
# Each pattern is matched against the whole line, and an atom counts as structural only
# when the match covers it. That is what distinguishes "grade 3" from the "12" in
# "grade 3 events occurred in 12 patients" — the first is a label, the second is a result
# and must be bound.

structural:
  - id: cross-reference
    why: A pointer to a table, figure or section.
    pattern: '(?i)\b(?:table|tables|figure|figures|fig\.?|figs\.?|appendix|annex|box|panel|equation|eq\.?|section|chapter|step|item|supplementary\s+(?:table|figure|file|material|method)s?|supplement|additional\s+file)\s*[-–]?\s*S?\d+[A-Za-z]?\b'

  - id: supplement-tag
    why: Supplement identifiers of the form S1, S2.
    pattern: '\bS\d+[A-Za-z]?\b'

  - id: categorical-label
    why: An ordinal category naming a class of thing, not a measurement of it.
    pattern: '(?i)\b(?:phase|grade|stage|type|class|line|round|wave|tier|level|version|arm|group|cohort|model|scenario|quartile|quintile|tertile|decile)\s*[≥≤<>]?\s*\d+[A-Za-z]?\b'

  - id: time-label
    why: A named timepoint or window, e.g. day 30, 30-day, week 12.
    pattern: '(?i)\b(?:day|week|month|year|hour|minute|visit|cycle)s?\s*[-–]?\s*\d+\b|\b\d+\s*[-–]\s*(?:day|week|month|year|hour|minute)\b'

  - id: ordered-list-marker
    why: Markdown list numbering.
    pattern: '^\s{0,3}\d+[.)]\s'

  - id: numbered-heading
    why: Markdown heading numbering.
    pattern: '^#{1,6}\s+\d+(?:\.\d+)*[.)]?\s'

  - id: author-year-citation
    why: >-
      A rendered author-year citation. In manuscript source a citation is [@key] and gets
      masked, but a built document has already been through citeproc, so auditing an
      existing paper meets "(Smith and Jones 2019)" as ordinary text. Without this every
      citation in the paper is reported as an unexplained number.
    pattern: '\((?:[^()]{0,80}?[A-Za-z][^()]{0,80}?)?\b(?:19|20)\d{2}[a-z]?(?:[;,]\s*[^()]{0,60})?\)|\b[A-Z][A-Za-z''-]+\s+(?:et al\.?|and\s+[A-Z][A-Za-z''-]+)\s*,?\s*\(?(?:19|20)\d{2}[a-z]?\)?'

  - id: age-band
    why: An age or duration band is a category label, not a measured value.
    pattern: '(?i)\b(?:age[ds]?|aged|years?|months?|weeks?)\s*(?:group|band|range)?\s*[:,]?\s*\d+\s*(?:[-–—]\s*\d+|\+)|\b\d+\s*[-–—]\s*\d+\s*(?:years?|months?|weeks?|days?)\b|\b\d+\+\s*(?:years?)?\b'

  - id: table-alignment-row
    why: Markdown table separator rows.
    pattern: '^\s*\|?[\s:|-]+\|[\s:|-]*$'
