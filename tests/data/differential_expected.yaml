# The readings a pull request means to change.
#
# tests/test_differential.py puts generated inputs through the base branch's source and
# through the working tree's, reading by reading (tests/readings.py), and fails on any
# difference. A pull request that changes what a gate reports is meant to differ, and says
# so here:
#
#   expected:
#     - reading: vocabulary
#       why: >-
#         a `>` line under the rule of a simple table is a row of it again, so the terms
#         in it are counted
#
# An entry excuses one reading, in the pull request that adds the entry and in no other:
# once it is merged the base holds it too, and it is spent. The reading then passes and
# lists what differs, for whoever reviews the change to read against the `why`. Every other
# reading still fails on a difference, which is how "nothing else changed" is held.
#
# An entry is also how a pull request says it changed what a reading goes through, a
# helper that takes another argument now, so that the base's source cannot be asked for
# that reading at all. Without the entry that fails: nothing was compared.
#
# An entry for a reading that does not differ fails, and so does one that names no reading.
# Spent entries may stay as a record or go; the list is not read for them.

expected:
  - reading: word abstract
    why: >-
      a Word paper that uses heading styles and titles its Abstract by a run-in "Abstract:"
      or "Abstract." opening its paragraph, or by "Abstract" alone on a line of its own, in
      bold or not, has that Abstract compared with its Results, where the base said no file
      has a heading that names the Abstract; it ends at the next heading, or before it at a
      title typed on a line of its own that is no part of it, "Author information" among
      them (Basile, 2026-11-14, five papers of the real-paper corpus)
  - reading: audit references not sorted
    why: >-
      a paper's entries the audit cannot sort are one note, at the first of them, naming
      each entry and its reason once and listing each with its line, where the base gave a
      note for each entry; the other notes on an entry with no DOI and no PMID are as they
      were (Basile, 2026-11-14, decision 16: 1,405 such notes on 22 real preprints)
  - reading: latex refusals
    why: >-
      a `\makeatletter` in the body is skipped to its `\makeatother`, and a conditional in
      the body to its matching `\fi`, and the file read on past it, where the base stopped
      reading at it; a block skipped is no refusal of the reader's but the tree's, so it is
      not listed here, and one with no end in the file is refused as before (Basile,
      2026-11-13, three real papers whose reading stopped at one)
  - reading: latex bindings
    why: >-
      past a `\makeatletter` or a conditional skipped in the body the file is read on, so a
      binding or a number after one is read where the base read nothing past it (Basile,
      2026-11-13)
  - reading: latex printed
    why: >-
      past a `\makeatletter` or a conditional skipped in the body the file is read on, so
      what prints after one is in the view where the base read nothing past it (Basile,
      2026-11-13); and, with #673 merged, optidef's problems, `mini!`, `maxi` and the rest,
      are maths, so the view holds no problem's arguments and constraints as text
  - reading: latex words
    why: >-
      past a `\makeatletter` or a conditional skipped in the body the file is read on, so the
      words after one are read where the base read nothing past it (Basile, 2026-11-13);
      and, with #673 merged, optidef's problems, `mini!`, `maxi` and the rest, are maths,
      which G14 reads no word of
  - reading: latex writing
    why: >-
      G6 reads the body as typed but for a block skipped, a `\makeatletter`'s or a
      conditional's, which it reads nothing of, and reads on past it, where the base read
      nothing past it (Basile, 2026-11-13); and, with #673 merged, optidef's problems,
      `mini!`, `maxi` and the rest, are maths, so G6 reads no word of their arguments and
      constraints
  - reading: code names
    why: >-
      a name in a table's cell is no name in the prose: a Markdown table of the four kinds
      pandoc reads, and a LaTeX tabular, tabularx, tabulary or longtable, are not read; and
      optidef's problems, mini, maxi, argmini and argmaxi with their starred, `!` and `e`
      forms, are maths (decision 13, 2026-11-13, after tex-econ-em-A2's 98 findings in its
      tabulars and tex-qbio-pe-A2's `w_{min}`); the generated inputs now hold a name in a
      pipe table, a simple table, a tabular, a longtable and a `mini!`, which the base reports;
      a table's caption and a footnote in a tabular's cell are read still (round 1 of #673)
  - reading: written shares
    why: >-
      new with this pull request: a share a sentence writes beside both its counts, "12 of
      40 patients (50%)", under any heading or in a note, is held to them as the Abstract's
      is, and one off them is listed with the numbers that do not fit the ones beside them,
      by the heading it stands under (Basile, 2026-11-13, after #664), a range written with
      a slash, "Grade 3/4 neutropenia (12%)", being none (round 1 of #668); the base said
      only the Abstract's and a table's, which the reading lists as before
  - reading: abbreviations
    why: >-
      a short form after a spaced dash followed by a value bound to the results, "– OR
      {{results.or}}.", after a colon, a comma or a closing dash too, or by a closing dash
      and a number, "– OR – 1.52 in all", defines nothing, where each was a second
      definition of OR; a list item ends at its line's end only where the next line is no
      continuation of it, and a prose line opening "2020) " in a paragraph's middle is no
      list item (round 2 of #643); a binding that prints no value, an anchor or a pointer,
      leaves the definition standing, an item under a lazy continuation is still one, and a
      list under a lead-in line, or in a block quote, defines each entry where the next item is of
      the same kind, or the list opens under a line ending in a colon (rounds 1 and 2 of #662); the inputs now hold each of these
      shapes, and list items over a nested list and after a continued one, which still
      define. The entry it replaces, for #643 itself, is spent
  - reading: audit abbreviations
    why: >-
      the audit reads its definitions through G14's, so a short form after a spaced dash
      followed by a value bound to the results, "– OR {{results.or}}.", is undefined and no
      longer an unused definition, as G14 now reads it (round 2 of #643); the inputs now
      hold the dash shapes G14's reading draws
  - reading: mask
    why: >-
      a link's target that is an address is masked after its `(` up to its own `)`, and the
      stop after it and what follows on its line are left; the address was taken to the next
      space, the link's `)` and stop with it, and the target then ran on to the next `)` on
      the line; the inputs now hold a link of each kind of target
  - reading: numbers
    why: >-
      a number after a link on its line, "[the code](https://...). Data (n = 1213)", is read
      and judged, where the link's target hid it up to the next `)`; the inputs now hold a
      link of each kind of target
  - reading: notation
    why: >-
      the hint of a form written two ways ends "The place given is the first use of the
      other form", where it said "This is the first place the other form stands", which the
      author did not understand (the author's audit, 2026-11-10)
  - reading: abstract against results
    why: >-
      a heading whose whole title is one of the names the Results go by elsewhere,
      "Experiments", "4. Numerical results", "Empirical analysis" and the rest of
      `RESULTS_LIKE`, is the Results to the Abstract against Results where the section
      searches, so the Abstract is compared where the base said "no file has a Results
      heading outside the Abstract"; where it still is not, the reason names those headings
      (Basile, 2026-11-13, after tex-astro-ga-A2, tex-cs-lg-A1 and tex-stat-ap-B1 of the
      real-paper corpus); the inputs now hold a paper for each name and each near miss. The
      entry it replaces, for the percentages beside their counts (#664), is spent
  - reading: reply numbers
    why: >-
      a number in a reply after a link on its line is read and, unbound, reported, where the
      link's target hid it up to the next `)`
  - reading: reworded
    why: >-
      a number after a link on its line is counted among a sentence's numbers, where the
      link's target hid it up to the next `)`
  - reading: placeholders
    why: >-
      a placement marker, a table or a figure named with its number where it is to go,
      "[Insert Table 1 here]", "[INSERT FIGURE 2]", also after pandoc's escaping, with a
      number that has a dot in it, "Table 1.1", a Roman numeral from I to XIX, "[INSERT TABLE
      XIV]", or "Fig." run into it, "[Insert Fig.1 here]", is no placeholder (Basile,
      2026-11-11, after 52 real preprints; round 1 of #625); the inputs now hold a marker of
      each form, and an instruction with no number, with other words, or with X or XX for
      its number, which is one still
  - reading: table margins
    why: >-
      categories over their column's n by no more than (k + 1) / 2 for k categories,
      rounded down, are said as a gap rounding weighted counts and the n may make (Basile,
      2026-11-11, a survey's age groups at 12,766 under "N = 12,765"; round 1 of #625 added
      the n's half count); the inputs now hold such a column beside one over by one more,
      which is said as before, and three categories two over, which only the n's half count
      allows
  - reading: import
    why: >-
      under "would merge into" and "NOT merged into" the import prints each changed
      stretch, as it was (`-`) and as it is (`+`), with a few words either side, where it
      printed the paragraph's first 150 characters
  - reading: word merged
    why: >-
      a sign or comparison set before a value in Word with a space between, "– 3.84", and a
      unit or percent sign added after one, changed or taken out, is refused, naming the
      value (KG454); and a rewording that leaves the source's `<` and `>` a tag to pandoc
      once the values are in, as deleting "(see Table 2)" from `<LLOQ in {{results.unit}}
      (see Table 2) at {{results.site}} and >ULOQ` did, is refused as one (KG410.3); the
      inputs now hold such edits, which the base merged
  - reading: interval order
    why: >-
      the sentences an interval's bounds are compared in are read with each HTML comment
      blanked, as the bindings are: a stop inside a comment ends no sentence, so a reversal
      with such a comment between its bounds is reported, and a stop with a comment typed
      against it ends one, so the bounds on either side of it are no longer compared
  - reading: check
    why: >-
      G2 reads no number of a typed reference list, under a heading or a title in bold that
      names one, up to where `text.reference_lists` ends it, so its years, volumes, pages
      and terms are no longer counted or failed (decision 5, 2026-11-11: the real-paper
      corpus rebuilt with init --from)
  - reading: data dates
    why: >-
      the finding says the date was emitted as a string rather than typed, and its hint adds
      that a year computed from the data is emitted as a number, which is not warned of;
      what is warned of is unchanged
  - reading: reported tests
    why: >-
      a P above 1, "P = 4.1 x 10^5", is not judged; a number with a middle dot or a comma
      for its point is not read, nor a P cut off before one; and Dunnett's and
      Games-Howell's procedures stand a test down as the other named adjustments do
  - reading: summaries
    why: >-
      where a paper has no Results heading, a key bound under a heading that names no part
      of it is read as reported, `Walk.reported_without_results`, which the base does not
      have; the reading reports those keys, and its inputs now hold papers with no Results
  - reading: word blocks
    why: >-
      a figure whose paragraph carries an identifier Word left there, from a paragraph cut
      above it with Track Changes off, is read as the figure, by its picture, with the
      identifier before it as a block of no text; it was read as an empty paragraph
      carrying that identifier, and import reported the figure missing
  - reading: pointers
    why: >-
      G2 holds a caption beside a table or a figure to that display, so a typed caption or a
      ref opening one that names another display is caption-names-another; the inputs now
      place captions, and two tables one after the other with a caption between them
  - reading: prose quotations
    why: >-
      a sentence that opens with a typographic quotation mark is a sentence of its own, as
      one that opens with a straight one is, so its quotation is held to its own citation
      and not to the one of the sentence before (step 8, G7)
  - reading: quote words
    why: >-
      a run of Han, Hiragana or Katakana in a ledger quote is a word for every two letters
      in a row, one of Thai, Lao, Khmer or Myanmar for every four, rounded down, and a Latin
      word glued to such a run is a word of its own, where the whole run between spaces was
      one word; the inputs now hold Japanese, Chinese and Thai pieces (G7, quote-too-short)
  - reading: hidden
    why: >-
      G14 read the mask with each line feed put back and each carriage return NUL; the
      mask keeps both now in the front matter and a listing, so a file with CRLF line ends
      keeps its carriage returns there too, which every reading of it takes for a space
  - reading: own words
    why: >-
      read from the `hidden` text, which keeps a carriage return in the front matter and a
      listing of a file with CRLF line ends where it was NUL
  - reading: latex documents
    why: >-
      a `subfiles` part the paper places by `\subfile` and a `standalone` picture it places
      by `\includestandalone` are read where the command stands, past their preambles, and
      are no longer loose, and the preamble's `\input name` without braces is followed; the
      inputs now hold placed parts and pictures, inside a figure and under headings
      (Known gaps, 2026-10-27)
  - reading: spelling
    why: >-
      a reference list under the headings "Literature cited" and "Reference list", or under
      a title in a block quote, `> **11. REFERENCES**:`, a link,
      `[**References**](#_Ref89712232)`, or a bold title a hard line break opens, is passed
      over, so the spelling of its entries is not read; the inputs now hold these titles
      (the real-paper corpus, 2026-11-11)
  - reading: recycled passages
    why: >-
      a reference list under a title in a block quote, `> **11. REFERENCES**:`, a link,
      `[**References**](#_Ref89712232)`, a bold title a hard line break opens, or the
      heading "Reference list", is set apart, so a passage of the earlier paper repeated in
      its entries is not reported; the inputs now hold these titles (the real-paper corpus
      and round 1 of #623, 2026-11-11). The entry it replaces, for the author-year
      citations of an earlier paper, is spent
  - reading: communicate language
    why: >-
      new with this pull request: `checking.in_english` decides whether a communication
      text is held to the claim ladder and G6 by its front matter's `language`, and the
      base has no such function, so it cannot be asked
  - reading: search words
    why: >-
      after an accent, `\i` is the dotless letter and the letters after it are the word's,
      since an accent's argument is one letter: `pol\^\itica` is searched for as "politica",
      where the longest command, the `\it` of italics, made it "polica"; the lines drawn
      now hold an accent on a dotless i before a t, braced and not
  - reading: plan variables
    why: >-
      the plan's Software section names packages and functions, and G12's data dictionary
      check no longer reads them as variables (#592), as it does not read the Deviations;
      the plans drawn now hold such a section, and headings that only mention software or
      open with one of its words and head something else, which are read as before
  - reading: pdf shown
    why: >-
      a new reading of how a fetched PDF's first page shows it is the cited work: a
      journal's label "Supplement Article" over the title, as Clin Infect Dis and J Infect
      Dis set it, is the work's, where the base refused it as a supplement's head; a head's
      words are read however far apart pdftotext sets them, and "Author's reply" with a
      typeset apostrophe is a reply's head; the inputs draw every label and every head
      (Known gaps F01)
  - reading: plan declarations
    why: >-
      a control held to its expected value, by `holds-expected` or `within`, names the null
      its interval is to leave out where it expects an effect, `null: 0` or `null: 1`, and is
      refused without one or with another value; a `holds-null` control that gives one is
      refused; the reading reports each control's null, and the inputs draw each of these
      (Basile, 2026-11-09, round 1 of wave 3's PR 3)
  - reading: vague attribution
    why: >-
      a claim in a Markdown text, as a paper `audit` converts is read, is supported by a
      citation typed as text, a bracketed run of numbers or one by author and year in
      brackets, an organisation's among them, where only pandoc's were taken; brackets that
      cite nothing, a year, a date, a count, a P value or an interval after its value, are
      none (corpus round, 2026-11-10: 14 of 16 vague attributions judged on 52 preprints
      were false); a new reading, whose inputs hold each kind
  - reading: latex mask
    why: >-
      a known command the preamble defines again, `\renewcommand{\emph}`, and a preamble's
      `\expandafter` that only redefines, `\expandafter\def\expandafter\normalsize`, were
      refused and the rest of the file read as typed; each is read now, and a use of the
      command refused where it prints; past any refusal the rest of the file is blanked, not
      read as typed; the inputs now hold such a preamble (Basile, 2026-11-11, "Read more,
      and be honest", after 3 of 20 LaTeX preprints of the corpus run)
  - reading: latex sections
    why: >-
      a known command the preamble defines again, `\renewcommand{\emph}`, and a preamble's
      `\expandafter` that only redefines, `\expandafter\def\expandafter\normalsize`, were
      refused and the rest of the file read as typed; each is read now, and a use of the
      command refused where it prints; past any refusal the rest of the file is blanked, not
      read as typed; the inputs now hold such a preamble (Basile, 2026-11-11, "Read more,
      and be honest", after 3 of 20 LaTeX preprints of the corpus run)
  - reading: latex citations
    why: >-
      a known command the preamble defines again, `\renewcommand{\emph}`, and a preamble's
      `\expandafter` that only redefines, `\expandafter\def\expandafter\normalsize`, were
      refused and the rest of the file read as typed; each is read now, and a use of the
      command refused where it prints; past any refusal the rest of the file is blanked, not
      read as typed; the inputs now hold such a preamble (Basile, 2026-11-11, "Read more,
      and be honest", after 3 of 20 LaTeX preprints of the corpus run)
  - reading: latex places
    why: >-
      optidef's problems, `mini!`, `maxi` and the rest, are maths (decision 13), so the lines
      of a problem's arguments and constraints are no longer lines of prose; the LaTeX inputs
      now hold a `mini!` and a `maxi` (round 1 of #673, finding 5)
  - reading: latex displays cited
    why: >-
      a known command the preamble defines again, `\renewcommand{\emph}`, and a preamble's
      `\expandafter` that only redefines, `\expandafter\def\expandafter\normalsize`, were
      refused and the rest of the file read as typed; each is read now, and a use of the
      command refused where it prints; past any refusal the rest of the file is blanked, not
      read as typed; the inputs now hold such a preamble (Basile, 2026-11-11, "Read more,
      and be honest", after 3 of 20 LaTeX preprints of the corpus run)
  - reading: latex pointers
    why: >-
      a construct left open, `{` or `$` among the inputs, is refused where it opens, at the
      end of the run, and nothing the reader found past it is kept now, a cross-reference or
      a listing among it, where it was kept though the text past it was not read (round 1
      of #637, finding 4)
  - reading: latex listed
    why: >-
      a construct left open, `{` or `$` among the inputs, is refused where it opens, at the
      end of the run, and nothing the reader found past it is kept now, a cross-reference or
      a listing among it, where it was kept though the text past it was not read (round 1
      of #637, finding 4)
