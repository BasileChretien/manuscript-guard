rationale: 'A revision round for the positive control. Round 12 found that its interval held
  the null, so it would have passed an analysis that finds nothing. The controls now take
  the third comparator and hepatic injury, ask the interval of each control that expects an
  effect to leave the null out, and stand in a supplementary file of their own, S2, where
  the main text had them. The same remit reads the change.'
