<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120" role="img" aria-labelledby="title">
  <title id="title">Data leakage, test data seeping into training: a shadow that no gate sees</title>
  <defs>
    <symbol id="data-leakage" viewBox="0 0 120 120">
      <g fill="#9481a7" fill-opacity=".3" stroke="#9481a7" stroke-width="2.5" stroke-dasharray="5 4">
        <rect x="8" y="64" width="46" height="40" rx="6" />
        <rect x="66" y="16" width="46" height="40" rx="6" />
      </g>
      <g font-family="JetBrains Mono, ui-monospace, Consolas, monospace" font-size="10" font-weight="700" fill="#1d2840" text-anchor="middle" opacity=".8">
        <text x="31" y="88">train</text>
        <text x="89" y="40">test</text>
      </g>
      <path d="M74 56 C70 66 62 66 58 72" fill="none" stroke="#9481a7" stroke-width="3" stroke-linecap="round" />
      <path d="M56 64 C56 64 51 71 51 74 A5 5 0 0 0 61 74 C61 71 56 64 56 64 Z" fill="#9481a7" />
    </symbol>
  </defs>
  <use href="#data-leakage" width="120" height="120"/>
</svg>
