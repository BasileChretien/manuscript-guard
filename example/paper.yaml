schema: manuscript-guard/paper/1
title: "Reporting of hepatic injury with example-drug: a disproportionality analysis of a synthetic spontaneous reporting database"
short_title: "Hepatic injury with example-drug"
# The data are simulated: G1 says so of every result quoted, and the title page says it.
demonstration: true
english_variant: en-GB

keywords:
  - pharmacovigilance
  - disproportionality
  - hepatotoxicity

# Both of these are invented and live in this project's own profiles/ directory. No real
# journal profile or reporting checklist ships with manuscript-guard: guidelines change
# without announcement, and item text written from memory would be exactly the kind of
# approximately-correct content this toolkit exists to prevent. Real ones are retrieved by
# the journal-profile and reporting-checklist skills, stamped with their source and the
# date they were read.
target_journal: demo-journal

reporting_guideline:
  - DEMO-OBS

# What `manuscript-guard package` deposits besides the code and the results: the licence it
# is under (the licence file is the repository's), and the inputs it may carry. The
# simulated reports are declared synthetic and go without being listed; the list of event
# terms is the author's to share, and is listed.
package:
  licence: MIT
  share:
    - data/event_terms.txt

conventions:
  - pattern: '(?i)\bhalf[- ]normal\b'
    why: Phrase contains no digits; present only to show the extension point.
    added_on: 2026-08-03

terms:
  - example-drug-2

# Abbreviations this paper leaves undefined on purpose. Each `CI` here follows the level it
# belongs to ("95% CI"), which this paper takes its readers to know. Anything else G14 finds
# used and not defined is reported as a warning.
language:
  known_abbreviations:
    - "CI"

  # The terms this paper keeps to. One word for one thing: a reader who meets "liver
  # injury" after three pages of "hepatic injury" has to wonder whether it is a second
  # outcome. G14 reports a term given up that the manuscript still uses, at its first
  # use, with how many times it is used.
  vocabulary:
    - use: "hepatic injury"
      avoid: ["liver injury", "liver damage"]
      why: The event term the data generator uses, and so the one the Methods define.
