summary: The Methods now describe three controls, each put through the 2 x 2 table and Wald
  interval that give the reporting odds ratio, by the same script, and the Results report
  each with its interval. The simulated one recovers the ratio planted, the negative one holds
  the null, and the positive one lies close to the small deficit the generator implies. The
  paper says that the controls were chosen after the first results, and the plan records how.
  Nothing from the earlier rounds is reopened.
findings:
- id: r12-pe-01
  severity: comment
  where: Results, the controls
  finding: The positive control's interval includes the null, so it shows that the estimate
    lies near the small deficit the generator's rates give, not that the analysis can detect
    an association. That is what its rule asks, and the plan says so. A real study's positive
    control would be a known adverse reaction of a drug in the database, with a ratio large
    enough that missing it would say something about the analysis.
- id: r12-pe-02
  severity: comment
  where: Methods, the controls
  finding: The controls were chosen after the first results, which the Methods and the plan
    both say, with the rule by which they were chosen. That makes them weaker evidence than
    controls fixed beforehand, and a reader can weigh it; nothing more is needed here.
