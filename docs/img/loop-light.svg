<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>From the analysis to the document: results, manuscript, check, build</title>
  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#59636e"/>
    </marker>
  </defs>
  <rect x="20" y="60" width="150" height="62" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="95.0" y="87" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">Analysis</text>
  <text x="95.0" y="106" text-anchor="middle" font-size="12" fill="#59636e">Python or R</text>
