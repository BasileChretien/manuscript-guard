schema: manuscript-guard/claim-strength/1

# The words that say how strongly a sentence claims what it claims. `manuscript-guard
# reworded` compares each sentence an edit changed with what it was, and warns where one of
# these came or went, or a word of the ladder was made a word of another rung.
#
# Adapted from the Claim-Strength Contract of Yila-AI/awesome-research-skills,
# skills/science-research-writing/references/certainty-and-claim-strength.md, read
# 2026-10-20 at commit 0609e85b6dbfdae8a48ba66c332d340265d7b3e5, Apache License 2.0
# (https://github.com/Yila-AI/awesome-research-skills); the License's text is beside this
# file, in claim_strength_LICENSE.txt. Its ladder is the six rungs below,
# in its order, and its certainty markers are among the hedges, the negations and the
# limits. The synonyms and the inflections are this project's, chosen on 2026-10-20;
# ATTRIBUTION.md says what was changed.
#
# How a word is read:
# - Each is a whole word, or whole words with any space or line break between them.
# - Each is written in lower case and read so, and with a capital where it opens a
#   sentence. A capital elsewhere marks a name: "in May 2020". In `lower_case_only`, never
#   with a capital.
# - Only the forms listed: "suggests" is read because it is here, and "suggestion" is not.
#   "*n't" is any word that ends so: "didn't", "wasn't".
# - A word joined by a hyphen to the one before or after is part of a compound and is not
#   read: "drug-induced", "all-cause", "cause-specific".
# - A form ending in "ed" after "a", "an" or "the" is an adjective and is not read: "an
#   increased risk", "the associated factors".
#
# English only, as every gate.

# From the weakest claim to the strongest. Moving a word within a rung, "associated" made
# "linked to", leaves the claim as strong as it was.
ladder:
  - rung: consistency
    words: [consistent with, suggest, suggests, suggested, suggesting, suggestive of]
  - rung: association
    words: [associated, association, associations, correlated, correlation, related to,
            linked to]
  - rung: prediction
    words: [predict, predicts, predicted, predicting, predictive of, predictor, predictors]
  - rung: contribution
    words: [contribute to, contributes to, contributed to, contributing to]
  - rung: effect
    words: [affect, affects, affected, affecting, lead to, leads to, led to, resulted in,
            increase, increases, increased, decrease, decreases, decreased, reduce, reduces,
            reduced, improve, improves, improved, worsen, worsens, worsened, induce, induces,
            induced, prevent, prevents, prevented]
  - rung: causation
    words: [cause, causes, caused, causing, causal, causally, demonstrate that,
            demonstrates that, demonstrated that, prove that, proves that, proved that]

# A word that says the claim may not hold. One gone makes the claim stronger.
hedges: [may, might, could, possibly, perhaps, potentially, probably, appear, appears,
         appeared, seem, seems, seemed]

# A word that turns the claim round. One gone or new says the opposite of what was said.
negations: ["not", "*n't", cannot, "no", never, neither, nor, none, non-significant,
            nonsignificant]

# A word that bounds the claim. One gone makes it hold more widely than it did.
limits: [only, in this sample, within this sample, under these conditions]

# What a sentence that reports an estimate with its confidence interval says of it. G8 holds
# these words to the interval (`stats/interval_words.py`). These lists are this project's,
# chosen on 2026-11-07, and not the contract's; they are read as the words above are, with
# two more rules:
# - "{be}" stands for a word of `be`, and "{have}" for a word of `have`, each followed by
#   at most two words: "{be} associated" is read in "was independently associated".
# - A word of `effect` that ends in "ed" is not read directly after a word of `describing`,
#   where it describes rather than states: "with reduced renal function".
interval:
  be: [is, are, was, were, be, been, being, remained, remains]
  have: [has, have, had, having, show, shows, showed, found, observed, experienced, carried,
         conferred, confers]
  describing: [a, an, the, its, their, this, these, those, any, some, each, with, without,
               of, in, for, and, or, by, at, to, from, "on", than, among]
  # A word that states an effect or a difference. No noun but "increase" and "decrease",
  # which are verbs too: "a dose reduction", "causal inference", "age as a predictor" name
  # what was done (round 1 of #572).
  effect: [increase, increases, increased, decrease, decreases, decreased, reduce, reduces,
           reduced, raises, raised, lowers, lowered, improve, improves, improved, worsen,
           worsens, worsened, affect, affects, affected, prevent, prevents, prevented,
           induces, induced, caused, causally, lead to, leads to, led to, resulted in,
           results in, contribute to, contributes to, contributed to, predicts, predicted,
           predictive of, differ, differs, differed, "{be} predictor", "{be} predictors",
           "{be} associated", "{be} correlated", "{be} linked", "{be} related",
           "{be} higher", "{be} lower", "{be} greater", "{be} smaller", "{be} larger",
           "{be} more likely", "{be} less likely", "{be} elevated", "{be} worse",
           "{be} better", "{have} higher", "{have} lower", "{have} greater",
           "{have} increased", "{have} decreased", "{have} reduced", "{have} elevated",
           "{have} excess", "{have} more", "{have} fewer"]
  # A word that says the estimate is statistically significant.
  significant: [significantly, statistically significant, reached significance,
                reached statistical significance, achieved significance,
                achieved statistical significance, "{be} significant"]
  # "significant" is read too directly before one of these, or one word before it: "a
  # significant increase", "a significant positive association".
  significant_of: [association, associations, difference, differences, effect, effects,
                   increase, increases, decrease, decreases, reduction, reductions, rise,
                   decline, excess, improvement, benefit, harm, risk, risks, relationship,
                   correlation, predictor, predictors]
  # A word directly before "significant" or "significantly" that says it is not the test's.
  not_the_test: [clinically]
  # A word that says there is no effect or no difference.
  no_effect: [no difference, no differences, no effect, no effects, no association,
              no associations, no relationship, no link, no change, no impact,
              no influence, no increase, no decrease, no reduction, no excess, no benefit,
              no harm, "{be} similar", "{have} similar", "{be} comparable",
              "{be} unchanged", "{be} unaffected", "{be} unrelated"]
  # A word that says the estimate is uncertain, or speaks of the test or of the evidence
  # rather than of the effect. One stands the sentence down.
  uncertain: [non-significant, nonsignificant, non-significantly, nonsignificantly,
              insignificant, trend, trends, tendency, tended, imprecise, imprecisely,
              imprecision, uncertain, uncertainty, inconclusive, wide, no evidence,
              little evidence, insufficient evidence, limited evidence, weak evidence,
              underpowered, low power, limited power, lack of power, marginally, borderline,
              nearly, almost, approached, approaching, rule out, ruled out, be excluded,
              "null", compatible with, point estimate, point estimates, numerically, nominally,
              possible, potential, crossed 1, crossed one, included 1, included one,
              includes 1, including 1]

lower_case_only: [may]
