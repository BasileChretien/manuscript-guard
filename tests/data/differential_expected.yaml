# The readings a pull request means to change.
#
# tests/test_differential.py puts generated inputs through the base branch's source and
# through the working tree's, reading by reading (tests/readings.py), and fails on any
# difference. A pull request that changes what a gate reports is meant to differ, and says
# so here:
#
#   expected:
#     - reading: vocabulary
#       why: >-
#         a `>` line under the rule of a simple table is a row of it again, so the terms
#         in it are counted
#
# An entry excuses one reading, in the pull request that adds the entry and in no other:
# once it is merged the base holds it too, and it is spent. The reading then passes and
# lists what differs, for whoever reviews the change to read against the `why`. Every other
# reading still fails on a difference, which is how "nothing else changed" is held.
#
# An entry is also how a pull request says it changed what a reading goes through, a
# helper that takes another argument now, so that the base's source cannot be asked for
# that reading at all. Without the entry that fails: nothing was compared.
#
# An entry for a reading that does not differ fails, and so does one that names no reading.
# Spent entries may stay as a record or go; the list is not read for them.

expected:
  - reading: mask
    why: >-
      a link's target that is an address is masked after its `(` up to its own `)`, and the
      stop after it and what follows on its line are left; the address was taken to the next
      space, the link's `)` and stop with it, and the target then ran on to the next `)` on
      the line; the inputs now hold a link of each kind of target
  - reading: numbers
    why: >-
      a number after a link on its line, "[the code](https://...). Data (n = 1213)", is read
      and judged, where the link's target hid it up to the next `)`; the inputs now hold a
      link of each kind of target
  - reading: notation
    why: >-
      an interval after a link on its line, "[text](https://...) (CI 95% 0.3 to 0.4)", is
      read, where the link's target hid it up to the next `)`
  - reading: reply numbers
    why: >-
      a number in a reply after a link on its line is read and, unbound, reported, where the
      link's target hid it up to the next `)`
  - reading: reworded
    why: >-
      a number after a link on its line is counted among a sentence's numbers, where the
      link's target hid it up to the next `)`
  - reading: placeholders
    why: >-
      a journal template's instruction to its authors, "In this section you can acknowledge
      any support given ...", "This section may be divided by subheadings", Word's "Click or
      tap here to enter text.", is found as a placeholder, `placeholder-template`; the inputs
      now hold such instructions, and a section the authors describe, a form a paper
      reproduces and PLOS's "Click here for additional data file", which it is not
  - reading: import
    why: >-
      under "would merge into" and "NOT merged into" the import prints each changed
      stretch, as it was (`-`) and as it is (`+`), with a few words either side, where it
      printed the paragraph's first 150 characters
  - reading: word merged
    why: >-
      a sign or comparison set before a value in Word with a space between, "– 3.84", and a
      unit or percent sign added after one, changed or taken out, is refused, naming the
      value (KG454); and a rewording that leaves the source's `<` and `>` a tag to pandoc
      once the values are in, as deleting "(see Table 2)" from `<LLOQ in {{results.unit}}
      (see Table 2) at {{results.site}} and >ULOQ` did, is refused as one (KG410.3); the
      inputs now hold such edits, which the base merged
  - reading: interval order
    why: >-
      the sentences an interval's bounds are compared in are read with each HTML comment
      blanked, as the bindings are: a stop inside a comment ends no sentence, so a reversal
      with such a comment between its bounds is reported, and a stop with a comment typed
      against it ends one, so the bounds on either side of it are no longer compared
  - reading: check
    why: >-
      G12 holds the plan's Software section to the packages the scripts of analysis/ and
      figures/ load and counts both (`software_planned`, `software_loaded`): a package an
      item names that no script loads is `planned-package-unloaded`, a warning from the
      analysis stage on, and one a script loads that no item names is
      `plan-package-unnamed`, a note (#592)
  - reading: data dates
    why: >-
      the finding says the date was emitted as a string rather than typed, and its hint adds
      that a year computed from the data is emitted as a number, which is not warned of;
      what is warned of is unchanged
  - reading: reported tests
    why: >-
      a P above 1, "P = 4.1 x 10^5", is not judged; a number with a middle dot or a comma
      for its point is not read, nor a P cut off before one; and Dunnett's and
      Games-Howell's procedures stand a test down as the other named adjustments do
  - reading: summaries
    why: >-
      where a paper has no Results heading, a key bound under a heading that names no part
      of it is read as reported, `Walk.reported_without_results`, which the base does not
      have; the reading reports those keys, and its inputs now hold papers with no Results
  - reading: word blocks
    why: >-
      a figure whose paragraph carries an identifier Word left there, from a paragraph cut
      above it with Track Changes off, is read as the figure, by its picture, with the
      identifier before it as a block of no text; it was read as an empty paragraph
      carrying that identifier, and import reported the figure missing
  - reading: pointers
    why: >-
      G2 holds a caption beside a table or a figure to that display, so a typed caption or a
      ref opening one that names another display is caption-names-another; the inputs now
      place captions, and two tables one after the other with a caption between them
  - reading: latex printed
    why: >-
      a `\def` with delimited parameters, `\def\x\begin{verbatim}` among the inputs, was
      refused and the rest of the file read as typed; it is read now, as TeX reads it,
      its parameter text blanked and its body read, and a use refused only where it
      prints; a `\let` of a command to one the reader reads the same way and a doubled
      parameter in a nested body are no longer refused either (real templates, part 1)
  - reading: prose quotations
    why: >-
      a sentence that opens with a typographic quotation mark is a sentence of its own, as
      one that opens with a straight one is, so its quotation is held to its own citation
      and not to the one of the sentence before (step 8, G7)
  - reading: quote words
    why: >-
      a run of Han, Hiragana or Katakana in a ledger quote is a word for every two letters
      in a row, one of Thai, Lao, Khmer or Myanmar for every four, rounded down, and a Latin
      word glued to such a run is a word of its own, where the whole run between spaces was
      one word; the inputs now hold Japanese, Chinese and Thai pieces (G7, quote-too-short)
  - reading: latex bindings
    why: >-
      a `\def` with delimited parameters, `\def\x\begin{verbatim}` among the inputs, was
      refused and the rest of the file read as typed; it is read now, as TeX reads it,
      its parameter text blanked and its body read, and a use refused only where it
      prints; a `\let` of a command to one the reader reads the same way and a doubled
      parameter in a nested body are no longer refused either (real templates, part 1)
  - reading: latex places
    why: >-
      a `\def` with delimited parameters, `\def\x\begin{verbatim}` among the inputs, was
      refused and the rest of the file read as typed; it is read now, as TeX reads it,
