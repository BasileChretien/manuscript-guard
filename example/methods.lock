- step: adjusted
  claim: 'Adjusted for age group and sex, the two patient characteristics the database records for every report, the reporting odds ratio was also estimated by {{results.model.adjusted.kind}} of hepatic injury on exposure to example-drug, with both characteristics entered as categories. The reporting year, which every report also carries, was not adjusted for: calendar time is a common adjustment in disproportionality analyses, but the data generator draws the year independently of the drug, so here it cannot confound the estimate. Its interval is the model''s Wald interval for the exposure coefficient, at the same alpha. Table S2 describes the model as it was fitted.'
  code: ffe9e3b0807b5cd1744bf856bd5ad0b90a3081b0f3f2bc256583f4b4c43aa2cf
  read_on: '2026-11-09'
- step: ci
  claim: The reporting odds ratio was computed from a 2 x 2 table contrasting reports of hepatic injury with all other reported events, for example-drug against all other drugs in the database. Confidence intervals were derived from the standard error of the log odds ratio and are 95% confidence intervals, two-sided at an alpha of {{results.param.alpha}}; the main estimate is also given with its 90% confidence interval, for comparison with signal-detection practice.
  code: 033eedd89290d338f32843149b2b081eee92db0cc0183f35529b35173648039d
  read_on: '2026-11-09'
- step: controls
  claim: Three controls were put through the same 2 x 2 table and interval, by the same script; they were chosen after the first results were known, as the analysis plan records. A simulated control drew reports as the database's are drawn, with hepatic injury planted for example-drug at twice the odds of the other drugs, and its interval was to hold the ratio planted. A positive control took example-drug and nausea, which the data generator makes rarer with the drug than with the others because hepatic injury takes its share; its estimate was to lie within a quarter of the ratio those rates give. A negative control took the first comparator and nausea, for which those rates give a ratio close to one, and its interval was to hold the null.
