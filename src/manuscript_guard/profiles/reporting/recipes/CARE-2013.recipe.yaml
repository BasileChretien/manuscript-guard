# CARE 2013, for case reports, read from Table 1 of its statement paper as Europe PMC serves
# the full text. The table gives the thirteen items one to a row, each with its name and
# number. The checklist on the CARE site (care-statement.org/checklist, read on 2026-11-27 for
# the case-report design) numbers the same thirteen items but splits several into lettered
# sub-items, with other words: its item 5 asks for de-identified information, which this
# table's item 5 does not. The profile is the table as published in 2013.
#
# The licence is the paper's in its Europe PMC full text, which names it in words and gives no
# address; licence_url is Creative Commons' address for the licence it names. Crossref records
# only the publisher's text-and-data-mining terms. The CARE site's checklist page shows a
# CC BY-NC badge, and its copyright page reserves all rights. Non-commercial and no
# derivatives: download it and use it, and do not share the profile made from it.

