name: Publish to PyPI

# A release on PyPI is permanent: a version can be withdrawn, and never replaced or used
# again. So nothing is uploaded on a push or a merge. Publishing a GitHub Release is the one
# act that does it, and CONTRIBUTING.md says how a release is made.
on:
  release:
    types: [published]

permissions: {}

jobs:
  build:
    name: Build the distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          # The whole history, so that the tag can be placed on main below.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: The tag names the version the package carries
        # The tag is what a reader of PyPI follows back to the source, and the README that
        # PyPI shows links to files at that tag. One that says another number than
        # pyproject.toml would publish a release nobody can trace.
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::the release is tagged $TAG and pyproject.toml says $version: tag it v$version"
            exit 1
          fi
      - name: The tagged commit is on main
        # Only main has been through review and the whole of CI. A tag on a branch would
        # publish what neither has seen.
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main: tag a commit of main"
            exit 1
          fi
      - name: Build a wheel and a source distribution
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
      - name: The description PyPI will show is one it can render
        run: twine check --strict dist/*
      - uses: actions/upload-artifact@v5
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # PyPI trusts this workflow file, in this repository, in this environment, and nothing
    # else, so the upload carries no password and no token. The pairing is set on PyPI, in
    # the project's publishing settings, and names this file: renaming it breaks the upload.
    environment:
      name: pypi
      url: https://pypi.org/project/manuscript-guard/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
