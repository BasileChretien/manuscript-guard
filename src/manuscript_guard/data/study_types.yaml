schema: manuscript-guard/study-types/1

# What an analysis plan states: the seven sections G12 asks of every plan (`every_plan`:
# question, design, population, exposure, outcome, analysis, deviations), and for each study
# design the sections it states beyond them and the reporting guidelines the paper follows. A
# project names its design in paper.yaml (`study_type`); a project that names none is asked
# for the seven only. `check`, `next` and every other reader take the sections from here
# (DESIGN.md, "One set of plan questions, answered before the data or quoted from a draft").
#
# Each section is a heading the plan holds and something said under it:
#   id        what G12 calls it;
#   heading   the words an author's heading is matched by, loosely, since headings are theirs;
#   says      what it has to say, for the finding's hint;
#   ask       the same as a question, in words an author new to plans can answer;
#   explain   why a reader needs the answer, in a sentence or two;
#   source    the guideline item it comes from, read on its own page on the date in read_on.
# `ask` and `explain` are the project's own words: a guideline whose page says no licence is
# cited by its item, never quoted. The seven have no source of their own.
#
# Each design has its `label`, and `describes`: what makes a study that design, said beside
# it where `next` asks which design the study is. `guidelines` are the paper's: G5 says where
# paper.yaml declares none of them for the design it names. The protocol's own guideline,
# where there is one, is under `protocol`. A design that has no use for a section of the
# seven names it under `not_asked`, with why, and its plan is not asked for it: a case
# report has no analysis to plan and no plan to depart from (Basile, 2026-11-27).
#
# paper.yaml takes one more value, `other` (gates/design.py, OTHER), for a study none of
# these is: its plan is asked for the seven sections and its paper for no guideline. A
# design is added here only with sections that each cite their guideline item.

every_plan:
  - id: question
    heading: '(?i)\b(research )?question|objective'
    says: what is being asked
    ask: >-
      What question will the study answer?
    explain: >-
      Every other part of the plan follows from the question. Written down first, it keeps the
      analysis from drifting towards whatever the data happen to show.
  - id: design
    heading: '(?i)\bdesign\b'
    says: the study design and why it suits the question
    ask: >-
      What kind of study is it, and why does that kind suit the question?
    explain: >-
      The design decides what the study can conclude. Many designs can show that two things go
      together; few can show that one causes the other.
  # CARE's "Patient information", a case report's, as a whole heading: not "Patient consent".
  - id: population
    heading: '(?i)\bpopulation|participants|data source\b|^\W*(?:(?:\d+(?:\.\d+)*|[A-Za-z]|[IVXivx]+)[.)]\s*|\d+(?:\.\d+)*\s+)?(?:the\s+)?patients?(?:\s+information)?(?:\(s\))?(?:\s*\([^()]*\))?\W*$'
    says: who or what is included
    ask: >-
      Who or what will be studied, and where will the data come from?
    explain: >-
      A reader needs to know whom the results apply to, and who was left out and why.
  - id: exposure
    heading: '(?i)\bexposure|intervention|predictor\b|^\W*(?:(?:\d+(?:\.\d+)*|[A-Za-z]|[IVXivx]+)[.)]\s*|\d+(?:\.\d+)*\s+)?(?:the\s+)?index tests?(?:\(s\))?(?:\s*\([^()]*\))?\W*$'
    says: what is being compared
    ask: >-
      What is being compared: which treatment, exposure or predictor, and against what?
    explain: >-
      A comparison means something only when both of its sides are named: a treatment against
      no treatment, or against another one.
  - id: outcome
    heading: '(?i)\boutcome|endpoint\b|^\W*(?:(?:\d+(?:\.\d+)*|[A-Za-z]|[IVXivx]+)[.)]\s*|\d+(?:\.\d+)*\s+)?(?:the\s+)?target conditions?(?:\(s\))?(?:\s*\([^()]*\))?\W*$'
    says: what is being measured
    ask: >-
      What will be measured to answer the question, and which outcome is the main one?
    explain: >-
      Naming one main outcome before the analysis stops the result that looks best from being
      reported as though it had been the aim.
  - id: analysis
    heading: '(?i)\banalysis|statistical\b'
    says: the estimator and the model
    ask: >-
      How will the data be analysed: which method, and which model?
    explain: >-
      Choosing the method before seeing the results is what lets a P value or an interval mean
      what it says.
  # Not "Standard deviation of the dose", which is a statistic, not a change to the plan.
  - id: deviations
    heading: '(?i)(?<!standard\s)\bdeviation|changes? (from|to) the plan|amendments?\b'
    says: what changed after the plan was agreed, or that nothing did
    ask: >-
      What changed from the plan once the work began, and why?
    explain: >-
      Most studies depart from their plan somewhere. A change written down is a decision a
      reader can judge; one left out cannot be told apart from trying several analyses and
      keeping the best.

types:
  trial:
    label: randomised trial
    describes: >-
      the investigators assign each participant to a group by chance
    guidelines: [CONSORT]
    protocol: [SPIRIT]
    sections:
      - id: estimand
        heading: '(?i)\bestimands?\b'
        says: >-
          the estimand: the treatment, the population, the variable, how each intercurrent
          event is handled, and the population-level summary
        ask: >-
          What exactly is the effect the trial will estimate: in whom, on what measure, and
          what happens to people who stop or switch treatment?
        explain: >-
          Two analyses of the same trial can estimate different effects. Saying which one is
          wanted, and how events such as stopping treatment count, settles it before the
          results are known.
        source: ICH E9(R1), sections A.3.2 and A.3.3
        url: https://database.ich.org/sites/default/files/E9-R1_Step4_Guideline_2019_1203.pdf
        read_on: 2026-10-15
      - id: sample size
        heading: '(?i)\bsample size|\bpower\b'
        says: how the sample size was determined, with every assumption it rests on
        ask: >-
          How many participants are needed, and on what assumptions?
        explain: >-
          Too few participants can miss a real effect. The calculation and the numbers it
          assumes let a reader judge whether the trial could have found what it looked for.
        source: SPIRIT 2025, item 19
        url: https://www.consort-spirit.org/
        read_on: 2026-10-15
      - id: randomisation
        heading: '(?i)\brandomi[sz]|\ballocation|\bblind|\bmask'
        says: >-
          how the sequence is generated and concealed, who is blinded, and when unblinding
          is allowed
        ask: >-
          How will participants be put into the groups, how will the next allocation be kept
          hidden, and who will not know which group a participant is in?
        explain: >-
          An allocation nobody can foresee keeps the groups alike, and blinding where it is
          possible keeps the measurements alike.
        source: SPIRIT 2025, items 21a to 24c
        url: https://www.consort-spirit.org/
        read_on: 2026-10-15
      - id: missing data
        heading: '(?i)\bmissing'
        says: how missing data will be handled in the analysis
        ask: >-
          What will you do about participants with missing values, or who leave the trial?
        explain: >-
          Leaving out everyone with a missing value can bias the result when those people
          differ from the rest, so how they are handled is decided before the result is known.
        source: SPIRIT 2025, item 27c
        url: https://www.consort-spirit.org/
        read_on: 2026-10-15
      - id: sensitivity analyses
        heading: '(?i)\bsensitivity|\bsubgroup'
        says: the sensitivity and subgroup analyses, and which assumption each tests
        ask: >-
          Which other analyses will check that the result holds, and which subgroups will you
          look at?
        explain: >-
          A result that holds under other reasonable assumptions is more credible. Subgroups
          chosen in advance are fewer, and less likely to turn up a chance finding.
        source: SPIRIT 2025, item 27d; ICH E9(R1), section A.5.2.1
        url: https://www.consort-spirit.org/
        read_on: 2026-10-15
      - id: interim analyses
        heading: '(?i)\binterim|\bstopping|\bmonitoring\b|\bdata monitoring'
        says: any interim analysis and stopping rule, who sees the results and who decides
        ask: >-
          Will anyone look at the results before the trial ends, and what would make it stop
          early?
        explain: >-
          Looking at the results early, without a rule written beforehand, can stop a trial at
          a chance high or low.
        source: SPIRIT 2025, items 28a and 28b
        url: https://www.consort-spirit.org/
        read_on: 2026-10-15

  cohort:
    label: cohort study
    describes: >-
      people are grouped by an exposure and followed over time to see who has the outcome
    guidelines: [STROBE, RECORD, TARGET]
    sections:
      - id: time zero and follow-up
        heading: '(?i)\btime zero|\bindex date|\bfollow[- ]?up|\bat[- ]risk|\bcensor'
        says: >-
          when follow-up starts (time zero, the date of assignment where a target trial is
          emulated), the at-risk window, and how loss to follow-up is handled
        ask: >-
          When does each person's follow-up start, how long does it last, and what happens to
          people who are lost to follow-up?
        explain: >-
          Follow-up started at the wrong moment builds a bias into the comparison before any
          analysis is run, such as time in which the exposed could not have had the outcome.
        source: STROBE, items 6a and 12d (cohort); TARGET, item 7d
        url: https://www.strobe-statement.org/download/strobe-checklist-cohort-studies-pdf
        read_on: 2026-10-15
      - id: confounding
        heading: '(?i)\bconfound|\badjust'
        says: >-
          the confounders and effect modifiers, the adjustment set with the reason for each,
          and how confounding is controlled
        ask: >-
          Which other factors could explain a link between the exposure and the outcome, and
          how will you take each into account?
        explain: >-
          Without random allocation the groups differ in more than the exposure. Which factors
          are adjusted for, and why each, decides what the result can be taken to mean.
        source: STROBE, items 7 and 12a
        url: https://www.strobe-statement.org/download/strobe-checklist-cohort-studies-pdf
        read_on: 2026-10-15
      - id: missing data
        heading: '(?i)\bmissing'
        says: how missing data will be handled
        ask: >-
          What will you do about people with missing values?
        explain: >-
          Leaving out everyone with a missing value can bias the result when those people
          differ from the rest, so how they are handled is decided before the result is known.
        source: STROBE, item 12c
        url: https://www.strobe-statement.org/download/strobe-checklist-cohort-studies-pdf
        read_on: 2026-10-15
      - id: sensitivity analyses
        heading: '(?i)\bsensitivity|\bsubgroup'
        says: the subgroup, interaction and sensitivity analyses
        ask: >-
          Which other analyses will check that the result holds, and which subgroups will you
          compare?
        explain: >-
          Planned in advance, they show how much the result depends on the choices made; added
          afterwards, they read as a search for a better result.
        source: STROBE, items 12b and 12e
        url: https://www.strobe-statement.org/download/strobe-checklist-cohort-studies-pdf
        read_on: 2026-10-15

  case-control:
    label: case-control study
    describes: >-
      people with the outcome are compared with people without it, looking back at what each
      was exposed to
    guidelines: [STROBE, RECORD]
    sections:
      - id: cases
        # Not "case" in "Case-control", "Case–control" or "Case crossover", which name a
        # design: whatever joins the two words.
        heading: '(?i)\bcases?\b(?!\W{0,3}(?:controls?|crossover|cohort|series)\b)|\bascertain'
        says: the case definition, and the sources and methods of case ascertainment
        ask: >-
          Who counts as a case, and how will the cases be found?
        explain: >-
          A case definition applied the same way to everyone is what makes the cases
          comparable with each other.
        source: STROBE, item 6a (case-control)
        url: https://www.strobe-statement.org/download/strobe-checklist-case-control-studies-pdf
        read_on: 2026-10-15
      - id: controls
        heading: '(?i)(?<!case\W)(?<!case\W\W)(?<!case\W\W\W)\bcontrols?\b'
        says: the sources and methods of control selection, and why these cases and controls
        ask: >-
          Who will the controls be, where will they come from, and why are they the right
          comparison for these cases?
        explain: >-
          Controls should come from the population the cases came from. Controls chosen
          otherwise can make a difference that the exposure did not cause.
        source: STROBE, item 6a (case-control)
        url: https://www.strobe-statement.org/download/strobe-checklist-case-control-studies-pdf
        read_on: 2026-10-15
      - id: matching
        heading: '(?i)\bmatch'
        says: >-
          the matching criteria and the number of controls per case, and how the analysis
          accounts for the matching, or that there is none
        ask: >-
          Will the controls be matched to the cases, on what, how many to each case, and how
          will the analysis take the matching into account? Or is there no matching?
        explain: >-
          Matching changes how the data must be analysed, and ignoring it in the analysis can
          bias the result.
        source: STROBE, items 6b and 12d (case-control)
        url: https://www.strobe-statement.org/download/strobe-checklist-case-control-studies-pdf
        read_on: 2026-10-15
      - id: confounding
        heading: '(?i)\bconfound|\badjust'
        says: the confounders, the adjustment set with the reason for each
        ask: >-
          Which other factors could explain a link between the exposure and being a case, and
          how will you take each into account?
        explain: >-
          Cases and controls differ in more than the exposure. Which factors are adjusted for,
          and why each, decides what the result can be taken to mean.
        source: STROBE, items 7 and 12a
        url: https://www.strobe-statement.org/download/strobe-checklist-case-control-studies-pdf
        read_on: 2026-10-15
      - id: missing data
        heading: '(?i)\bmissing'
        says: how missing data will be handled
        ask: >-
          What will you do about people with missing values?
        explain: >-
          Leaving out everyone with a missing value can bias the result when those people
          differ from the rest, so how they are handled is decided before the result is known.
        source: STROBE, item 12c
        url: https://www.strobe-statement.org/download/strobe-checklist-case-control-studies-pdf
        read_on: 2026-10-15

  cross-sectional:
    label: cross-sectional study
    describes: >-
      people are studied at one point in time, with the exposure and the outcome measured
      together
    guidelines: [STROBE, RECORD]
    sections:
      - id: sampling
        heading: '(?i)\bsampling\b(?!\s+bias)|\brecruit|\bselection of participants|\bparticipant selection|\bsurvey weight'
        says: >-
          how participants are sampled and recruited, and how the analysis takes the sampling
          into account (weights, clusters, strata)
        ask: >-
          How will participants be chosen and recruited, and will the analysis need to allow
          for how they were sampled (weights, clusters or strata)?
        explain: >-
          A sample stands for its population only as far as the way it was drawn allows. A
          survey that reached some groups more than others gives the wrong prevalence unless
          the analysis weights for it.
        source: STROBE, items 6a and 12d (cross-sectional)
        url: https://www.strobe-statement.org/download/strobe-checklist-cross-sectional-studies-pdf
        read_on: 2026-11-26
      - id: measurement
        heading: '(?i)\bmeasurements?\b(?!\s+bias)|\binstruments?\b|\bquestionnaires?\b|\bdata collection'
        says: >-
          how each variable is measured, with the instrument used, and whether it is measured
          the same way in every group
        ask: >-
          How will each variable be measured, with which questionnaire or instrument, and is
          it measured the same way in every group?
        explain: >-
          An instrument not shown to measure what it claims, or one used differently from
          group to group, can make a difference where there is none.
        source: STROBE, item 8 (cross-sectional)
        url: https://www.strobe-statement.org/download/strobe-checklist-cross-sectional-studies-pdf
        read_on: 2026-11-26
      - id: bias
        heading: '(?i)\bbias|\bnon-?response'
        says: >-
          the sources of bias expected, such as who declines to take part, and how each is
          addressed
        ask: >-
          Which sources of bias do you expect, such as people who decline to take part, and
          what will you do about each?
        explain: >-
          Who agrees to take part, and how people recall what they were exposed to, can shift
          the result. Naming each bias beforehand shows what was done about it.
        source: STROBE, item 9 (cross-sectional)
        url: https://www.strobe-statement.org/download/strobe-checklist-cross-sectional-studies-pdf
        read_on: 2026-11-26
      - id: sample size
        heading: '(?i)\bsample size|\bstudy size|\bpower\b'
        says: >-
          how the study size was arrived at, with every assumption it rests on
        ask: >-
          How many participants are needed, and how did you arrive at that number?
        explain: >-
          Too small a sample gives an estimate too imprecise to answer the question. The
          calculation and its assumptions let a reader judge whether the study could answer
          it.
        source: STROBE, item 10 (cross-sectional)
        url: https://www.strobe-statement.org/download/strobe-checklist-cross-sectional-studies-pdf
        read_on: 2026-11-26
      - id: confounding
        heading: '(?i)\bconfound|\badjust'
        says: >-
          the confounders and effect modifiers, the adjustment set with the reason for each,
          and how confounding is controlled
        ask: >-
          Which other factors could explain a link between the exposure and the outcome, and
          how will you take each into account?
        explain: >-
          People with and without the exposure differ in more than the exposure. Which factors
          are adjusted for, and why each, decides what the result can be taken to mean;
          measured at one time, the result cannot say which came first.
        source: STROBE, items 7 and 12a (cross-sectional)
        url: https://www.strobe-statement.org/download/strobe-checklist-cross-sectional-studies-pdf
        read_on: 2026-11-26
      - id: missing data
        heading: '(?i)\bmissing'
        says: >-
          how missing data will be handled
        ask: >-
          What will you do about people with missing values?
        explain: >-
          Leaving out everyone with a missing value can bias the result when those people
          differ from the rest, so how they are handled is decided before the result is known.
        source: STROBE, item 12c (cross-sectional)
        url: https://www.strobe-statement.org/download/strobe-checklist-cross-sectional-studies-pdf
        read_on: 2026-11-26
      - id: sensitivity analyses
        heading: '(?i)\bsensitivity|\bsubgroup'
        says: >-
          the subgroup, interaction and sensitivity analyses
        ask: >-
          Which other analyses will check that the result holds, and which subgroups will you
          compare?
        explain: >-
          Planned in advance, they show how much the result depends on the choices made; added
          afterwards, they read as a search for a better result.
        source: STROBE, items 12b and 12e (cross-sectional)
        url: https://www.strobe-statement.org/download/strobe-checklist-cross-sectional-studies-pdf
        read_on: 2026-11-26

  diagnostic-accuracy:
    label: diagnostic accuracy study
    describes: >-
      a test is compared with a reference standard in the same people, to see how often the
      test is right
    guidelines: [STARD]
    sections:
      - id: sampling
        heading: '(?i)\bsampling\b(?!\s+bias)|\brecruit|\bselection of participants|\bparticipant selection|\bconsecutive|\bconvenience (?:series|sample)'
        says: >-
          how and where potentially eligible participants are identified, and whether they
          form a consecutive, random or convenience series
        ask: >-
          How will participants be found, and will they be every eligible person in turn (a
          consecutive series), a random sample, or whoever was convenient?
        explain: >-
          A convenience sample can hold more clear-cut cases than practice does, and make the
          test look more accurate than it is.
        source: STARD 2015, items 7 to 9
        url: https://doi.org/10.1136/bmj.h5527
        read_on: 2026-11-26
      - id: reference standard
        heading: '(?i)\breference standard|\bgold standard|\breference test'
        says: >-
          the reference standard, in enough detail to repeat it, and why it was chosen
        ask: >-
          Which reference standard will decide who has the condition, and why that one?
        explain: >-
          Accuracy is measured against the reference standard, so one that misclassifies
          people makes the test's accuracy wrong in turn.
        source: STARD 2015, items 10b and 11
        url: https://doi.org/10.1136/bmj.h5527
        read_on: 2026-11-26
      - id: thresholds
        heading: '(?i)\bthresholds?\b|\bcut-?offs?\b|\bcut[- ]points?\b|\bpositivity\b'
        says: >-
          the positivity thresholds or result categories of the index test and of the
          reference standard, and which were set in advance
        ask: >-
          At what value or category will each test count as positive, and will you fix that
          before seeing the results?
        explain: >-
          A threshold chosen after the results, to give the best figures, makes the test look
          more accurate than it will be in use.
        source: STARD 2015, items 12a and 12b
        url: https://doi.org/10.1136/bmj.h5527
        read_on: 2026-11-26
      - id: blinding
        heading: '(?i)\bblind|\bmask'
        says: >-
          whether those who perform or read each test know the other test's result or the
          clinical information
        ask: >-
          Will the people reading each test know the other test's result, or the patient's
          clinical details?
        explain: >-
          Knowing the other result can sway how a test is read, and make the two agree more
          often than they would apart.
        source: STARD 2015, items 13a and 13b
        url: https://doi.org/10.1136/bmj.h5527
        read_on: 2026-11-26
      - id: indeterminate results
        heading: '(?i)\bindeterminate|\binconclusive|\bequivocal|\buninterpretable'
        says: >-
          how indeterminate or uninterpretable results of either test are handled
        ask: >-
          What will you do with results that cannot be read, or are neither positive nor
          negative?
        explain: >-
          Leaving out the results that could not be read usually makes a test look more
          accurate than it is in practice.
        source: STARD 2015, item 15
        url: https://doi.org/10.1136/bmj.h5527
        read_on: 2026-11-26
      - id: missing data
        heading: '(?i)\bmissing'
        says: >-
          how missing results of the index test and of the reference standard are handled
        ask: >-
          What will you do about people missing the result of either test?
        explain: >-
          People with no reference standard result are often unlike those with one, and
          leaving them out can bias the accuracy.
        source: STARD 2015, item 16
        url: https://doi.org/10.1136/bmj.h5527
        read_on: 2026-11-26
      - id: sample size
        heading: '(?i)\bsample size|\bstudy size|\bpower\b'
        says: >-
          the intended sample size and how it was determined
        ask: >-
          How many participants, and how many with the condition, are needed to estimate
          accuracy precisely enough, and how did you work that out?
        explain: >-
          Too few people with the condition gives a sensitivity too imprecise to be of use.
        source: STARD 2015, item 18
        url: https://doi.org/10.1136/bmj.h5527
        read_on: 2026-11-26

  case-report:
    label: case report
    describes: >-
      one patient is described in detail, because something in their illness, its diagnosis
      or its treatment is new or worth others knowing
    guidelines: [CARE]
    not_asked:
      analysis: >-
        a case report describes one patient and estimates nothing, so there is no method or
        model to choose before the data
      deviations: >-
        a case report is written after care that followed no protocol, so there is no plan
        agreed in advance to depart from
    sections:
      - id: de-identification
        heading: '(?i)\bde-?identif|\banonymi[sz]|\bidentifiab|\bconfidentiality\b|\bprivacy\b'
        says: >-
          which details of the patient the report gives, and which it leaves out or blurs so
          that the patient cannot be recognised
        ask: >-
          Which details about the patient will the report give, and which will you leave out
          or blur so that no one can recognise them?
        explain: >-
          A rare condition, a date and a town can be enough to identify a patient without
          their name. Deciding what to leave out before writing protects them.
        source: CARE 2013 checklist, item 5
        url: https://www.care-statement.org/checklist
        read_on: 2026-11-27
      - id: timeline
        heading: '(?i)\btime[- ]?lines?\b|\bchronolog'
        says: >-
          the important dates and events of the case, in order, set out as a table or a figure
        ask: >-
          What were the important dates and events of the case, in order, and will you show
          them as a table or a figure?
        explain: >-
          A timeline lets a reader see what came first, the symptom, the test, the treatment
          or the change, and judge what may have led to what.
        source: CARE 2013 checklist, item 7
        url: https://www.care-statement.org/checklist
        read_on: 2026-11-27
      - id: diagnostic assessment
        heading: '(?i)\bdiagnos'
        says: >-
          how the diagnosis was reached: the tests used, the difficulties met, the other
          diagnoses considered and, where it applies, the prognosis
        ask: >-
          How was the diagnosis reached: which tests, which other diagnoses were considered
          and ruled out, and what made it hard?
        explain: >-
          A reader can trust the diagnosis, and learn from the case, only if they can see how
          it was reached and what else it might have been.
        source: CARE 2013 checklist, item 8
        url: https://www.care-statement.org/checklist
        read_on: 2026-11-27
      - id: patient perspective
        heading: '(?i)\bpatient(?:''s|s''|s|’s)?\s+(?:perspectives?|views?|voice|experiences?|account)\b|\bperspective of the patient'
        says: >-
          whether the patient gives their own account of what they went through and of their
          care, and how it is asked for
        ask: >-
          Will the patient describe, in their own words, what they went through and what they
          thought of their care?
        explain: >-
          The patient sees what the clinicians do not: how the illness and its treatment felt,
          and what mattered to them.
        source: CARE 2013 checklist, item 12
        url: https://www.care-statement.org/checklist
        read_on: 2026-11-27
      - id: informed consent
        heading: '(?i)\bconsent'
        says: >-
          that the patient, or whoever may decide for them, agreed to the report's
          publication, and how that is recorded
        ask: >-
          Has the patient, or the person who can decide for them, agreed in writing to the
          case being published?
        explain: >-
          Most journals ask for this consent before they publish a case report, and whether
          their story is told is the patient's to decide.
        source: CARE 2013 checklist, item 13
        url: https://www.care-statement.org/checklist
        read_on: 2026-11-27

  case-series:
    label: descriptive case series
    describes: >-
      several patients who share a condition, an exposure or a treatment are described
      together, with no comparison group of their own
    guidelines: [PROCESS, Kempen]
    sections:
      - id: case selection
        heading: '(?i)\bcase[- ]?(?:selection|identification|finding|ascertainment)\b|\bselection of (?:the )?cases\b|\bconsecutive|\brecruit'
        says: >-
          how the cases are found and chosen: from which records or referrals, over which
          period, and whether the series holds every case seen or only some
        ask: >-
          How will you find the cases, from which records or referrals and over which
          period, and will the series hold every case or only some?
        explain: >-
          A series of every patient seen tells more than one of the patients who did well.
          Saying how the cases were found lets a reader judge which it is.
        source: PROCESS 2023 checklist, items 6c to 6f
        url: https://doi.org/10.1097/JS9.0000000000000940
        read_on: 2026-11-28
      - id: follow-up
        heading: '(?i)\bfollow[- ]?up'
        says: >-
          how long and how often each patient is followed, by what means, and how those lost
          to follow-up are counted and explained
        ask: >-
          How long and how often will each patient be followed, and how will you count and
          explain those lost to follow-up?
        explain: >-
          An outcome that comes late is missed if follow-up stops early, and the patients
          lost to follow-up may be those who did worst.
        source: PROCESS 2023 checklist, items 6l and 7c
        url: https://doi.org/10.1097/JS9.0000000000000940
        read_on: 2026-11-28
      - id: comparison
        # The comparison an analysis makes ("multiple comparisons", "comparison of outcomes")
        # is not the series' own (round 1 of #849).
        heading: '(?i)\bcomparators?\b|\bcomparisons? (?:with|to|against)\b|\bcomparison (?:groups?|cohorts?|series)\b|\b(?:external|historical) (?:comparisons?|comparators?|controls?|cohorts?|series|data)\b|\bbenchmarks?\b|^\W*(?:(?:\d+(?:\.\d+)*|[A-Za-z]|[IVXivx]+)[.)]\s*|\d+(?:\.\d+)*\s+)?(?:the\s+)?comparisons?(?:\s*\([^()]*\))?\W*$'
        says: >-
          what the results are set against, published studies, the current standard of care
          or a historical group, and why it is comparable
        ask: >-
          What will you compare the results with, published studies, the current standard
          of care or a historical group, and why is it comparable?
        explain: >-
          A case series has no comparison group of its own, so its results mean little until
          they are set against what happens without the treatment or the exposure.
        source: PROCESS 2023 checklist, item 8b
        url: https://doi.org/10.1097/JS9.0000000000000940
        read_on: 2026-11-28
      - id: consent and ethics
        heading: '(?i)\bconsent|\bethic'
        says: >-
          whether an ethics committee approves the study or waives its approval, and how
          the patients' consent is obtained, or why it is not
        ask: >-
          Does the study need an ethics committee's approval, and how will you obtain each
          patient's consent, or why is it not needed?
        explain: >-
          Journals ask for both. A review of records may need no consent from each patient,
          and it is usually an ethics committee that decides so.
        source: PROCESS 2023 checklist, items 6b and 11
        url: https://doi.org/10.1097/JS9.0000000000000940
        read_on: 2026-11-28

  # SRQR's items read in its supplement (links.lww.com/ACADMED/A218), which the AAMC
  # holds the copyright of, and COREQ's in the checklist EQUATOR links to; neither paper
  # gives a licence, so both are cited by item. Each section's heading words are those of
  # the Methods headings of 171 open-access qualitative protocols and studies at Europe PMC,
  # read on 2026-11-28, kept narrow: a heading they miss names its section exactly.
  qualitative:
    label: qualitative study
    describes: >-
      people's experiences, views or practices are explored through what they say or do,
      in interviews, focus groups, observation or documents, and analysed as words rather
      than numbers
    guidelines: [SRQR, COREQ]
    not_asked:
      exposure: >-
        a qualitative study explores how people experience or understand something, and
        compares no treatment or exposure with another
      outcome: >-
        a qualitative study measures no outcome and names no main one: what it reports are
        the themes or the account its analysis develops
      analysis: >-
        a qualitative study fits no statistical model, and its analysis is asked for in its
        own words, as the analytic approach
    sections:
      - id: sampling and saturation
        heading: '(?i)\bsampl(?:e|es|ing)\b(?!\s+bias)|\brecruit|\bsaturat|\bparticipant selection|\bselection of (?:the )?(?:interview |study )?participants'
        says: >-
          whom the study asks to take part and why, how they are approached, how many are
          expected, and how the team will decide that no more are needed
        ask: >-
          Whom will you ask to take part, chosen how and why, and how will you decide that
          you have enough participants?
        explain: >-
          A qualitative sample is chosen for what its members can tell, not to stand for a
          population. Saying how they were chosen, and when sampling stopped, lets a reader
          judge whose views the findings hold.
        source: SRQR, item 8; COREQ, items 10 to 13 and 22
        url: https://doi.org/10.1097/ACM.0000000000000388
        read_on: 2026-11-28
      - id: data collection
        heading: '(?i)\bdata (?:collection|generation)\b|\binterview(?:s|ing)?\b|\b(?:FGDs?|IDIs?|KIIs?)\b|\bfocus[- ]groups?\b|\b(?:topic|discussion) (?:guides?|lists?)\b|\bfield ?(?:notes|work)\b|\bobservations?\b'
        says: >-
          how the data are collected, by interviews, focus groups, observation or
          documents: by whom, where and for how long, with which topic guide, how it is
          recorded, and how the guide may change as the study goes
        ask: >-
          How will you collect the data, who will lead the interviews or groups, with which
          questions or topic guide, and how will you record them?
        explain: >-
          What people say depends on what they are asked, by whom and where. The topic
          guide and the way the talk is recorded let a reader see how the data came about.
        source: SRQR, items 10 and 11; COREQ, items 14, 15 and 17 to 21
        url: https://doi.org/10.1097/ACM.0000000000000388
        read_on: 2026-11-28
      - id: analytic approach
        heading: '(?i)\banaly(?:sis|ses|tic|tical|sing|zing|sed|zed)\b|\bcod(?:ing|ebooks?)\b'
        says: >-
          how the recordings are transcribed and the data analysed: the approach, such as
          thematic, framework or content analysis, how the data are coded and themes
          developed, by how many people, and with what software
        ask: >-
          How will you analyse what you collect: which approach, who will code the data,
          and how will themes be developed from the codes?
        explain: >-
          Two teams can read the same transcripts differently. Naming the approach and the
          steps from codes to themes lets a reader follow how the findings were reached.
        source: SRQR, items 13 and 14; COREQ, items 24 to 27
        url: https://doi.org/10.1097/ACM.0000000000000388
        read_on: 2026-11-28
      - id: reflexivity
        heading: '(?i)\breflexiv|\bpositionality\b|\bresearch team\b|\b(?:researchers?|interviewers?|investigators?)(?:[''’]s?)? (?:characteristics|backgrounds?|roles?|positions?|training)\b|\brelationships? (?:with|to) (?:the )?participants\b'
        says: >-
          who the researchers are, their training, roles and relationship with the
          participants, and how their own views and position may shape the data and the
          analysis
        ask: >-
          Who will collect and analyse the data, what is their relationship with the
          participants, and how might their own views shape what they find?
        explain: >-
          In qualitative research the researcher is part of how the data come about. A
          clinician interviewing their own patients hears different things from a stranger,
          and a reader needs to know which it was.
        source: SRQR, item 6; COREQ, items 1 to 8
        url: https://doi.org/10.1097/ACM.0000000000000388
        read_on: 2026-11-28
      - id: trustworthiness
        heading: '(?i)\btrustworth|\brigou?r\b|\bcredibility\b|\bmember[- ]?check|\btransferability\b|\bdependability\b|\bconfirmability\b|\btriangulat|\baudit trail\b'
        says: >-
          what is done to make the findings credible, such as a second coder, an audit
          trail, triangulation of sources or checking the findings with the participants
        ask: >-
          What will you do to show that the findings are sound, such as having a second
          person code the data or checking the findings with the participants?
        explain: >-
          A qualitative study has no P value or interval to say how far its findings can be
          trusted. Testing them against the data, and against other people's reading of it,
          does that work.
        source: SRQR, item 15; COREQ, items 23 and 28
        url: https://doi.org/10.1097/ACM.0000000000000388
        read_on: 2026-11-28
      - id: consent and ethics
        heading: '(?i)\bconsent|\bethic'
        says: >-
          whether an ethics committee approves the study or waives its approval, how each
          participant's consent is obtained, and how what they say is kept confidential
        ask: >-
          Does the study need an ethics committee's approval, how will you obtain each
          participant's consent, and how will you keep what they tell you confidential?
        explain: >-
          Participants may say things they would not want traced back to them. Journals ask
          for the committee's approval and the consent, and a quote in the paper must not
          identify the person who said it.
        source: SRQR, item 9
        url: https://doi.org/10.1097/ACM.0000000000000388
        read_on: 2026-11-28

  self-controlled:
    label: self-controlled design (case series or case-crossover)
    describes: >-
      each person is their own comparison, at times of exposure and at other times
    guidelines: [STROBE, RECORD]
    sections:
      - id: observation period
        heading: '(?i)\bobservation'
        says: the period over which each case's events and exposures are known, and when it starts and ends
        ask: >-
          Over what period will each person's exposures and events be observed, and when does
          that period start and end?
        explain: >-
          Each person is compared with themselves over time, so the period observed decides
          which times can be compared.
        source: Petersen, Douglas and Whitaker, BMJ 2016;354:i4515, the set-up of a self-controlled case series
        url: https://doi.org/10.1136/bmj.i4515
        read_on: 2026-10-15
      - id: risk windows
        heading: '(?i)\b(risk|exposure|focal|referent|control) (window|period)s?\b'
        says: >-
          the risk windows and their lengths, and the control time; for a case-crossover,
          the focal and referent windows
        ask: >-
          Which periods after an exposure count as at risk, how long are they, and which
          periods serve as the comparison?
        explain: >-
          The result depends on when the risk is thought to rise and fall. Choosing the
          windows before looking at the events keeps them from being fitted to the data.
        source: Petersen et al. 2016; Cadarette et al., Pharmacoepidemiol Drug Saf 2021, Table 1
        url: https://doi.org/10.1002/pds.5227
        read_on: 2026-10-15
      - id: washout
        heading: '(?i)\bwash[- ]?out|\bpre-?exposure|\binduction|\blag\b'
        says: the induction, lag and washout windows, and any pre-exposure period
        ask: >-
          Are there periods just before or after an exposure that will be set aside or counted
          apart, and how long are they?
        explain: >-
          An effect that starts late, or lingers after the exposure ends, falls in the wrong
          window unless these periods are set out in advance.
        source: Cadarette et al. 2021, section 4 and Figure 1; Petersen et al. 2016, Table 1
        url: https://doi.org/10.1002/pds.5227
        read_on: 2026-10-15
      - id: time-varying adjustment
        heading: '(?i)\bage\b|\bseason|\bcalendar|\btime[- ]varying'
        says: how the observation period is cut by age, season or calendar time
        ask: >-
          How will you allow for what changes over time, such as age or the season?
        explain: >-
          The design removes the differences between people, not the changes within a person
          over time; those have to be allowed for.
        source: Petersen et al. 2016, the set-up and the assumption of constant rates
        url: https://doi.org/10.1136/bmj.i4515
        read_on: 2026-10-15
      - id: assumptions
        heading: '(?i)\bassumption|\bevent[- ]dependent'
        says: >-
          how event-dependent exposure, an event that ends observation, and recurrent events
          are handled
        ask: >-
          What will you do when an event changes the chance of a later exposure, ends the
          observation, or happens more than once?
        explain: >-
          The design rests on assumptions that each of these can break. Saying how each is
          handled lets a reader judge whether the result holds.
        source: Petersen et al. 2016, the assumptions of the design and Table 1
        url: https://doi.org/10.1136/bmj.i4515
        read_on: 2026-10-15

  disproportionality:
    label: disproportionality analysis
    describes: >-
      the reports of suspected adverse reactions to a drug are compared with the reports for
      other drugs
    guidelines: [READUS-PV]
    sections:
      - id: deduplication
        heading: '(?i)duplicat|\bpre-?processing|\bcleaning'
        says: how duplicate reports are found and removed, and every other choice made in preparing the data
        ask: >-
          How will you find and remove duplicate reports, and what other choices will you make
          in preparing the data?
        explain: >-
          The same case is often reported more than once. Duplicates swell the counts and can
          make a signal that is not there.
        source: READUS-PV, item 5b and its explanation
        url: https://doi.org/10.1007/s40264-024-01421-9
        read_on: 2026-10-15
      - id: case definition
        heading: '(?i)\bcase definition|\bcase selection|\bevent selection|\bdrugs? and events?'
        says: >-
          the events and the drugs as they are coded, how they are grouped, and which roles
          of a drug (suspect, concomitant) count
        ask: >-
          Which events and which drugs will you count, how are they coded and grouped, and
          does a drug count when it was taken alongside the suspected one?
        explain: >-
          Which terms and which drugs count changes the number in every cell of the
          comparison.
        source: READUS-PV, items 6a and 6c
        url: https://doi.org/10.1007/s40264-024-01421-9
        read_on: 2026-10-15
      - id: comparator
        heading: '(?i)\bcomparator|\breference group|\bcomparison group'
        says: the reference group the reports are compared with, and why it is that one
        ask: >-
          Which reports will the drug's reports be compared with, and why those?
        explain: >-
          A measure of disproportionality is a comparison with a reference group, and another
          reference can give another answer.
        source: READUS-PV, item 3, and its explanation of items 7a, 7b and 8b
        url: https://doi.org/10.1007/s40264-024-01421-9
        read_on: 2026-10-15
      - id: measure
        # The measure the paper estimates, numbered or not, and not the "Outcome measures",
        # "Data quality measures" or "Disproportionality analysis" such a plan has.
        heading: '(?i)^[\W\d]*(?:(?:primary|main|choice of|the|disproportionality|statistical)\s+)*measures?\b(?!\s+of\s+(?:\w+\s+)?(?:outcomes?|exposures?)\b)|\bmeasures? of disproportionality|\bdisproportionality measures?\b|\bsignal (?:threshold|detection|criteri)'
        says: the measure of disproportionality and any threshold, with the reasons
        ask: >-
          Which measure of disproportionality will you use, and what threshold, if any, counts
          as a signal?
        explain: >-
          Measures and thresholds differ in how readily they flag a drug. Chosen afterwards,
          they could be chosen for the answer they give.
        source: READUS-PV, item 7b
        url: https://doi.org/10.1007/s40264-024-01421-9
        read_on: 2026-10-15
      - id: sensitivity analyses
        heading: '(?i)\bsensitivity|\bconfound|\bstratif|\brestrict'
        says: the restrictions, subgroups, stratifications and adjustments, and any case-by-case review
        ask: >-
          Which restrictions, subgroups or adjustments will check the result, and will any
          cases be reviewed one by one?
        explain: >-
          Spontaneous reports carry many known biases. Checks planned in advance show whether
          a signal survives them.
        source: READUS-PV, items 7c and 7d
        url: https://doi.org/10.1007/s40264-024-01421-9
        read_on: 2026-10-15

  systematic-review:
    label: systematic review
    describes: >-
      the studies of a question are searched for, appraised and summed up by a method stated
      in advance
    guidelines: [PRISMA]
    protocol: [PRISMA-P]
    sections:
      - id: eligibility
        heading: '(?i)\beligib|\binclusion|\bexclusion'
        says: the eligibility criteria, as population, intervention, comparator, outcome, design, setting, time frame, language and publication status
        ask: >-
          Which studies will be included: which population, intervention, comparison,
          outcomes, designs, settings, years and languages?
        explain: >-
          Criteria fixed in advance stop studies from being kept or dropped by what they
          found.
        source: PRISMA-P 2015, item 8
        url: https://doi.org/10.1186/2046-4053-4-1
        read_on: 2026-10-15
      - id: search
        heading: '(?i)\bsearch|\binformation sources|\bdatabases'
        says: the databases, registers and other sources with their dates, and a draft search for one database
        ask: >-
          Where will you search (databases, registers, other sources), over which dates, and
          with what search terms?
        explain: >-
          A reader needs to be able to run the search again and see what it could have missed.
        source: PRISMA-P 2015, items 9 and 10
        url: https://doi.org/10.1186/2046-4053-4-1
        read_on: 2026-10-15
      - id: selection and extraction
        heading: '(?i)\bselection|\bscreening|\bdata (collection|extraction)'
        says: how records are screened and selected, by how many reviewers, and what data are extracted
        ask: >-
          How will records be screened and chosen, by how many reviewers, and what will you
          record from each study?
        explain: >-
          Two reviewers working apart catch the errors one makes, and data chosen in advance
          are taken the same way from every study.
        source: PRISMA-P 2015, items 11a to 13
        url: https://doi.org/10.1186/2046-4053-4-1
        read_on: 2026-10-15
      - id: risk of bias
        heading: '(?i)\brisk of bias|\bquality assessment|\bappraisal'
        says: how the risk of bias of each study is assessed, and with which tool
        ask: >-
          How will you judge the risk of bias of each study included, and with which tool?
        explain: >-
          A review is as reliable as the studies in it. Judging each with a named tool shows
          how far the combined result can be trusted.
        source: PRISMA-P 2015, item 14
        url: https://doi.org/10.1186/2046-4053-4-1
        read_on: 2026-10-15
      - id: synthesis
        heading: '(?i)\bsynthesis|\bmeta-?analys'
        says: when the results are combined and how, the heterogeneity, and the summary where they are not
        ask: >-
          When will you combine the results, how, and what will you do when the studies differ
          too much to combine?
        explain: >-
          Whether to pool, and how, changes the answer. Decided before the results are seen,
          the method cannot be picked for the answer it gives.
        source: PRISMA-P 2015, items 15a to 15d
        url: https://doi.org/10.1186/2046-4053-4-1
        read_on: 2026-10-15
      - id: certainty
        heading: '(?i)\bcertainty|\bconfidence in|\bgrade\b|\bmeta-?bias|\bpublication bias'
        says: how meta-bias is assessed, and the confidence in the body of evidence
        ask: >-
          How will you look for studies that are missing or reported in part, and how will you
          rate your confidence in the evidence as a whole?
        explain: >-
          Studies that found nothing are published less often. Rating the certainty of the
          evidence tells a reader how much weight the conclusion can bear.
        source: PRISMA-P 2015, items 16 and 17
        url: https://doi.org/10.1186/2046-4053-4-1
        read_on: 2026-10-15

  prediction-model:
    label: prediction model
    describes: >-
      a model is built or tested that predicts an outcome for each person
    guidelines: [TRIPOD]
    sections:
      - id: predictors
        heading: '(?i)\bpredictors?\b|\bcandidate variables|\bfeatures'
        says: how the predictors are chosen, defined and measured, and when
        ask: >-
          Which predictors will the model use, and how will they be chosen, defined and
          measured, and when?
        explain: >-
          A predictor measured otherwise, or later, than it would be in practice gives a model
          that works in the study and not in use.
        source: TRIPOD+AI, items 9a and 9b
        url: https://doi.org/10.1136/bmj-2023-078378
        read_on: 2026-10-15
      - id: sample size
        heading: '(?i)\bsample size'
        says: how the size of each dataset was arrived at
        ask: >-
          How many people, and how many with the outcome, will the model be built and tested
          on, and how was that number arrived at?
        explain: >-
          A model built on too few outcomes learns the noise of its data and predicts poorly
          elsewhere.
        source: TRIPOD+AI, item 10
        url: https://doi.org/10.1136/bmj-2023-078378
        read_on: 2026-10-15
      - id: missing data
        heading: '(?i)\bmissing'
        says: how missing data will be handled
        ask: >-
          What will you do about people with missing values?
        explain: >-
          How missing values are handled when the model is built should match how they can be
          handled when it is used.
        source: TRIPOD+AI, item 11
        url: https://doi.org/10.1136/bmj-2023-078378
        read_on: 2026-10-15
      - id: model development
        heading: '(?i)\bdevelopment|\binternal validation|\btuning'
        says: >-
          how the data are split, the predictors handled, the model chosen and tuned, and how
          it is validated internally
        ask: >-
          How will the data be split, the predictors handled, the model chosen and tuned, and
          its performance checked within the data?
        explain: >-
          Each of these choices can make a model look better than it is. Fixed in advance, and
          checked on data the model was not built on, they keep its measured performance true
          to its real one.
        source: TRIPOD+AI, items 12a to 12d and 13
        url: https://doi.org/10.1136/bmj-2023-078378
        read_on: 2026-10-15
      - id: performance
        heading: '(?i)\bperformance|\bdiscrimination|\bcalibration|\bexternal validation'
        says: the measures of discrimination, calibration and others, and how the model would be updated
        ask: >-
          How will you measure how well the model predicts (discrimination, calibration and
          others), and how would it be updated?
        explain: >-
          A model can rank people well and still give them the wrong probabilities, so both
          are measured before it is relied on.
        source: TRIPOD+AI, items 12e to 12g
        url: https://doi.org/10.1136/bmj-2023-078378
        read_on: 2026-10-15
      - id: fairness
        heading: '(?i)\bfairness|\bequity'
        says: how the model's fairness across groups is assessed, and why that way
        ask: >-
          How will you check that the model works as well for each group of people, and why
          that way?
        explain: >-
          A model that works on average can work poorly for some groups. Checked in advance,
          it shows whether the model can be used for everyone it is meant for.
        source: TRIPOD+AI, item 14
        url: https://doi.org/10.1136/bmj-2023-078378
        read_on: 2026-10-15
