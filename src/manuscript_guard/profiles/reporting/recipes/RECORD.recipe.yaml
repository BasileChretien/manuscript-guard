# RECORD extends STROBE. This profile holds only the RECORD-specific items; a project using
# RECORD lists both STROBE and RECORD in paper.yaml, so both sets are checked.
#
# The document interleaves the two: column 2 repeats the STROBE recommendation, column 4
# carries the extension item, which names itself ("RECORD 1.1: ..."). named_id reads the
# identifier out of the text and drops the prefix.

