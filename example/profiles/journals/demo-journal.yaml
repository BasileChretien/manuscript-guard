schema: manuscript-guard/journal/1

# INVENTED FOR THE WORKED EXAMPLE. There is no such journal, and these are not any real
# journal's guidelines.
#
# No real journal profile ships with manuscript-guard. Author guidelines change without
# announcement, and a profile compiled into the tool would be wrong eventually and
# silently. The journal-profile skill reads the journal's own instructions page and writes
# the profile, stamped with the date it was read; the gate warns when that date is over a
# year old.

name: "Journal of Demonstrative Pharmacoepidemiology"
publisher: "Nobody"
source_url: "https://example.invalid/demo-journal/instructions"
retrieved_on: 2026-08-03
retrieved_by: "invented for the manuscript-guard example"
# The page as stored when the profile was filled: profiles/journals/sources/demo-journal.txt.
page_sha256: aa948d6523f6ade30c4a791ac022f54759fdb93af70ea1a10f0ad6cc5f6c7731
article_type: "Original research"
english_variant: en-GB

limits:
  abstract_words: 300
  main_text_words: 3500
  references: 50
  figures: 4
  tables: 4

structure:
  required_sections:
    - Introduction
    - Methods
    - Results
    - Discussion

required_statements:
  - id: data-availability
    pattern: '(?im)^#+\s*data availability'
    why: "The journal requires a data availability statement in every research article."
  - id: funding
    pattern: '(?im)^#+\s*funding'
    why: "Funding must be declared, including when there was none."
  - id: competing-interests
    pattern: '(?im)^#+\s*(competing|conflicts? of) interest'
    why: "All authors must declare competing interests."

references:
  style_name: "Vancouver"
  numbered: true

reporting_guidelines:
  - DEMO-OBS

# Each rule above, in the words of the stored page; G4 holds every quote to it.
quotes:
  english_variant: "Write in British English throughout."
  limits.abstract_words: "Abstracts should not exceed 300 words."
  limits.main_text_words: "should not exceed 3500 words"
  limits.references: "Cite no more than 50 references."
  limits.figures: "Include no more than four figures"
  limits.tables: "no more than four tables"
  structure.required_sections: >-
    Organise the article under the headings Introduction, Methods, Results and Discussion.
  required_statements.data-availability: >-
    Every research article must include a data availability statement.
  required_statements.funding: "Declare all sources of funding, including where there was none."
  required_statements.competing-interests: "All authors must declare their competing interests."
  references: >-
    Cite in the Vancouver style, with references numbered in the order they are first cited.
  reporting_guidelines: >-
    Observational studies follow the DEMO-OBS checklist, completed and submitted with the
    manuscript.

# The page's rules that no gate checks, quoted so that none is dropped.
manual:
  - rule: cover letter
    quote: "Send a cover letter of no more than one page with every submission."

notes:
  - "Invented. Do not submit anything anywhere on the strength of this file."
  - "A real profile records the things a build cannot check: cover letter contents, suggested reviewers, submission portal quirks."
